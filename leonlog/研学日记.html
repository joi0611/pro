<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Leon旅行日记公开研学长页，展示已发布的文字、照片、视频与录音。">
<title>完整研学日记 · Leon旅行日记</title><link rel="stylesheet" href="assets/leon-vi.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{overflow-x:hidden}.page{width:min(980px,calc(100% - 30px));margin:auto;padding:22px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.back{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:2px solid var(--vi-border);border-radius:17px 13px 20px 14px;background:#fff;color:var(--vi-sky-700);font-weight:800;text-decoration:none;box-shadow:3px 4px 0 var(--vi-shadow)}.brand{color:var(--vi-muted);font:800 15px/1.2 var(--vi-font-hand)}
.hero{position:relative;min-height:460px;display:grid;place-items:end start;padding:clamp(28px,7vw,72px);overflow:hidden;border:2px solid var(--vi-border);border-radius:20px 31px 22px 35px;background:var(--vi-sky-100);box-shadow:10px 12px 0 var(--vi-shadow)}.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,54,70,.05),rgba(18,54,70,.8))}.hero-copy{position:relative;z-index:2;max-width:760px;color:#fff}.kicker{font:800 12px/1.4 monospace;letter-spacing:.15em}.hero h1{max-width:18ch;margin:10px 0 12px;font-size:clamp(40px,7vw,72px);line-height:1.02;text-wrap:balance}.meta{display:flex;gap:10px;flex-wrap:wrap}.meta span{padding:6px 10px;border:1px solid #ffffff99;border-radius:99px;background:#ffffff20;font-size:13px;backdrop-filter:blur(7px)}
.paper{position:relative;margin-top:42px;padding:clamp(24px,5vw,54px);background:#fff;border:2px solid var(--vi-border);border-radius:16px 25px 18px 29px;box-shadow:8px 9px 0 var(--vi-shadow)}.paper:before{content:"";position:absolute;top:-11px;left:10%;width:100px;height:28px;background:#b8ddea99;transform:rotate(-6deg)}.summary{margin:0;padding:18px 20px;border-left:5px solid var(--vi-sky-500);background:var(--vi-sky-100);border-radius:4px 18px 13px 5px;color:var(--vi-ink);font-size:clamp(17px,2vw,20px);line-height:1.9}.story{margin-top:28px}.story p{margin:0 0 18px;color:var(--vi-ink);font-size:17px;line-height:2;white-space:pre-wrap}.story .empty{color:var(--vi-muted)}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}.media{margin:0;padding:10px;background:#fff;border:2px solid var(--vi-border);border-radius:14px 21px 16px 24px;box-shadow:5px 6px 0 var(--vi-shadow);overflow:hidden}.media img,.media video{display:block;width:100%;max-height:720px;object-fit:cover;border-radius:9px 15px 11px 18px}.media.long{grid-column:1/-1}.media.long img{max-height:none;object-fit:contain}.media.audio{grid-column:1/-1;padding:18px}.media audio{width:100%}.media figcaption{padding:10px 4px 2px;color:var(--vi-muted);font-size:13px}.state{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--vi-muted)}.state-box{max-width:520px;padding:34px;background:#fff;border:2px solid var(--vi-border);border-radius:17px 25px 19px 29px;box-shadow:7px 8px 0 var(--vi-shadow)}.state h1{margin:0 0 10px;color:var(--vi-ink)}.state a{color:var(--vi-sky-700);font-weight:800}.hidden{display:none!important}footer{display:flex;justify-content:space-between;gap:15px;margin-top:42px;padding-top:18px;border-top:2px dashed var(--vi-border);color:var(--vi-muted);font-size:13px}:focus-visible{outline:4px solid var(--vi-focus);outline-offset:3px}
@media(max-width:680px){.page{width:min(100% - 20px,640px);padding-top:12px}.brand{display:none}.hero{min-height:390px;padding:25px}.gallery{grid-template-columns:1fr}.media.long,.media.audio{grid-column:auto}.paper{margin-top:30px}footer{flex-direction:column;gap:6px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main class="page">
<div class="top"><a class="back" id="back-link" href="云南研学地图.html">← 返回研学目录</a><span class="brand">Leon旅行日记 · 公开日记</span></div>
<div class="state" id="loading"><div class="state-box">正在翻开研学日记…</div></div>
<div class="state hidden" id="not-found"><div class="state-box"><h1>这篇日记还在整理</h1><p>主人尚未公开发布，过一段时间再来看看吧。</p><a href="云南研学地图.html">返回云南研学地图</a></div></div>
<article class="hidden" id="journal">
  <header class="hero"><img class="hero-bg" id="hero-image" src="assets/dounan_1.jpg" alt=""><div class="hero-copy"><span class="kicker">LEON'S PUBLISHED JOURNAL</span><h1 id="journal-title"></h1><div class="meta"><span id="journal-place"></span><span id="journal-date"></span></div></div></header>
  <section class="paper"><p class="summary" id="journal-summary"></p><div class="story" id="journal-story"></div></section>
  <section class="gallery" id="journal-gallery" aria-label="研学照片、视频与录音"></section>
  <footer><strong>Leon旅行日记</strong><span>把走过的路，画进手帐里。</span></footer>
</article>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/leon-backend.js"></script>
<script>
const PLACES={'kunming-dounan':{back:'云南昆明研学日记.html',cover:'assets/dounan_1.jpg',alt:'昆明斗南花市入口'},'dali-xizhou':{back:'云南大理研学日记.html',cover:'assets/xizhou_town1.jpg',alt:'大理喜洲古镇的白族民居与田野'}};
const slug=new URLSearchParams(location.search).get('slug')||'kunming-dounan',place=PLACES[slug]||PLACES['kunming-dounan'];document.getElementById('back-link').href=place.back;document.getElementById('hero-image').src=place.cover;document.getElementById('hero-image').alt=place.alt;
function publicUrl(storagePath){const slash=storagePath.indexOf('/'),bucket=storagePath.slice(0,slash),path=storagePath.slice(slash+1);return leonSupabase.storage.from(bucket).getPublicUrl(path).data.publicUrl}
function addMedia(item){const figure=document.createElement('figure');figure.className='media '+(item.kind==='long_image'?'long':item.kind==='audio'?'audio':'');const url=publicUrl(item.storage_path);let element;if(item.kind==='video'){element=document.createElement('video');element.controls=true;element.preload='metadata';element.playsInline=true;element.src=url}else if(item.kind==='audio'){element=document.createElement('audio');element.controls=true;element.preload='none';element.src=url}else{element=document.createElement('img');element.loading='lazy';element.src=url;element.alt=item.label||'Leon研学照片'}figure.append(element);if(item.label){const caption=document.createElement('figcaption');caption.textContent=item.label;figure.append(caption)}document.getElementById('journal-gallery').append(figure)}
async function loadJournal(){const {data:trip,error}=await leonSupabase.from('leon_trips').select('*').eq('slug',slug).eq('status','published').maybeSingle();document.getElementById('loading').classList.add('hidden');if(error||!trip){document.getElementById('not-found').classList.remove('hidden');return}document.title=trip.title+' · Leon旅行日记';document.getElementById('journal-title').textContent=trip.title;document.getElementById('journal-place').textContent=trip.province+' · '+trip.city;document.getElementById('journal-date').textContent=trip.trip_date?new Date(trip.trip_date+'T00:00:00').toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}):'研学日期待补充';const summary=trip.handbook_data?.summary||'这是一段值得慢慢翻阅的研学旅程。';document.getElementById('journal-summary').textContent=summary;const story=document.getElementById('journal-story'),notes=(trip.handbook_data?.notes||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);if(notes.length)notes.forEach(text=>{const p=document.createElement('p');p.textContent=text;story.append(p)});else{const p=document.createElement('p');p.className='empty';p.textContent='主人正在补充当天的研学故事。';story.append(p)}const {data:media}=await leonSupabase.from('leon_media').select('*').eq('trip_id',trip.id).eq('is_public',true).order('sort_order').order('created_at');(media||[]).forEach(addMedia);document.getElementById('journal').classList.remove('hidden')}
loadJournal();
</script></body></html>
