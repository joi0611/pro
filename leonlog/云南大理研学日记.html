<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Leon云南大理研学主目录，从大理进入喜洲古镇研学手册。">
<title>大理研学主目录 · Leon旅行日记</title>
<link rel="stylesheet" href="assets/leon-vi.css">
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{overflow-x:hidden}
  .page{width:min(1120px,calc(100% - 32px));margin:auto;padding:22px 0 54px}
  .back{display:inline-flex;align-items:center;min-height:44px;padding:8px 15px;border:2px solid var(--vi-border);border-radius:18px 14px 20px 13px;background:#fff;color:var(--vi-sky-700);font-weight:800;text-decoration:none;box-shadow:3px 4px 0 var(--vi-shadow);transition:transform .2s ease,box-shadow .2s ease}
  .back:hover,.back:focus-visible{transform:translateY(-2px);box-shadow:5px 6px 0 var(--vi-shadow)}
  .hero{position:relative;display:grid;grid-template-columns:1.05fr .95fr;min-height:430px;margin-top:20px;overflow:hidden;background:var(--vi-sky-100);border:2px solid var(--vi-border);border-radius:25px 18px 30px 20px;box-shadow:10px 12px 0 var(--vi-shadow)}
  .hero::before,.hero::after{content:"";position:absolute;z-index:3;width:92px;height:25px;background:#b8ddea99}.hero::before{top:9px;left:7%;transform:rotate(-7deg)}.hero::after{right:5%;bottom:9px;transform:rotate(6deg)}
  .hero-copy{align-self:center;padding:clamp(30px,6vw,68px);position:relative;z-index:2}
  .kicker{color:var(--vi-sky-700);font:800 12px/1.4 monospace;letter-spacing:.14em}
  h1{margin:12px 0 18px;color:var(--vi-ink);font-size:clamp(45px,7vw,76px);line-height:.98}
  h1 span{display:block;margin-top:12px;color:var(--vi-sky-700);font-size:.48em;letter-spacing:.04em}
  .hero-copy p{max-width:510px;margin:0;color:var(--vi-muted);font-size:16px;line-height:1.9}
  .hero-photo{min-height:430px;padding:28px;position:relative}
  .hero-photo img{display:block;width:100%;height:100%;min-height:374px;object-fit:cover;border:8px solid #fff;border-radius:9px 18px 12px 20px;box-shadow:5px 6px 0 var(--vi-sky-700);transform:rotate(1.5deg)}
  .stamp{position:absolute;right:16px;bottom:20px;z-index:4;padding:9px 13px;background:var(--vi-yellow);border:2px solid var(--vi-ink);border-radius:50% 45% 52% 48%;font-weight:800;transform:rotate(-5deg)}
  .content{padding:56px clamp(0px,2vw,24px) 0}
  .intro{max-width:760px;margin:0 0 25px;padding:17px 20px;background:#fff;border-left:5px solid var(--vi-sky-500);border-radius:5px 17px 12px 6px;color:var(--vi-muted);line-height:1.85;box-shadow:4px 5px 0 var(--vi-shadow)}
  .journal-link{display:inline-flex;align-items:center;min-height:46px;margin:-5px 0 25px;padding:9px 16px;border:2px solid var(--vi-sky-700);border-radius:13px 18px 14px 17px;background:var(--vi-sky-500);color:#fff;text-decoration:none;font-weight:800;box-shadow:4px 5px 0 var(--vi-shadow);transition:transform .2s ease,box-shadow .2s ease}.journal-link:hover,.journal-link:focus-visible{transform:translateY(-2px);box-shadow:6px 7px 0 var(--vi-shadow)}
  .places{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
  .place{display:grid;grid-template-columns:minmax(240px,.88fr) 1.12fr;min-height:310px;overflow:hidden;background:#fff;border:2px solid var(--vi-border);border-radius:18px 26px 20px 30px;color:var(--vi-ink);text-decoration:none;box-shadow:7px 8px 0 var(--vi-shadow);transition:transform .22s ease,box-shadow .22s ease}
  .place:hover,.place:focus-visible{transform:translate(-2px,-4px) rotate(-.15deg);box-shadow:10px 12px 0 var(--vi-shadow)}
  .place img{width:100%;height:100%;min-height:310px;object-fit:cover}
  .place-copy{display:flex;flex-direction:column;padding:clamp(25px,5vw,48px)}
  .place-label{display:flex;align-items:center;gap:10px;color:var(--vi-sky-700);font-size:13px;font-weight:800;letter-spacing:.08em}
  .place-label svg{width:30px;height:30px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .place h2{margin:16px 0 10px;font-size:clamp(30px,5vw,48px)}
  .place p{margin:0;color:var(--vi-muted);line-height:1.85}
  .go{display:inline-flex;align-items:center;min-height:44px;margin-top:auto;padding-top:20px;color:var(--vi-sky-700);font-weight:800}
  .date{margin-left:10px;color:var(--vi-muted);font-size:13px;font-weight:700}
  footer{display:flex;justify-content:space-between;gap:18px;margin-top:42px;padding:21px 4px 0;border-top:2px dashed var(--vi-border);color:var(--vi-muted);font-size:13px}
  :focus-visible{outline:4px solid var(--vi-focus);outline-offset:4px}
  @media(max-width:760px){.page{width:min(100% - 22px,680px);padding-top:12px}.hero{grid-template-columns:1fr}.hero-copy{padding:34px 24px}.hero-photo{min-height:280px;padding:18px}.hero-photo img{min-height:260px}.content{padding-top:42px}.place{grid-template-columns:1fr}.place img{min-height:230px;max-height:300px}.place-copy{min-height:280px}footer{flex-direction:column;gap:7px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body class="vi-kunming">
<main class="page">
  <a class="back" href="云南研学地图.html" aria-label="返回云南研学地图">← 返回云南研学地图</a>
  <section class="hero" aria-labelledby="dali-title">
    <div class="hero-copy">
      <span class="kicker">LEON'S TRAVEL JOURNAL / CHAPTER 02</span>
      <h1 id="dali-title">云南大理<span>研学手册主目录</span></h1>
      <p>沿着苍山与洱海，走进白族人家的生活。第一站来到喜洲古镇，认识老房子、茶马古道、扎染与喜洲粑粑。</p>
    </div>
    <div class="hero-photo"><img src="assets/xizhou_town1.jpg" alt="喜洲古镇的白族民居与田野"><span class="stamp">大理 · 02</span></div>
  </section>

  <section class="content" aria-labelledby="places-title">
    <p class="intro"><strong>大理研学路线：</strong>从喜洲古镇开始，边走边完成白族文化任务。研学日期、答题进度和照片会保存在当前设备。</p>
    <a class="journal-link" href="研学日记.html?slug=dali-xizhou">查看公开的完整大理研学日记 →</a>
    <div class="places" id="places-title">
      <a class="place" href="喜洲研学手册-网页版.html">
        <img src="assets/xizhou_baiwoman1.jpg" alt="穿着白族服饰的喜洲当地人" loading="lazy">
        <div class="place-copy">
          <span class="place-label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10v9.5h13V10M9 19.5v-5h6v5"></path></svg>
            已解锁 · 喜洲古镇
          </span>
          <h2>喜洲研学手册</h2>
          <p>探索千年古镇、白族民居、茶马古道、三道茶、扎染和喜洲粑粑，完成英语点读与互动任务。</p>
          <span class="go">进入喜洲古镇大冒险 → <span class="date" id="xizhou-date"></span></span>
        </div>
      </a>
    </div>
  </section>
  <footer><strong>Leon旅行日记 · 云南大理</strong><span>把苍山洱海边的故事，慢慢装进行囊。</span></footer>
</main>
<script>
  try{
    const date=JSON.parse(localStorage.getItem('xizhou')||'{}').tripDate;
    if(date){
      const [,month,day]=date.split('-');
      document.getElementById('xizhou-date').textContent=`${Number(month)}月${Number(day)}日 · 已打卡`;
    }
  }catch(error){}
</script>
<script src="assets/leon-owner-flow.js"></script></body>
</html>
