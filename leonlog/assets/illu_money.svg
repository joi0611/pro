<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FFF6ED"/>
  <path d="M0 440 Q 200 420 400 438 T 800 435 V 600 H 0 Z" fill="#F0EAF9"/>
  <!-- 太阳 -->
  <circle cx="96" cy="86" r="40" fill="#FFCE54"/>
  <!-- 周围花影 -->
  <g opacity="0.75">
    <circle cx="140" cy="180" r="16" fill="#FF8CB8"/><circle cx="118" cy="196" r="12" fill="#FFCE54"/>
    <circle cx="666" cy="170" r="16" fill="#BF8CF0"/><circle cx="696" cy="192" r="12" fill="#FF8C5A"/>
    <circle cx="610" cy="230" r="13" fill="#7CC48D"/><circle cx="120" cy="280" r="13" fill="#7CC48D"/>
  </g>
  <!-- 大金币 -->
  <g>
    <circle cx="618" cy="330" r="42" fill="#FFCE54" stroke="#E0A93C" stroke-width="6"/>
    <circle cx="618" cy="330" r="28" fill="none" stroke="#E0A93C" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="618" y="342" font-size="34" fill="#C98A00" text-anchor="middle" font-weight="bold">100</text>
  </g>
  <!-- 记账本 -->
  <g>
    <rect x="470" y="330" width="100" height="120" rx="10" fill="#FFFFFF" stroke="#D8C4EE" stroke-width="4" transform="rotate(-8 520 390)"/>
    <rect x="478" y="340" width="84" height="20" rx="6" fill="#BF8CF0" transform="rotate(-8 520 390)"/>
    <g transform="rotate(-8 520 390)">
      <line x1="484" y1="376" x2="556" y2="376" stroke="#BF8CF0" stroke-width="6" stroke-linecap="round"/>
      <line x1="484" y1="400" x2="556" y2="400" stroke="#BF8CF0" stroke-width="6" stroke-linecap="round"/>
      <line x1="484" y1="424" x2="532" y2="424" stroke="#BF8CF0" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 小男孩盘坐 -->
  <g>
    <circle cx="340" cy="300" r="44" fill="#FFD8B8"/>
    <path d="M302 282 q38 -18 76 0" fill="#B5845E"/>
    <circle cx="322" cy="304" r="5" fill="#5A4632"/><circle cx="356" cy="304" r="5" fill="#5A4632"/>
    <path d="M330 328 q10 10 20 0" stroke="#5A4632" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M332 268 q8 -14 16 -14 q10 0 14 14" fill="#FFCE54"/>
    <!-- 手托腮 -->
    <path d="M356 340 l26 12" stroke="#FFD8B8" stroke-width="12" stroke-linecap="round"/>
    <!-- 身体盘坐 -->
    <path d="M300 344 q-8 40 14 70 h52 q22 -30 14 -70 z" fill="#FFC94D"/>
    <path d="M318 414 q-14 14 -34 10 M366 414 q14 14 34 10" stroke="#E8B96F" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 拿铅笔的手 -->
    <path d="M300 378 h-40" stroke="#FFD8B8" stroke-width="12" stroke-linecap="round"/>
    <rect x="232" y="366" width="60" height="14" rx="7" fill="#E05A3A" transform="rotate(-16 262 373)"/>
    <polygon points="288,351 302,344 298,368" fill="#E8B96F" transform="rotate(-16 262 373)"/>
    <text x="120" y="398" font-size="26" fill="#C98A00" font-weight="bold">✏️ 勾勾画画</text>
  </g>
  <!-- 云与星星 -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="530" cy="90" rx="50" ry="24"/><ellipse cx="490" cy="84" rx="28" ry="18"/>
  </g>
  <text x="400" y="540" font-size="26" fill="#7B4FC4" font-weight="bold" text-anchor="middle">100 元在我手里：先想一想，再决定怎么花</text>
