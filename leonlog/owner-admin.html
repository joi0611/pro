<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Leon旅行日记主人页面：上传已完成日记并审核远方唠唠区留言。"><title>主人页面 · Leon旅行日记</title><link rel="stylesheet" href="assets/leon-vi.css"><style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{overflow-x:hidden}button,a,input,select{font:inherit}.loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--vi-bg);color:var(--vi-sky-700);font-weight:800}.head{border-bottom:2px dashed var(--vi-border);background:#f7fbfdf2}.head-in,.page{width:min(920px,calc(100% - 30px));margin:auto}.head-in{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;color:var(--vi-ink);text-decoration:none;font:800 clamp(20px,3vw,28px)/1 var(--vi-font-hand)}.mark{width:43px;height:43px;display:grid;place-items:center;border:3px solid var(--vi-ink);border-radius:47% 53% 44% 56%;background:var(--vi-sky-500);color:#fff;box-shadow:3px 4px 0 var(--vi-ink);transform:rotate(-5deg)}.logout{min-height:44px;padding:8px 14px;border:2px solid var(--vi-border);border-radius:14px 18px 13px 17px;background:#fff;color:var(--vi-sky-700);font-weight:800;cursor:pointer}.page{padding:34px 0 70px}.intro{margin-bottom:26px}.kicker{color:var(--vi-sky-700);font:800 11px/1.3 monospace;letter-spacing:.14em}.intro h1{margin:8px 0 10px;font-size:clamp(35px,6vw,58px);line-height:1}.intro p{max-width:650px;margin:0;color:var(--vi-muted);line-height:1.8}.card{position:relative;margin-bottom:24px;padding:clamp(20px,4vw,34px);background:#fff;border:2px solid var(--vi-border);border-radius:16px 25px 18px 29px;box-shadow:7px 8px 0 var(--vi-shadow)}.card:before{content:"";position:absolute;top:-10px;left:8%;width:90px;height:25px;background:#b8ddea99;transform:rotate(-6deg)}.card h2{margin:0 0 7px;font-size:clamp(25px,4vw,34px)}.card>p{margin:0 0 18px;color:var(--vi-muted);line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 6px;color:var(--vi-sky-700);font-weight:800}input,select{width:100%;min-height:48px;padding:10px 13px;border:2px solid var(--vi-sky-200);border-radius:12px;background:#fff;color:var(--vi-ink)}input[type=file]{padding:9px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:16px;padding:9px 17px;border:2px solid var(--vi-sky-700);border-radius:13px 18px 14px 17px;background:var(--vi-sky-500);color:#fff;text-decoration:none;font-weight:800;cursor:pointer;transition:transform .2s,box-shadow .2s}.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:4px 5px 0 var(--vi-shadow)}.btn.secondary{background:#fff;color:var(--vi-sky-700)}.btn.reject{border-color:#cf8076;background:#fff;color:#a84035}.helper,.status,.muted{color:var(--vi-muted);font-size:13px;line-height:1.65}.status{min-height:23px;margin:10px 0 0}.success-link{display:none;margin-left:8px}.success-link.show{display:inline-flex}.message{padding:18px 0;border-bottom:2px dashed var(--vi-sky-100)}.message:last-child{border-bottom:0}.message strong{font-size:18px}.message p{margin:7px 0;line-height:1.8}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions .btn{margin-top:10px}.empty{padding:25px;text-align:center;color:var(--vi-muted)}:focus-visible{outline:4px solid var(--vi-focus);outline-offset:3px}@media(max-width:620px){.head-in,.page{width:min(100% - 20px,600px)}.grid{grid-template-columns:1fr}.success-link{margin-left:0}.intro{margin-top:2px}}
</style></head><body><div class="loading" id="loading">正在验证主人身份…</div><header class="head"><div class="head-in"><a class="brand" href="index.html"><span class="mark">L</span><span>Leon旅行日记</span></a><button class="logout" id="logout">退出登录</button></div></header><main class="page"><section class="intro"><span class="kicker">OWNER'S SMALL DESK</span><h1>主人小书桌</h1><p>这里只做两件事：上传已经完成的旅行日记长图，以及审核远方亲友的留言。</p></section>
<form class="card" id="journal-upload"><h2>上传已完成的日记</h2><p>选择地点和日期，上传排版完成的 JPG、PNG 或 WebP 长图。上传完成后会直接出现在该地点的“LEO 的旅行日记（已完成）”。</p><div class="grid"><div><label for="place">旅行地点</label><select id="place"><option value="kunming-dounan">云南昆明 · 斗南花市</option><option value="dali-xizhou">云南大理 · 喜洲古镇</option></select></div><div><label for="trip-date">旅行日期</label><input id="trip-date" type="date" required></div></div><label for="journal-title">日记图片标题</label><input id="journal-title" maxlength="80" placeholder="例如：Leon 的喜洲古镇旅行日记"><label for="journal-file">已完成的日记长图</label><input id="journal-file" type="file" accept="image/jpeg,image/png,image/webp" required><p class="helper">建议宽度 1200–1800 像素、单张不超过 30MB。这里只上传最终完成版，不需要再填写正文。</p><button class="btn" type="submit">上传并公开日记</button><a class="btn secondary success-link" id="preview" target="_blank" rel="noopener">查看公开页面</a><p class="status" id="upload-status" role="status"></p></form>
<section class="card"><h2>远方唠唠区审批</h2><p>只有通过的留言才会显示在旅行地图首页。</p><div id="message-list"><p class="empty">正在读取留言…</p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/leon-backend.js"></script><script>
const PLACES={'kunming-dounan':{province:'云南',city:'昆明',title:'昆明斗南花市旅行日记'},'dali-xizhou':{province:'云南',city:'大理',title:'大理喜洲古镇旅行日记'}};let ownerSession=null;document.getElementById('logout').onclick=async()=>{await leonSupabase.auth.signOut();location.replace('owner-login.html')};
async function requireOwner(){const {data:{session}}=await leonSupabase.auth.getSession();if(!session)return location.replace('owner-login.html');const {data,error}=await leonSupabase.from('leon_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){await leonSupabase.auth.signOut();alert('这个账号还没有主人权限');return location.replace('owner-login.html')}ownerSession=session;document.getElementById('loading').remove();await loadMessages()}
document.getElementById('journal-upload').onsubmit=async event=>{event.preventDefault();const out=document.getElementById('upload-status'),slug=document.getElementById('place').value,place=PLACES[slug],date=document.getElementById('trip-date').value,file=document.getElementById('journal-file').files[0];if(!file||!date)return;if(file.size>30*1024*1024){out.textContent='日记长图不能超过 30MB。';return}out.textContent='正在上传已完成日记，请不要关闭页面…';const {data:oldTrip}=await leonSupabase.from('leon_trips').select('*').eq('slug',slug).maybeSingle();const {data:trip,error:tripError}=await leonSupabase.from('leon_trips').upsert({slug,province:place.province,city:place.city,title:place.title,trip_date:date,status:'published',handbook_data:oldTrip?.handbook_data||{},created_by:ownerSession.user.id},{onConflict:'slug'}).select().single();if(tripError){out.textContent='保存日记信息失败：'+tripError.message;return}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'-'),path=`${trip.id}/long_image/${Date.now()}-${safe}`;const upload=await leonSupabase.storage.from('leon-public').upload(path,file,{upsert:false,contentType:file.type});if(upload.error){out.textContent='图片上传失败：'+upload.error.message;return}const label=document.getElementById('journal-title').value.trim()||place.title;const {error}=await leonSupabase.from('leon_media').insert({trip_id:trip.id,kind:'long_image',storage_path:`leon-public/${path}`,label,is_public:true,created_by:ownerSession.user.id});if(error){out.textContent='日记图片记录失败：'+error.message;return}out.textContent='上传完成，访客现在可以看到这篇日记。';const preview=document.getElementById('preview');preview.href='研学日记.html?slug='+encodeURIComponent(slug);preview.classList.add('show');event.target.reset()};
async function loadMessages(){const box=document.getElementById('message-list'),{data,error}=await leonSupabase.from('leon_messages').select('*').eq('status','pending').order('created_at',{ascending:false});if(error){box.innerHTML='<p class="empty">留言读取失败</p>';return}box.innerHTML='';if(!data?.length){box.innerHTML='<p class="empty">暂时没有待审核留言</p>';return}data.forEach(item=>{const el=document.createElement('article');el.className='message';el.innerHTML='<strong></strong><p></p><span class="muted"></span><div class="actions"><button class="btn approve">通过并展示</button><button class="btn reject">拒绝</button></div>';el.querySelector('strong').textContent=item.nickname+(item.relation?' · '+item.relation:'');el.querySelector('p').textContent=item.content;el.querySelector('.muted').textContent=new Date(item.created_at).toLocaleString('zh-CN');el.querySelector('.approve').onclick=()=>review(item.id,'approved');el.querySelector('.reject').onclick=()=>review(item.id,'rejected');box.append(el)})}async function review(id,status){const {error}=await leonSupabase.from('leon_messages').update({status,reviewed_by:ownerSession.user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadMessages()}requireOwner();
</script></body></html>
