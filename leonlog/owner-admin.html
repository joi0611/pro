<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>主人后台 · Leon旅行日记</title><link rel="stylesheet" href="assets/leon-vi.css">
<style>
*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{padding:24px 17px;background:var(--vi-sky-700);color:#fff}.brand{font:700 25px/1.2 var(--vi-font-hand);margin-bottom:30px}.nav{display:grid;gap:8px}.nav button{min-height:46px;padding:10px 12px;border:1px solid transparent;border-radius:13px;background:transparent;color:#fff;text-align:left;font:inherit}.nav button.active{background:#fff;color:var(--vi-sky-700);font-weight:800}.logout{margin-top:26px;width:100%;min-height:44px;border:1px solid #fff8;border-radius:13px;background:#ffffff18;color:#fff}.content{padding:28px clamp(16px,4vw,48px) 50px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:23px}.top h1{margin:0;font-size:clamp(28px,4vw,43px)}.badge{padding:7px 12px;border:1px dashed var(--vi-border);border-radius:99px;background:#fff;color:var(--vi-sky-700);font-size:13px}.panel{display:none}.panel.active{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:2px solid var(--vi-border);border-radius:16px 23px 18px 27px;box-shadow:5px 6px 0 var(--vi-shadow);padding:19px;margin-bottom:17px}.stat strong{display:block;font:700 38px/1 var(--vi-font-hand);color:var(--vi-sky-700);margin-bottom:7px}.muted{color:var(--vi-muted);font-size:13px}h2{margin:0 0 14px;font-size:23px}label{display:block;margin:11px 0 6px;font-weight:700;color:var(--vi-sky-700)}input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border:2px solid var(--vi-sky-200);border-radius:12px;background:#fff;font:inherit}textarea{min-height:130px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 15px;border:2px solid var(--vi-sky-700);border-radius:13px;background:var(--vi-sky-500);color:#fff;font-weight:800}.btn.secondary{background:#fff;color:var(--vi-sky-700)}.btn.reject{background:#fff;color:#a84035;border-color:#d99187}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.message{padding:14px 0;border-bottom:1px dashed var(--vi-sky-200)}.message:last-child{border:0}.message p{margin:5px 0}.empty{padding:25px;text-align:center;color:var(--vi-muted)}.status{min-height:23px;margin-top:11px;color:var(--vi-muted);font-size:13px}.checkline{display:flex;align-items:center;gap:8px;margin-top:12px}.checkline input{width:20px;min-height:20px}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--vi-bg);font-weight:800;color:var(--vi-sky-700)}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:8;padding:12px}.brand{margin:0 0 10px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:7px 3px;font-size:12px}.logout{margin:10px 0 0}.content{padding-top:20px}.stats,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body><div class="loading" id="loading">正在验证主人身份…</div>
<div class="shell">
<aside class="side"><div class="brand">Leon旅行日记<br><small>主人后台</small></div><nav class="nav" aria-label="后台功能"><button class="active" data-panel="overview">总览</button><button data-panel="trip">研学记录</button><button data-panel="messages">留言审批</button><button data-panel="media">照片录音</button></nav><button class="logout" id="logout">退出登录</button></aside>
<main class="content"><div class="top"><h1 id="page-title">后台总览</h1><span class="badge">仅主人可编辑</span></div>
<section class="panel active" id="overview"><div class="stats"><div class="card stat"><strong id="trip-count">—</strong><span>研学记录</span></div><div class="card stat"><strong id="pending-count">—</strong><span>待审留言</span></div><div class="card stat"><strong id="media-count">—</strong><span>照片与录音</span></div></div><div class="card"><h2>下一步</h2><p>先在“研学记录”保存昆明行程，再到“照片录音”上传素材；访客留言会进入“留言审批”。</p></div></section>
<section class="panel" id="trip"><form class="card" id="trip-form"><h2>昆明研学记录</h2><div class="grid2"><div><label for="trip-date">研学日期</label><input id="trip-date" type="date"></div><div><label for="trip-status">发布状态</label><select id="trip-status"><option value="draft">草稿</option><option value="published">公开发布</option><option value="archived">归档</option></select></div></div><label for="trip-title">标题</label><input id="trip-title" value="昆明斗南花市研学"><label for="trip-notes">长图手册补充说明</label><textarea id="trip-notes" placeholder="记录旅途故事、收获和想对亲友说的话"></textarea><div class="actions"><button class="btn" type="submit">保存研学记录</button><a class="btn secondary" href="云南昆明研学日记.html" target="_blank">查看公开目录</a></div><p class="status" id="trip-status-text" role="status"></p></form></section>
<section class="panel" id="messages"><div class="card"><h2>待审核留言</h2><div id="message-list"><p class="empty">正在读取留言…</p></div></div></section>
<section class="panel" id="media"><form class="card" id="media-form"><h2>上传照片或录音</h2><div class="grid2"><div><label for="media-kind">文件类型</label><select id="media-kind"><option value="photo">研学照片</option><option value="audio">分级阅读录音</option><option value="long_image">完整手册长图</option></select></div><div><label for="media-label">标题</label><input id="media-label" placeholder="例如：第一课 Leon朗读"></div></div><label for="media-file">选择文件</label><input id="media-file" type="file" accept="image/*,audio/*" required><label class="checkline"><input id="media-public" type="checkbox">审核完成并公开给访客</label><button class="btn" type="submit">上传并保存</button><p class="status" id="media-status" role="status"></p></form><div class="card"><h2>素材列表</h2><div id="media-list"><p class="empty">暂无素材</p></div></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/leon-backend.js"></script>
<script>
let ownerSession=null,currentTrip=null;const titles={overview:'后台总览',trip:'研学记录',messages:'留言审批',media:'照片与录音'};
async function requireOwner(){const {data:{session}}=await leonSupabase.auth.getSession();if(!session){location.replace('owner-login.html');return false}const {data,error}=await leonSupabase.from('leon_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){await leonSupabase.auth.signOut();alert('这个账号还没有主人权限');location.replace('owner-login.html');return false}ownerSession=session;document.getElementById('loading').remove();await Promise.all([refreshStats(),loadTrip(),loadMessages(),loadMedia()]);return true}
document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));button.classList.add('active');document.getElementById(button.dataset.panel).classList.add('active');document.getElementById('page-title').textContent=titles[button.dataset.panel]});
document.getElementById('logout').onclick=async()=>{await leonSupabase.auth.signOut();location.replace('owner-login.html')};
async function refreshStats(){const [trips,messages,media]=await Promise.all([leonSupabase.from('leon_trips').select('*',{count:'exact',head:true}),leonSupabase.from('leon_messages').select('*',{count:'exact',head:true}).eq('status','pending'),leonSupabase.from('leon_media').select('*',{count:'exact',head:true})]);document.getElementById('trip-count').textContent=trips.count??0;document.getElementById('pending-count').textContent=messages.count??0;document.getElementById('media-count').textContent=media.count??0}
async function loadTrip(){const {data}=await leonSupabase.from('leon_trips').select('*').eq('slug','kunming-dounan').maybeSingle();currentTrip=data||null;if(data){document.getElementById('trip-date').value=data.trip_date||'';document.getElementById('trip-status').value=data.status;document.getElementById('trip-title').value=data.title;document.getElementById('trip-notes').value=data.handbook_data?.notes||''}}
document.getElementById('trip-form').onsubmit=async event=>{event.preventDefault();const status=document.getElementById('trip-status-text');status.textContent='正在保存…';const payload={slug:'kunming-dounan',province:'云南',city:'昆明',title:document.getElementById('trip-title').value.trim(),trip_date:document.getElementById('trip-date').value||null,status:document.getElementById('trip-status').value,handbook_data:{notes:document.getElementById('trip-notes').value.trim()},created_by:ownerSession.user.id};const {data,error}=await leonSupabase.from('leon_trips').upsert(payload,{onConflict:'slug'}).select().single();status.textContent=error?'保存失败：'+error.message:'已保存';if(!error){currentTrip=data;refreshStats()}}
async function loadMessages(){const box=document.getElementById('message-list');const {data,error}=await leonSupabase.from('leon_messages').select('*').eq('status','pending').order('created_at',{ascending:false});if(error){box.innerHTML='<p class="empty">读取失败</p>';return}box.innerHTML='';if(!data.length){box.innerHTML='<p class="empty">暂时没有待审核留言</p>';return}data.forEach(item=>{const el=document.createElement('article');el.className='message';const who=document.createElement('strong');who.textContent=item.nickname+(item.relation?' · '+item.relation:'');const text=document.createElement('p');text.textContent=item.content;const time=document.createElement('span');time.className='muted';time.textContent=new Date(item.created_at).toLocaleString('zh-CN');const actions=document.createElement('div');actions.className='actions';actions.innerHTML='<button class="btn approve">通过并展示</button><button class="btn reject">拒绝</button>';actions.querySelector('.approve').onclick=()=>reviewMessage(item.id,'approved');actions.querySelector('.reject').onclick=()=>reviewMessage(item.id,'rejected');el.append(who,text,time,actions);box.append(el)})}
async function reviewMessage(id,status){const {error}=await leonSupabase.from('leon_messages').update({status,reviewed_by:ownerSession.user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}await Promise.all([loadMessages(),refreshStats()])}
async function loadMedia(){const box=document.getElementById('media-list');const {data}=await leonSupabase.from('leon_media').select('*').order('created_at',{ascending:false});box.innerHTML='';if(!data?.length){box.innerHTML='<p class="empty">暂无素材</p>';return}data.forEach(item=>{const p=document.createElement('p');p.className='message';p.textContent=`${item.kind==='audio'?'录音':'图片'} · ${item.label||item.storage_path} · ${item.is_public?'已公开':'草稿'}`;box.append(p)})}
document.getElementById('media-form').onsubmit=async event=>{event.preventDefault();const out=document.getElementById('media-status'),file=document.getElementById('media-file').files[0];if(!file)return;if(!currentTrip){out.textContent='请先保存研学记录';return}out.textContent='正在上传…';const kind=document.getElementById('media-kind').value,isPublic=document.getElementById('media-public').checked,bucket=isPublic?'leon-public':'leon-private',safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'-'),path=`${currentTrip.id}/${kind}/${Date.now()}-${safe}`;let result=await leonSupabase.storage.from(bucket).upload(path,file,{upsert:false});if(result.error){out.textContent='上传失败：'+result.error.message;return}const {error}=await leonSupabase.from('leon_media').insert({trip_id:currentTrip.id,kind,storage_path:`${bucket}/${path}`,label:document.getElementById('media-label').value.trim(),is_public:isPublic,created_by:ownerSession.user.id});out.textContent=error?'记录失败：'+error.message:'上传完成';if(!error){event.target.reset();await Promise.all([loadMedia(),refreshStats()])}}
requireOwner();
</script></body></html>
