*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#edf7fa;color:#173e55;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}button{font:inherit;cursor:pointer}#readerBar{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#246f96;color:#fff;box-shadow:0 5px 0 #cfeaf4}#readerBar .title{min-width:0;flex:1;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#readerBar .pageNo{padding:4px 9px;border:1px solid #fff9;border-radius:99px;font-size:12px;white-space:nowrap}#readerBar button{min-height:36px;padding:5px 10px;border:1px solid #fff9;border-radius:99px;background:#ffffff26;color:#fff;font-size:12px;font-weight:800}#reader{width:min(560px,100%);margin:auto;padding:77px 14px 94px}.reader-page{display:none;animation:page-in .28s ease}.reader-page.on{display:block}@keyframes page-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.visual{position:relative;width:100%;aspect-ratio:4/3;margin-bottom:14px;border:3px solid #173e55;border-radius:18px 24px 16px 27px;background:#d9f0f7;box-shadow:6px 7px 0 #bcdde8;overflow:hidden}.visual img.leon{position:absolute;z-index:4;bottom:2%;left:4%;width:32%;max-height:78%;object-fit:contain;filter:drop-shadow(3px 4px 0 #173e5533)}.visual .sun{position:absolute;width:21%;aspect-ratio:1;border:4px solid #173e55;border-radius:50%;right:9%;top:9%;background:#f5ca56;box-shadow:0 0 0 12px #f5ca5638}.visual .ground{position:absolute;inset:auto 0 0;height:34%;background:#72a97d}.visual .city{position:absolute;left:33%;right:5%;bottom:12%;height:45%;display:flex;align-items:end;gap:5%}.visual .city i{flex:1;height:55%;border:3px solid #173e55;background:#52788a}.visual .city i:nth-child(2){height:100%}.visual .city i:nth-child(3){height:75%}.visual.bright .city i{background:#f5ca56}.visual .label{position:absolute;z-index:6;right:16px;bottom:14px;padding:6px 11px;border:2px solid #173e55;border-radius:99px;background:#fff;font:900 13px/1 ui-monospace,monospace}.visual.energy-things{background:linear-gradient(#d8f1f8 0 68%,#89b58a 68%)}.thing{position:absolute;display:grid;place-items:center;border:3px solid #173e55;background:#fff;font-weight:900}.thing.lamp{left:40%;top:18%;width:19%;aspect-ratio:1;border-radius:50%;background:#f5ca56}.thing.train{right:7%;bottom:12%;width:40%;height:20%;border-radius:13px;background:#ef987e}.visual.teams{background:linear-gradient(90deg,#dff3e7 0 50%,#e2e7e9 50%)}.team-title{position:absolute;top:7%;width:50%;text-align:center;font:900 20px/1.2 "STKaiti","KaiTi",serif}.team-title.right{left:50%}.energy-token{position:absolute;width:17%;aspect-ratio:1;display:grid;place-items:center;border:3px solid #173e55;border-radius:50%;background:#fff;font-weight:900;font-size:12px;text-align:center}.t1{left:5%;top:35%}.t2{left:28%;top:35%}.t3{left:16%;top:65%}.t4{left:56%;top:35%}.t5{left:78%;top:35%}.t6{left:67%;top:65%}.visual.panel-photo{background:#153e55}.visual.panel-photo img{width:100%;height:100%;object-fit:cover;opacity:.94}.cells-grid{position:absolute;inset:13%;transform:skewY(-5deg);border:5px solid #173e55;background-image:linear-gradient(#78c1da 3px,transparent 3px),linear-gradient(90deg,#78c1da 3px,transparent 3px),url('assets/shanghai-energy-solar-panel.jpg');background-size:25% 33.33%,25% 33.33%,cover;box-shadow:9px 11px 0 #173e5540}.visual.flow{background:linear-gradient(#ccecf5 0 68%,#78aa7e 68%)}.flow-item{position:absolute;top:37%;width:18%;min-height:62px;display:grid;place-items:center;border:3px solid #173e55;border-radius:14px;background:#fff;font-weight:900;text-align:center}.flow-item:nth-child(1){left:3%;background:#f5ca56;border-radius:50%}.flow-item:nth-child(2){left:28%;background:#2b6d8d;color:#fff}.flow-item:nth-child(3){left:53%}.flow-item:nth-child(4){left:78%;background:#fff4bd}.flow-arrow{position:absolute;top:44%;font-size:28px;font-weight:900}.a1{left:22%}.a2{left:47%}.a3{left:72%}.visual.tilt{background:linear-gradient(#ccecf5 0 70%,#79aa7d 70%)}.tilt-panel{position:absolute;left:24%;bottom:17%;width:48%;height:27%;border:4px solid #173e55;background:url('assets/shanghai-energy-solar-panel.jpg') center/cover;transform:rotate(-18deg);transform-origin:bottom}.tilt-panel::after{content:"";position:absolute;left:48%;top:100%;width:6px;height:58px;background:#173e55}.rays{position:absolute;right:24%;top:27%;width:8px;height:90px;background:#f5ca56;transform:rotate(30deg);box-shadow:23px 0 #f5ca56,46px 0 #f5ca56}.visual.shade{background:linear-gradient(#d4eef6 0 70%,#7faa78 70%)}.shade .tilt-panel{filter:brightness(.55)}.tree{position:absolute;right:7%;bottom:10%;width:11%;height:45%;background:#75513b}.tree::before{content:"";position:absolute;width:220%;aspect-ratio:1;border:3px solid #173e55;border-radius:50%;background:#3f875e;left:-60%;top:-36%}.visual.weather{background:linear-gradient(#c5d9df 0 70%,#789781 70%)}.cloud{position:absolute;right:8%;top:10%;width:43%;height:22%;border:3px solid #173e55;border-radius:60px;background:#eef5f6}.cloud::before,.cloud::after{content:"";position:absolute;border:3px solid #173e55;border-bottom:0;border-radius:50% 50% 0 0;background:#eef5f6}.cloud::before{width:39%;height:85%;left:15%;top:-55%}.cloud::after{width:32%;height:65%;right:13%;top:-35%}.visual.battery{background:linear-gradient(#ceeaf4 0 70%,#7eae80 70%)}.battery-box{position:absolute;right:10%;bottom:14%;width:30%;height:48%;border:5px solid #173e55;border-radius:12px;background:#fff}.battery-box::before{content:"";position:absolute;left:31%;right:31%;top:-13%;height:11%;background:#173e55}.battery-level{position:absolute;left:9%;right:9%;bottom:8%;height:72%;background:#f5ca56}.windmill{position:absolute;left:38%;top:20%;width:9px;height:55%;background:#173e55}.windmill::before{content:"";position:absolute;width:92px;height:92px;left:50%;top:0;transform:translate(-50%,-45%);border-radius:50%;background:conic-gradient(#246f96 0 10%,transparent 10% 25%,#246f96 25% 35%,transparent 35% 50%,#246f96 50% 60%,transparent 60% 75%,#246f96 75% 85%,transparent 85%)}.zh{margin:6px 4px;color:#58727f;font-size:14px;line-height:1.65}.sentence{margin:5px 2px;font-size:clamp(26px,7vw,34px);font-weight:900;line-height:1.55;letter-spacing:.01em;cursor:pointer}.sentence .nw{color:#246f96;text-decoration:underline;text-decoration-color:#78b4ca;text-decoration-thickness:3px;text-underline-offset:6px}.sentence .nw.learned{color:#4e966d}.sentence .nw.learned::after{content:" ✓";font-size:14px}.tap-hint{text-align:center;color:#246f96;font-size:12px;margin-top:10px}.fact{margin-top:14px;padding:14px 16px;border-left:5px solid #f5ca56;background:#fff8d9;color:#3f5c68;line-height:1.65}.level{display:inline-block;margin-bottom:9px;padding:5px 10px;border:2px solid #246f96;border-radius:99px;background:#fff;font:800 11px/1 ui-monospace,monospace;color:#246f96}#readerNav{position:fixed;inset:auto 0 0;z-index:20;width:min(560px,100%);margin:auto;display:flex;align-items:center;gap:9px;padding:10px 13px;background:#fff;border-top:2px solid #b8ddea;box-shadow:0 -7px 20px #173e5518}#readerNav button{flex:1;min-height:45px;border:2px solid #124e70;border-radius:13px;background:#246f96;color:#fff;font-weight:900}#readerNav button:disabled{border-color:#a9c5cf;background:#c8dce3}.dots{flex:1.5;display:flex;flex-wrap:wrap;justify-content:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%;background:#b8ddea}.dot.on{background:#124e70}#overlay{position:fixed;inset:0;z-index:29;display:none;background:#0007}#wordSheet{position:fixed;z-index:30;left:0;right:0;bottom:0;width:min(560px,100%);max-height:82dvh;margin:auto;padding:24px 20px 30px;border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -10px 40px #0004;transform:translateY(110%);transition:transform .25s;overflow:auto}#wordSheet.open{transform:none}#wordSheet .word{font-size:38px;font-weight:900;color:#246f96}#wordSheet .phonetic{color:#58727f}.sheet-buttons{display:flex;gap:8px;margin-top:16px}.sheet-buttons button{flex:1;min-height:44px;border:2px solid #246f96;border-radius:12px;background:#fff;color:#246f96;font-weight:900}.sheet-buttons .main{background:#246f96;color:#fff}.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.word-card{padding:12px;border:2px solid #b8ddea;border-radius:13px;background:#f5fbfd;text-align:left}.word-card b{display:block;color:#246f96;font-size:19px}.word-card.learned{border-color:#4e966d;background:#e9f6ed}.award{margin-top:18px;padding:18px;border:3px dashed #f5ca56;border-radius:18px;background:#fff9df;text-align:center}.award strong{font:900 25px/1.3 "STKaiti","KaiTi",serif}@media(max-width:520px){#readerBar{gap:5px;padding:8px 7px}#readerBar .title{font-size:12px}#readerBar button{padding:4px 7px;font-size:11px}.visual{border-radius:13px}.flow-item{font-size:10px;min-height:48px}.flow-arrow{font-size:20px}.word-grid{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header id="readerBar"><span class="title">Leon旅行日记 · Power of the Sun</span><span class="pageNo" id="pageLabel">第 1 / 12 页</span><button type="button" onclick="location.href='上海科技馆能源研学日记.html'">返回目录</button><button type="button" onclick="showAllWords()">词汇</button></header>
<main id="reader" aria-live="polite"></main>
<nav id="readerNav" aria-label="绘本翻页"><button id="prevBtn" type="button" onclick="go(-1)">上一页</button><div class="dots" id="dots"></div><button id="nextBtn" type="button" onclick="go(1)">下一页</button></nav>
<div id="overlay" onclick="closeSheet()"></div><aside id="wordSheet" aria-label="词汇卡"><div id="sheetContent"></div></aside>
<script>
const WORDS={energy:['energy','/ˈenərdʒi/','能源；能量','Energy makes things happen.'],renewable:['renewable','/rɪˈnuːəbl/','可再生的','Sunlight is renewable.'],coal:['coal','/kəʊl/','煤','Coal forms very slowly.'],oil:['oil','/ɔɪl/','石油','Oil can run out.'],gas:['gas','/ɡæs/','天然气','Gas is under the ground.'],solar:['solar panel','/ˈsəʊlər ˈpænl/','太阳能板','The solar panel is blue.'],cell:['cell','/sel/','电池片；小单元','A panel has many solar cells.'],sunlight:['sunlight','/ˈsʌnlaɪt/','阳光','Sunlight hits the cells.'],electricity:['electricity','/ɪˌlekˈtrɪsəti/','电','Electricity lights the lamp.'],wire:['wire','/ˈwaɪər/','电线','Electricity moves through wires.'],power:['power','/ˈpaʊər/','电力；动力','The panel makes more power.'],shade:['shade','/ʃeɪd/','阴影；遮挡','The tree makes shade.'],battery:['battery','/ˈbætəri/','电池；蓄电池','A battery stores energy.'],clean:['clean','/kliːn/','清洁的','The future city is clean.']};
const PAGES=[
{scene:'city',zh:'Leon 来到上海科技馆。城市还没有亮起来，它需要能源。',ss:[`Leon is at the science museum.`,`The city needs <span class="nw" data-word="energy">energy</span>.`],plain:['Leon is at the science museum.','The city needs energy.'],fact:'能源可以让灯亮、让车动，也能给我们的生活带来许多变化。'},
{scene:'things',zh:'能源让事情发生变化。它能点亮灯，也能推动火车。',ss:[`<span class="nw" data-word="energy">Energy</span> makes things happen.`,`It can light a lamp and move a train.`],plain:['Energy makes things happen.','It can light a lamp and move a train.']},
{scene:'renew',zh:'太阳会再次照耀，风和水也会继续运动。它们是可再生能源。',ss:[`The sun shines again. Wind and water keep moving.`,`They are <span class="nw" data-word="renewable">renewable</span> energy.`],plain:['The sun shines again. Wind and water keep moving.','They are renewable energy.']},
{scene:'finite',zh:'煤、石油和天然气形成得非常慢。它们可能会用完。',ss:[`<span class="nw" data-word="coal">Coal</span>, <span class="nw" data-word="oil">oil</span>, and <span class="nw" data-word="gas">gas</span> form very slowly.`,`They can run out.`],plain:['Coal, oil, and gas form very slowly.','They can run out.'],fact:'“Run out”表示“用完”。这些能源形成时间非常漫长，所以属于不可再生能源。'},
{scene:'panel',zh:'Leon 找到一块太阳能板。它由许多小小的太阳能电池组成。',ss:[`Leon finds a <span class="nw" data-word="solar">solar panel</span>.`,`It has many small solar <span class="nw" data-word="cell">cells</span>.`],plain:['Leon finds a solar panel.','It has many small solar cells.']},
{scene:'cells',zh:'阳光照在电池片上，电池片产生电。',ss:[`<span class="nw" data-word="sunlight">Sunlight</span> hits the cells.`,`The cells make <span class="nw" data-word="electricity">electricity</span>.`],plain:['Sunlight hits the cells.','The cells make electricity.']},
{scene:'flow',zh:'电流沿着电线移动。现在，小灯亮了。',ss:[`<span class="nw" data-word="electricity">Electricity</span> moves through <span class="nw" data-word="wire">wires</span>.`,`Now the little lamp is on.`],plain:['Electricity moves through wires.','Now the little lamp is on.']},
{scene:'tilt',zh:'Leon 把太阳能板转向太阳。它发出了更多电。',ss:[`Leon turns the panel toward the sun.`,`It makes more <span class="nw" data-word="power">power</span>.`],plain:['Leon turns the panel toward the sun.','It makes more power.']},
{scene:'shade',zh:'一棵树挡住了阳光，形成阴影。太阳能板发出的电变少了。',ss:[`A tree makes <span class="nw" data-word="shade">shade</span>.`,`The panel makes less power.`],plain:['A tree makes shade.','The panel makes less power.']},
{scene:'weather',zh:'阴天还有一些光。夜晚，太阳能板不会发电。',ss:[`Cloudy days still have some light.`,`At night, the panel makes no power.`],plain:['Cloudy days still have some light.','At night, the panel makes no power.']},
{scene:'battery',zh:'蓄电池能储存能量，留到以后再用。太阳能、风能和水能也能一起工作。',ss:[`A <span class="nw" data-word="battery">battery</span> can store energy for later.`,`Solar power, wind power, and water power can work together.`],plain:['A battery can store energy for later.','Solar power, wind power, and water power can work together.']},
{scene:'future',zh:'未来城市明亮又清洁。Leon 成为了一名能源探索员！',ss:[`The future city is bright and <span class="nw" data-word="clean">clean</span>.`,`Leon is an Energy Explorer!`],plain:['The future city is bright and clean.','Leon is an Energy Explorer!'],fact:'读完啦！打开词汇表，把认识的单词都标记为“我学会了”。'}
];
const store=JSON.parse(localStorage.getItem('shanghaiEnergyReader2026V1')||'{"learned":[],"seen":[]}');store.learned=store.learned||[];store.seen=store.seen||[];let current=0,currentWord=null,voice=null;
function save(){localStorage.setItem('shanghaiEnergyReader2026V1',JSON.stringify(store))}function prepareVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en-US$/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}prepareVoice();if('speechSynthesis'in window)window.speechSynthesis.addEventListener?.('voiceschanged',prepareVoice);
function speak(text){if(!('speechSynthesis'in window)){alert('当前浏览器不支持内置发音。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=1.02;if(voice)u.voice=voice;speechSynthesis.speak(u)}
function scene(type){if(type==='city'||type==='future')return `<div class="visual ${type==='future'?'bright':''}"><div class="sun"></div><div class="ground"></div><img class="leon" src="assets/leon-traveler.png" alt="Leon能源小侦探"><div class="city"><i></i><i></i><i></i></div><span class="label">${type==='future'?'CLEAN CITY':'NEEDS ENERGY'}</span></div>`;if(type==='things')return `<div class="visual energy-things"><img class="leon" src="assets/leon-traveler.png" alt="Leon"><div class="thing lamp">LIGHT</div><div class="thing train">MOVE</div></div>`;if(type==='renew'||type==='finite')return `<div class="visual teams"><strong class="team-title">RENEWABLE</strong><strong class="team-title right">NONRENEWABLE</strong><span class="energy-token t1">SUN</span><span class="energy-token t2">WIND</span><span class="energy-token t3">WATER</span><span class="energy-token t4">COAL</span><span class="energy-token t5">OIL</span><span class="energy-token t6">GAS</span></div>`;if(type==='panel')return `<div class="visual panel-photo"><img src="assets/shanghai-energy-solar-panel.jpg" alt="太阳能板近景"><span class="label">SOLAR PANEL</span></div>`;if(type==='cells')return `<div class="visual"><div class="sun"></div><div class="cells-grid"></div><span class="label">MANY SMALL CELLS</span></div>`;if(type==='flow')return `<div class="visual flow"><span class="flow-item">SUN</span><b class="flow-arrow a1">→</b><span class="flow-item">CELL</span><b class="flow-arrow a2">→</b><span class="flow-item">WIRE</span><b class="flow-arrow a3">→</b><span class="flow-item">LIGHT</span></div>`;if(type==='tilt')return `<div class="visual tilt"><div class="sun"></div><div class="rays"></div><div class="tilt-panel"></div><span class="label">MORE POWER</span></div>`;if(type==='shade')return `<div class="visual shade"><div class="sun"></div><div class="tilt-panel"></div><div class="tree"></div><span class="label">LESS POWER</span></div>`;if(type==='weather')return `<div class="visual weather"><div class="cloud"></div><div class="tilt-panel"></div><span class="label">SOME LIGHT</span></div>`;return `<div class="visual battery"><div class="sun"></div><div class="windmill"></div><div class="battery-box"><div class="battery-level"></div></div><span class="label">SAVE FOR LATER</span></div>`}
function render(){const root=document.getElementById('reader');root.innerHTML='';PAGES.forEach((p,pi)=>{const article=document.createElement('article');article.className='reader-page'+(pi===current?' on':'');article.innerHTML=`<span class="level">LEVEL 1 · PAGE ${pi+1}</span>${scene(p.scene)}<p class="zh">${p.zh}</p>${p.ss.map((s,i)=>`<p class="sentence" data-text="${encodeURIComponent(p.plain[i])}">${s}</p>`).join('')}${p.fact?`<div class="fact">${p.fact}</div>`:''}<p class="tap-hint">点击英文句子听发音 · 点击蓝色单词打开词汇卡</p>`;root.append(article)});root.querySelectorAll('.sentence').forEach(el=>el.onclick=e=>{if(e.target.classList.contains('nw'))return;speak(decodeURIComponent(el.dataset.text))});root.querySelectorAll('.nw').forEach(el=>{if(store.learned.includes(el.dataset.word))el.classList.add('learned');el.onclick=e=>{e.stopPropagation();openWord(el.dataset.word)}});document.getElementById('pageLabel').textContent=`第 ${current+1} / ${PAGES.length} 页`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===PAGES.length-1;document.getElementById('dots').innerHTML=PAGES.map((_,i)=>`<span class="dot ${i===current?'on':''}"></span>`).join('');if(!store.seen.includes(current)){store.seen.push(current);save()}window.scrollTo({top:0,behavior:'smooth'})}
function go(n){const next=current+n;if(next<0||next>=PAGES.length)return;current=next;render();setTimeout(()=>speak(PAGES[current].plain[0]),180)}
function openWord(key){currentWord=key;const w=WORDS[key];document.getElementById('sheetContent').innerHTML=`<div class="word">${w[0]}</div><div class="phonetic">${w[1]}</div><h3>${w[2]}</h3><div class="fact">${w[3]}</div><div class="sheet-buttons"><button class="main" type="button" onclick="speakWord()">听发音</button><button type="button" onclick="toggleLearned()">${store.learned.includes(key)?'已经学会':'我学会了'}</button><button type="button" onclick="closeSheet()">收起</button></div>`;showSheet();speak(w[0])}
function showAllWords(){currentWord=null;document.getElementById('sheetContent').innerHTML=`<h2>全书词汇 · ${store.learned.length}/${Object.keys(WORDS).length}</h2><div class="word-grid">${Object.entries(WORDS).map(([k,w])=>`<button class="word-card ${store.learned.includes(k)?'learned':''}" type="button" onclick="openWord('${k}')"><b>${w[0]}</b><span>${w[2]}</span></button>`).join('')}</div><div class="award"><strong>${store.seen.length===12?'I finished the book!':'Keep reading!'}</strong><p>已读 ${store.seen.length} / 12 页</p></div><div class="sheet-buttons"><button type="button" onclick="closeSheet()">返回绘本</button><button class="main" type="button" onclick="location.href='上海科技馆能源互动研学手册.html'">去做能源实验</button></div>`;showSheet()}
function showSheet(){document.getElementById('overlay').style.display='block';requestAnimationFrame(()=>document.getElementById('wordSheet').classList.add('open'))}function closeSheet(){document.getElementById('wordSheet').classList.remove('open');document.getElementById('overlay').style.display='none'}function speakWord(){if(currentWord)speak(WORDS[currentWord][0])}function toggleLearned(){if(!currentWord)return;store.learned=store.learned.includes(currentWord)?store.learned.filter(x=>x!==currentWord):[...store.learned,currentWord];save();openWord(currentWord);render()}
render();
</script></body></html>
