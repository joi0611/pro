<body>
<main></main>
<script>
/* 原真题判断链 */
function normalize(v){
  return String(v||"").trim().toLowerCase();
}

function isCorrectAnswer(q,v){
  return(q.answers||[]).some(a=>normalize(a)===normalize(v));
}

function regexEscape(v){
  return String(v||"").replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&");
}

function getFocusStepOptions(q){
  return Array.from(new Set([...(q.focusOptions||[]),q.focus].filter(Boolean)));
}

function renderQuestionExplain(q){
  const base=String(q.explain||"");
  const raw=String(q.prompt||"").replace(/[()]/g,"").trim();
  if(raw&&base&&!base.includes(raw))return "提示词是 "+raw+"。"+base;
  return base;
}

function getVerbPredicateCues(q){
  const vf=q.verbFlow||{};
  const kind=vf.predicateKind||"时态";
  const structure=inferVerbStructure(q);
  const cues=[];
  if(kind==="情态动词"){const modal=vf.skeleton&&vf.skeleton.predicate||q.clue||"情态动词";cues.push({label:"情态动词线索",text:modal+" → 情态动词"});}else{const time=getPredicateTimeCueText(q,structure);cues.push({label:"时态线索",text:time});}
  if(kind==="语态"||kind==="时态+语态"||/被动|be\s*\+\s*done|done/i.test(String(q.explain||"")+String(q.clue||""))){cues.push({label:"语态线索",text:getPredicateVoiceCueText(q)});}
  const subject=vf.skeleton&&vf.skeleton.subject&&vf.skeleton.subject!=="?"?vf.skeleton.subject:"";
  if(subject)cues.push({label:"主语线索",text:subject});
  cues.push({label:"结构方向",text:structure});
  return cues;
}

function getPredicateTimeCueText(q,structure){
  const source=String(q.clue||"");
  const groups=[{name:"一般过去时",tokens:["Last year","last year","Yesterday","yesterday","ago","last week","In ancient times","During the Song dynasty","Then","in just five years","at the age of five","became","began","bought","saw","liked","helped","worked","noticed","thought","saved","understood","wanted","was","were"]},{name:"现在完成时",tokens:["for over 6 years","for years","since ancient times","since","so far","in the past","has","have"]},{name:"一般将来时",tokens:["tomorrow","next","soon","will","If","if"]},{name:"现在进行时",tokens:["Now","now","look","listen"]},{name:"一般现在时",tokens:["often","sometimes","usually","always","every day","stand","stands","means","show","feel","becomes","runs","works","teaches","helps","need","is","are","am"]},{name:"情态动词",tokens:["can","could","should","must","may"]}];
  for(const g of groups){const found=g.tokens.filter(t=>tokenInSource(t,source)).slice(0,3);if(found.length)return found.join(" / ")+" → "+g.name;}
  if(structure)return "无明显时间标志词：看上下文语境、主语单复数，再落到“"+structure+"”";
  return "无明显时间标志词：看上下文语境和主谓一致";
}

function getPredicateVoiceCueText(q){
  const source=[q.clue,q.explain,(q.answers||[]).join(" ")].join(" ");
  const found=[];
  ["by","into","be divided","was","were","is","are","am","used"].forEach(t=>{if(source.includes(t)&&!found.includes(t))found.push(t);});
  if(/被动|承受/.test(source))found.push("主语承受动作");
  if(found.length)return found.slice(0,4).join(" / ")+" → 看主动还是被动";
  return "看主语是不是动作承受者；若是承受者，优先考虑 be + done";
}

function matchesExpected(q,action,value){
  const v=normalize(value).replace(/\s+/g,"");
  if(action==="hasPrompt")return q.hasPrompt?value==="有提示词":value==="无提示词";
  if(action==="noPromptType")return value===q.noPromptType;
  if(action==="pos")return value===q.pos;
  if(action==="focus")return value===q.focus;
  if(action==="changedVerb")return value===q.verbFlow.hasChangedVerb;
  if(action==="route")return value===q.verbFlow.route;
  if(action==="predicateKind")return value===(q.verbFlow.predicateKind||"时态");
  if(action==="nonPredicateFocus")return value===(q.verbFlow.nonPredicateFocus||q.verbFlow.structure);
  if(action==="structure")return v===normalize(inferVerbStructure(q)).replace(/\s+/g,"");
  return true;
}

function nextStep(q,action){
  if(action==="hasPrompt")return"pos";
  if(action==="noPromptType")return"answer";
  if(action==="pos")return q.pos==="动词"&&q.verbFlow?"changedVerb":"focus";
  if(action==="focus")return"answer";
  if(action==="changedVerb")return"route";
  if(action==="route")return q.verbFlow.route==="谓语"?"predicateKind":"nonPredicateFocus";
  if(action==="predicateKind")return"structure";
  if(action==="nonPredicateFocus")return q.verbFlow.structure?"structure":"answer";
  if(action==="structure")return"answer";
  return"answer";
}

function getDynamicHighlightItems(q,step){
  if(!q)return[];
  if(q.verbFlow&&q.verbFlow.route==="谓语"&&(step==="predicateKind"||step==="structure"))return getPredicateTenseHighlights(q,step);
  if(q.verbFlow&&q.verbFlow.highlights){const key=step==="changedVerb"?"changedVerb":step==="route"?"route":step==="predicateKind"?"predicateKind":step==="nonPredicateFocus"?"focus":step==="structure"?"structure":step==="answer"?"answer":"changedVerb";return q.verbFlow.highlights[key]||[];}
  if(!q.hasPrompt&&q.noPromptType==="连词")return splitClues(q.clue,"connectorClue");
  if(q.clue)return splitClues(q.clue,q.pos==="形容词与副词"?"modifier":"predicate");
  return[];
}

function splitClues(clue,type){
  return String(clue||"").split(/\s*\/\s*/).filter(Boolean).map(text=>({text:text.trim(),type}));
}

function inferVerbStructure(q){
  const vf=q.verbFlow||{};
  const raw=vf.structure||q.point||"";
  const ans=normalize((q.answers||[])[0]||"");
  const clue=String(q.clue||"")+" "+String(q.explain||"")+" "+String(q.point||"")+" "+String(q.focus||"");
  if(/情态动词/.test(clue)&&/\b(can|could|should|must|may)\b/.test(clue)&&!/被动/.test(clue))return"情态动词 + 动词原形";
  if(raw&&!["时态","语态","时态+语态"].includes(raw))return raw;
  if(/will\s+be\s+\w+ed|will be done|will be/.test(ans))return"一般将来时+被动";
  if((/was|were/.test(ans)||/\b(was|were)\b/.test(clue))&&(/done|被动|by|into|divided|produced|created/.test(clue)||/ed$/.test(ans)))return"一般过去时+被动";
  if((/is|are|am/.test(ans)||/\b(is|are|am)\b/.test(clue))&&(/done|被动|by|into|divided|used/.test(clue)||/ed$/.test(ans)))return"一般现在时+被动";
  if(/^will\b/.test(ans))return"一般将来时";
  if(/has|have/.test(ans)||/since|for over|for \d|so far|in the past/.test(clue))return"现在完成时";
  if(/ing$/.test(ans)&&/\bis\b|\bare\b|\bam\b|now|look|listen/.test(clue))return"现在进行时";
  if(/can|情态动词/.test(clue))return"情态动词 + 动词原形";
  if(/last|yesterday|ago|ancient|dynasty|过去|worked|helped|noticed|thought|saved|was|were/.test(clue)||/ed$/.test(ans)||["began","made","brought","found","went"].includes(ans))return"一般过去时";
  return"一般现在时";
}

function getVerbStructureOptions(q){
  const correct=inferVerbStructure(q);
  const kind=q.verbFlow&&q.verbFlow.predicateKind;
  if(q.verbFlow&&q.verbFlow.route==="非谓语")return uniqueOptions([correct,"to do","doing","done"]);
  if(kind==="语态")return uniqueOptions([correct,"主动语态","被动语态","is/are/am done","was/were done"]);
  if(kind==="时态+语态")return uniqueOptions([correct,"一般现在时+被动","一般过去时+被动","一般将来时+被动","情态动词+被动"]);
  return uniqueOptions([correct,"一般现在时","一般过去时","现在完成时","一般将来时","现在进行时","情态动词 + 动词原形"]);
}

function uniqueOptions(list){
  return Array.from(new Set(list.filter(Boolean)));
}

function tokenInSource(token,source){
  const t=String(token||"");
  if(!t)return false;
  const s=String(source||"");
  if(/^[A-Za-z]+$/.test(t))return new RegExp("\\b"+regexEscape(t)+"\\b").test(s);
  return s.includes(t);
}

function getPredicateTenseHighlights(q,step){
  const vf=q.verbFlow||{};
  const source=String(q.clue||"")+" / "+String(vf.skeleton&&vf.skeleton.predicate||"");

function initialState() {
  return { step: 'start', history: [], feedback: null, result: null };
}

function view(q, state) {
  const showPredicate = q.verbFlow?.route === '谓语' &&
    ['predicateKind', 'structure', 'answer'].includes(state.step);
  return {
    choice: state.result ? null : getChoice(q, state.step),
    highlights: getDynamicHighlightItems(q, state.step),
    predicateCues: showPredicate ? getVerbPredicateCues(q) : [],
    history: state.history,
    feedback: state.feedback,
    result: state.result ? {
      ...state.result,
      answers: q.answers || [],
      explanation: renderQuestionExplain(q)
    } : null
  };
}

function submit(q, state, action, value) {
  if (state.result || action !== getChoice(q, state.step).action) return state;
  const isAnswer = action === 'answer';
  const correct = isAnswer ? isCorrectAnswer(q, value) : matchesExpected(q, action, value);
  const history = correct ? [
    ...state.history.filter(node => node.action !== action),
    { action, text: getDecisionLabel(q, action, value) }
  ] : state.history;
  const feedback = correct ? null : buildStepFeedback(q, action, value);
  return {
    step: correct && !isAnswer ? nextStep(q, action) : state.step,
    history,
    feedback,
    result: isAnswer ? { answer: value, correct, tag: inferMistakeTag(q, action) } : null
  };
}

    if(q.no===40&&given==='created'||q.no===95&&given==='tie')return '被动结构的填写';

function summary(ids){
  const groups=new Map(), errors=[];
  for(const no of ids){
    if(no===152)continue;
    const item=records[no],q=questions[no];
    if(!item?.state.result)continue;
    const first=item.attempts.filter((a,i)=>item.attempts.findIndex(other=>other.action===a.action)===i);
    for(const a of first){
      const filling=a.action==='answer';
      const name=(filling?q.point:tags[a.action]||q.point)||'当前考点';
      const area=skillAreaFor(q,a.action);
      const key=JSON.stringify([area,a.action,name]);
      if(!groups.has(key))groups.set(key,{name,filling,area,action:a.action,count:0,wrong:0});
      const g=groups.get(key);
      g.count++;
      if(!a.ok)g.wrong++;
    }
    const failed=first.filter(a=>!a.ok);
    if(failed.length)errors.push({q,failed,item,label:classify(q,failed[0])});
  }
  return {groups,errors};
}

}

  const label=item=>item.name+(item.filling?'（填词）':'（判断）');
  const path=ordered.map(item=>'<li><strong>'+esc(label(item))+'</strong> · '+esc(diagnosisPractice[item.name]||practiceByArea[item.area])+'</li>').join('');
  return '<section class="card"><h2>学情分析</h2><p>'+esc(narrative(ordered))+'</p><h3>训练建议</h3><ol>'+path+
    '<li>做完整题后，先回看第一步判断。第一步对了就往后找，找到出错的地方，再补练同类题。</li></ol></section>';
}
function report(extra=false){
  const ids=extra?passages.slice(3).map(nums).filter(set=>set.some(n=>records[n])).flat():core;
  const {groups,errors}=summary(ids);
  const assessed=ids.filter(n=>n!==152);
  const score=assessed.filter(n=>records[n]?.state.result?.correct).length;
  const firstClean=assessed.filter(n=>records[n]?.state.result&&records[n].attempts.every(a=>a.ok)).length;
  const findings=[...groups.values()].filter(item=>item.wrong).sort(sortFindings);
  const assessedDone=completed(assessed);
  const missing=assessed.filter(n=>!records[n]?.state.result);
  const accuracy=assessed.length?(100*score/assessed.length).toFixed(1).replace(/\.0$/,'')+'%':'—';
  const recommendationErrors=extra?summary(core).errors:errors;
  const recommendations=supplements.map((s,i)=>({...s,i,score:recommendationErrors.reduce((sum,e)=>sum+Number(s.fits.test(e.label+' '+e.q.point)),0)})).sort((a,b)=>b.score-a.score||a.i-b.i);
  const assessedPoints=new Set(ids.filter(n=>records[n]?.state.result).map(n=>questions[n].point));
  const untested=unseen.filter(point=>!assessedPoints.has(point));
  return '<div class="pager">'+(extra?btn('← 正式测评报告','report'):btn('← 首页','home'))+'</div><h1>'+(extra?'加测结果':'中考英语语法填空学情报告')+'</h1>'+
    (extra?'<p>加测答对 <strong>'+score+' / '+assessed.length+'</strong> 空，正确率 <strong>'+accuracy+'</strong>。</p>':'<p>正式测评最终答对 <strong>'+score+' / '+assessed.length+'</strong> 空，正确率 <strong>'+accuracy+'</strong>，所有步骤都一次做对 <strong>'+firstClean+' / '+assessed.length+'</strong> 空。</p><p class="muted">《红军长征》第 3 空答案待核，已从正式分数和薄弱点统计中忽略。</p>')+'<p>已作答的 <strong>'+assessedDone+'</strong> 空中，有 <strong>'+errors.length+'</strong> 空出现过失误。未作答 <strong>'+missing.length+'</strong> 空，按错题计分。</p>'+
    '<section><h2>薄弱点分析</h2>'+skillList(findings)+'</section>'+
    '<details class="card"><summary><strong>逐空复盘</strong></summary>'+(errors.length?errors.map(({q,failed,item,label})=>'<details><summary>'+esc(questionRef(q.no))+' · '+esc(label)+' · 最终'+(item.state.result.correct?'答对':'答错')+'</summary><ol>'+failed.map(a=>'<li>'+esc(a.title)+'：作答为 <b>'+esc(a.choice)+'</b>'+(a.action==='answer'?'':'，重选后通过')+'</li>').join('')+'</ol><p>原文线索 <b>'+esc(q.clue)+'</b></p><p>'+esc(q.explain)+'</p>'+btn('回到原文','review:'+q.no)+'</details>').join(''):'<p>本次没有需要复盘的错步。</p>')+'</details>'+(missing.length?'<details class="card"><summary>未作答题目（'+missing.length+' 空）</summary><ul>'+missing.map(n=>'<li>'+esc(questionRef(n))+' '+btn('回到原文','review:'+n,'small')+'</li>').join('')+'</ul></details>':'')+learningAdvice(findings,assessedDone)+
    (extra?'<section><h2>加测篇目</h2>'+(untested.length?'<p class="muted">本次未测 · '+esc(untested.join('、'))+'</p>':'')+
    '<div class="grid">'+recommendations.map(s=>'<article class="card"><span class="meta">'+esc(sources[s.id])+'</span><h3>'+esc(byId[s.id][1])+'</h3><p>'+esc(s.label)+'</p><div class="cardfoot"><span>'+completed(nums(byId[s.id]))+' / 10 空已做 · 答对 '+nums(byId[s.id]).filter(n=>records[n]?.state.result?.correct).length+' 空</span>'+btn(complete(nums(byId[s.id]))?'回看加测':'进入加测','open:'+s.id,'small')+'</div></article>') .join('')+'</div></section>':'<section>'+btn('前往加测','extraReport','primary')+'</section>');
}
function revealBlank(){
  root.querySelector('.reading .selected')?.scrollIntoView({block:'nearest',inline:'nearest'});
}
function assessmentHome(){
  const done=completed(core), finished=complete(core);
  const primaryLabel=finished?'查看诊断报告':used?'继续测评':'开始测评';
  const restart=used===1?btn('重新测评','restart'):used>=maxAttempts?'<button type="button" disabled>重新测评</button>':'';
  return '<div class="directory assessment-home">'+
    '<div class="home-hero"><div><p class="home-brand">无限进步@</p><h1>中考英语语法填空诊断</h1>'+
    '<p class="home-intro">先逐步选择你的思考路径，再填写答案。系统会记录每一步选择，生成学情报告。</p></div>'+
    '<div class="home-control"><div class="home-count"><strong>基础测评进度</strong><span>'+done+' / '+core.length+' 空</span></div>'+
    '<progress aria-label="基础测评进度" value="'+done+'" max="'+core.length+'"></progress>'+
    '<div class="home-actions">'+btn(primaryLabel,finished?'report':'nextCore','primary')+restart+'</div>'+
    '<p class="home-attempts">共 '+maxAttempts+' 次测评机会 · 剩余 '+(maxAttempts-used)+' 次</p>'+btn('切换激活码','logout','switch-code')+'</div></div>'+
    '<div class="home-catalog"><section aria-labelledby="core-title"><h2 id="core-title">基础测评 · 3 篇必做</h2>'+
    '<p class="directory-hint">平时正确率低于 90%，建议先完成这 3 篇。</p><ul class="directory-list">'+passages.slice(0,3).map(card).join('')+'</ul></section>'+
    '<section aria-labelledby="extra-title"><h2 id="extra-title">进阶加测 · 3 篇选做</h2>'+
    '<p class="directory-hint">平时正确率达到 90%，完成基础测评后可选做，检查较少考到的知识点。</p>'+
    '<ul class="directory-list">'+passages.slice(3).map(card).join('')+'</ul></section></div></div>';
}
function render(){
  const studying=!!byId[screen];
  const priorTop=root.querySelector('.reading')?.scrollTop;
  document.body.classList.toggle('doing',studying);
  root.classList.toggle('in-study',studying);
  if(!storageKey){
    root.innerHTML='<div class="activation-page card"><p>无限进步@</p><h1>中考英语语法填空诊断</h1>'+
      '<form id="activation-form"><label for="activation-code">测评激活码</label>'+
      '<input id="activation-code" type="text" required autocapitalize="none" autocomplete="off" spellcheck="false" aria-describedby="activation-guide activation-error" placeholder="输入 6 位激活码">'+
      '<p id="activation-guide">请联系老师领取激活码开始测评，每个账号可以测评2次。</p>'+
      '<p id="activation-error" role="alert" hidden></p><button class="primary" type="submit">进入测评</button></form></div>';
  }else if(screen==='home'){
    root.innerHTML=assessmentHome();
  }else root.innerHTML=screen==='report'||screen==='extraReport'?report(screen==='extraReport'):reader(byId[screen]);
  if(studying){
    if(priorTop!==undefined)root.querySelector('.reading').scrollTop=priorTop;
    else revealBlank();
  }
  if(storageIssue)root.insertAdjacentHTML('beforeend','<p class="feedback">服务器保存失败或测评会话已失效，请重试或重新输入激活码。</p>');
}
async function submitChoice(value){
  if(busy)return;
  const q=questions[current],item=records[current]||{state:initialState(),attempts:[]};
  const choice=view(q,item.state).choice;
  if(!choice)return;
  const next=submit(q,item.state,choice.action,value);
  const ok=choice.action==='answer'?next.result.correct:!next.feedback;
  const record={state:next,attempts:[...item.attempts,{action:choice.action,title:choice.title,choice:value,ok}]};
  busy=true;
  try{
    await api('save',{used,question:current,record});
    records[current]=record;
    storageIssue=false;
  }catch{storageIssue=true;}finally{busy=false;}
  render();
  root.querySelector('.task form input')?.focus({preventScroll:true});
}
root.addEventListener('submit',async event=>{
  if(event.target.id==='activation-form'){
    event.preventDefault();
    const input=event.target.querySelector('input');
    if(busy)return;
    busy=true;
    try{
      ({used,records}=await api('login',{code:input.value.trim()}));
      storageKey=true;screen='home';storageIssue=false;render();return;
    }catch(err){
      const error=event.target.querySelector('#activation-error');
      error.hidden=false;
      error.textContent=err.status===401?'激活码无效，请核对大小写和数字。':err.status===429?'尝试次数过多，请稍后再试。':'暂时无法连接服务器，请重试。';
      return;
    }finally{busy=false;}
  }
  if(!storageKey||event.target.id!=='answer')return;
  event.preventDefault();
  const word=event.target.querySelector('input').value.trim().replace(/\s+/g,' ');
  if(word)submitChoice(word);
});
function chooseQuestion(no){
  current=no;
  render();
  revealBlank();
}
root.addEventListener('click',async event=>{
  const button=event.target.closest('button[data-go]');
  if(!button||!storageKey||busy)return;
  const [action,arg]=button.dataset.go.split(':');
  if(action==='pick'){submitChoice(arg);return;}
  if(action==='question'){chooseQuestion(Number(arg));return;}
  if(action==='logout'){
    busy=true;
    try{await api('logout');}catch{storageIssue=true;render();return;}finally{busy=false;}
    storageKey=null;
    screen='login';
    storageIssue=false;
    render();
    return;
  }
  if(action==='restart'){
    busy=true;
    try{if(!await startAssessment(true))return;}finally{busy=false;}
    begin(passages[0][0]);
  }
  if((action==='open'||action==='nextCore')&&!used){
    busy=true;
    try{if(!await startAssessment(false))return;}finally{busy=false;}
  }
  if(action==='open')begin(arg);
  if(action==='review'){begin(passages.find(p=>nums(p).includes(Number(arg)))[0]);chooseQuestion(Number(arg));return;}
  if(action==='home'||action==='report'||action==='extraReport')screen=action;
  if(action==='nextCore'){
    const p=passages.slice(0,3).find(entry=>!complete(nums(entry)));
    if(p)begin(p[0]);else screen='report';
  }
  render();
  window.scrollTo(0,0);
});
render();

</script>
</body>
</html>
