async function checkAnswer(btn, item) { if (state.answered) return; state.answered = true; stopAudio(); const picked = btn.dataset.answer; document.querySelectorAll('.option').forEach((option) => { option.disabled = true; if (option.dataset.answer === item.chinese) option.classList.add('correct'); }); if (picked === item.chinese) { state.score += 1; btn.classList.add('correct'); $('statusText').textContent = '???????? 1 ??'; await playEnglish(item, 1); } else { btn.classList.add('wrong'); state.mistakes.push({ word: item.word, chinese: item.chinese, picked, unit: item.unit, number: item.number }); $('statusText').textContent = '?????????' + item.chinese + '??????? 3 ???? 1 ??'; await playEnglish(item, 3); await playChinese(item); } state.index += 1; $('bar').style.width = ((state.index / state.order.length) * 100) + '%'; window.setTimeout(renderQuestion, 220); }
function showResult() { stopAudio(); $('quizPanel').classList.add('hidden'); $('resultPanel').classList.remove('hidden'); const score = state.score; const percent = Math.round((score / state.order.length) * 100); $('scoreText').textContent = score + ' / ' + state.order.length; let feedback = ''; if (percent >= 90) feedback = '???UNIT10-UNIT12 ??????????????'; else if (percent >= 75) feedback = '?????????????????????'; else if (percent >= 60) feedback = '??????????????????'; else feedback = '????????? UNIT10-UNIT12 ????????'; $('feedbackText').textContent = '??? ' + percent + '%?' + feedback; if (state.mistakes.length === 0) { $('missedBlock').classList.add('hidden'); } else { $('missedBlock').classList.remove('hidden'); $('missedList').innerHTML = state.mistakes.map((item) => '<div class="miss"><strong>' + item.word + ' <small>' + item.unit + ' ? ' + item.number + '</small></strong><span>' + item.chinese + ' ? ????' + item.picked + '</span></div>').join(''); } }
function startTest() { stopAudio(); state.order = buildOrder(); state.index = 0; state.score = 0; state.answered = false; state.mistakes = []; $('quizPanel').classList.remove('hidden'); $('resultPanel').classList.add('hidden'); renderQuestion(); }
$('speakBtn').addEventListener('click', () => { const item = state.order[state.index]; if (item) { stopAudio(); playEnglish(item, 1); } });
$('restartBtn').addEventListener('click', startTest);
startTest();
  </script>
