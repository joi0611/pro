<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第四册 · unit4-1 / unit4-2</title>
  <style>
    :root {
      --ink: #241735;
      --muted: #746884;
      --purple: #5c35a2;
      --purple-dark: #3f236d;
      --purple-soft: #efe5ff;
      --yellow: #ffd766;
      --paper: #fff8df;
      --line: #eadfb9;
      --panel: #fffdf7;
      --shadow: 0 18px 42px rgba(63, 35, 109, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 215, 102, .42), transparent 34%),
        linear-gradient(135deg, #fff8df 0%, #f4eaff 48%, #fff3c6 100%);
      padding: 24px 18px 60px;
    }

    .top {
      width: min(880px, 100%);
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .6);
      border: 1px solid var(--line);
      color: var(--purple-dark);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .back:hover { background: var(--yellow); }

    main { width: min(880px, 100%); margin: 0 auto; }

    header { margin-bottom: 22px; }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(34px, 7vw, 56px);
      line-height: 1.05;
      color: var(--purple-dark);
    }

    .sub {
      margin: 0 0 4px;
      color: var(--purple);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--purple-soft);
      color: var(--purple-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .units { display: grid; gap: 14px; }

    a.card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 102px;
      padding: 22px 24px;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255, 253, 247, .96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    a.card:hover {
      border-color: var(--purple);
      transform: translateY(-1px);
    }

    a.card .title {
      display: block;
      font-size: 28px;
      color: var(--purple-dark);
      font-weight: 800;
    }

    a.card .range {
      display: block;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      margin-top: 4px;
    }

    a.card .arrow {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--yellow);
      color: var(--purple-dark);
      font-size: 28px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html">‹ 返回首页</a>
    <span class="sub">Unit 4-1 · Unit 4-2</span>
  </div>
  <main>
    <header>
      <h1>第四册</h1>
      <p>unit4-1 / unit4-2 两个拆分单元归入第四册，编号 721 – 740。</p>
      <div class="meta">
        <span class="chip">📕 第四册</span>
        <span class="chip">2 单元</span>
        <span class="chip">20 词</span>
      </div>
    </header>

    <section class="units" aria-label="第四册单元列表">
      <a class="card" href="unit4-1.html">
        <div>
          <span class="title">UNIT 4-1</span>
          <span class="range">721 – 730 单词学习</span>
        </div>
        <div class="arrow">›</div>
      </a>
      <a class="card" href="unit4-2.html">
        <div>
          <span class="title">UNIT 4-2</span>
          <span class="range">731 – 740 单词学习</span>
        </div>
        <div class="arrow">›</div>
      </a>
    </section>
  </main>
</body>
</html>
