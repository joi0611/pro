<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1000词伴学</title>
  <style>
    :root {
      --ink: #241735;
      --muted: #746884;
      --purple: #5c35a2;
      --purple-dark: #3f236d;
      --yellow: #ffd766;
      --paper: #fff8df;
      --line: #eadfb9;
      --panel: #fffdf7;
      --shadow: 0 18px 42px rgba(63, 35, 109, .16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 215, 102, .42), transparent 34%),
        linear-gradient(135deg, #fff8df 0%, #f4eaff 48%, #fff3c6 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(860px, 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(42px, 9vw, 78px);
      line-height: 1;
      letter-spacing: 0;
      color: var(--purple-dark);
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 118px;
      padding: 24px;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255, 253, 247, .96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    a:hover {
      border-color: var(--purple);
      transform: translateY(-1px);
    }

    strong {
      display: block;
      font-size: 34px;
      color: var(--purple-dark);
      letter-spacing: 0;
    }

    span {
      color: var(--muted);
      font-weight: 700;
    }

    .arrow {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--yellow);
      color: var(--purple-dark);
      font-size: 28px;
      font-weight: 900;
    }

    .books {
      display: grid;
      gap: 14px;
      margin: 6px 0 26px;
    }

    .books a {
      min-height: 132px;
      padding: 26px 24px;
    }

    .books a strong {
      font-size: 30px;
    }

    .books a .label {
      display: inline-block;
      margin-bottom: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #efe5ff;
      color: var(--purple-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main>
    <h1>1000词伴学</h1>
    <p>选择分册开始学习，按顺序完成每个 Unit 的学习、跟读和中文检测。</p>
    <section class="books" aria-label="分册入口">
      <a href="book1.html">
        <div>
          <span class="label">📘 BOOK 1</span>
          <strong>第一册</strong>
          <span>12 单元 · 240 词 · 1000 Basic English Words Vol.1</span>
        </div>
        <div class="arrow">›</div>
      </a>
      <a href="book2.html">
        <div>
          <span class="label">📗 BOOK 2</span>
          <strong>第二册</strong>
          <span>12 单元 · 240 词 · book2-unit1 – book2-unit12</span>
        </div>
        <div class="arrow">›</div>
      </a>
      <a href="book3.html">
        <div>
          <span class="label">📙 BOOK 3</span>
          <strong>第三册</strong>
          <span>14 单元 · unit1 – unit12 及 unit2-1 / unit2-2</span>
        </div>
        <div class="arrow">›</div>
      </a>
      <a href="book4.html">
        <div>
          <span class="label">📕 BOOK 4</span>
          <strong>第四册</strong>
          <span>2 单元 · 20 词 · unit4-1 / unit4-2</span>
        </div>
        <div class="arrow">›</div>
      </a>
    </section>
  </main>
</body>
</html>
