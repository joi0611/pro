const totalQuestions = 75;
const state = { order: [], index: 0, score: 0, answered: false, mistakes: [], activeAudio: null, audioElements: new Map() };
const $ = (id) => document.getElementById(id);
function shuffle(array) { return [...array].sort(() => Math.random() - 0.5); }
function getAudioElement(url) { if (!url) return null; if (!state.audioElements.has(url)) { const audio = new Audio(url); audio.preload = 'auto'; audio.load(); state.audioElements.set(url, audio); } return state.audioElements.get(url); }
function stopAudio() { if (state.activeAudio) { state.activeAudio.pause(); state.activeAudio.currentTime = 0; state.activeAudio = null; } window.speechSynthesis?.cancel(); }
function speakFallback(text, lang) { return new Promise((resolve) => { if (!('speechSynthesis' in window)) { resolve(); return; } const utterance = new SpeechSynthesisUtterance(text); utterance.lang = lang; utterance.rate = lang === 'zh-CN' ? 0.88 : 0.82; utterance.onend = resolve; utterance.onerror = resolve; window.speechSynthesis.speak(utterance); }); }
function playAudio(url, fallbackText, fallbackLang) { return new Promise((resolve) => { const audio = getAudioElement(url); if (!audio) { speakFallback(fallbackText, fallbackLang).then(resolve); return; } audio.pause(); audio.currentTime = 0; state.activeAudio = audio; audio.onended = () => { if (state.activeAudio === audio) state.activeAudio = null; resolve(); }; audio.onerror = () => { if (state.activeAudio === audio) state.activeAudio = null; speakFallback(fallbackText, fallbackLang).then(resolve); }; audio.play().catch(() => { if (state.activeAudio === audio) state.activeAudio = null; speakFallback(fallbackText, fallbackLang).then(resolve); }); }); }
async function playEnglish(item, times) { for (let i = 0; i < times; i += 1) await playAudio(item.englishAudio, item.word, 'en-US'); }
async function playChinese(item) { await playAudio(item.chineseAudio, item.chinese, 'zh-CN'); }
function makeOptions(correct) { const wrong = shuffle(allWords.filter((item) => item.chinese !== correct.chinese)).slice(0, 3).map((item) => item.chinese); return shuffle([correct.chinese, ...wrong]); }
function preloadCurrent() { const current = state.order[state.index]; if (!current) return; getAudioElement(current.englishAudio); getAudioElement(current.chineseAudio); state.order.slice(state.index + 1, state.index + 4).forEach((item) => { getAudioElement(item.englishAudio); getAudioElement(item.chineseAudio); }); }
function buildOrder() { return shuffle([...coreWords, ...shuffle(reviewWordsMid).slice(0, 10), ...shuffle(reviewWordsEarly).slice(0, 5)]); }
function renderQuestion() { if (state.index >= state.order.length) { showResult(); return; } stopAudio(); state.answered = false; const item = state.order[state.index]; $('wordText').textContent = item.word; $('unitText').textContent = item.unit + ' · ' + item.number; $('countText').textContent = (state.index + 1) + ' / ' + state.order.length; $('bar').style.width = ((state.index / state.order.length) * 100) + '%'; $('statusText').textContent = '请选择中文意思。'; $('options').innerHTML = makeOptions(item).map((option) => '<button class="option" data-answer="' + option.replace(/"/g, '&quot;') + '">' + option + '</button>').join(''); document.querySelectorAll('.option').forEach((btn) => btn.addEventListener('click', () => checkAnswer(btn, item))); preloadCurrent(); }
async function checkAnswer(btn, item) { if (state.answered) return; state.answered = true; stopAudio(); const picked = btn.dataset.answer; document.querySelectorAll('.option').forEach((option) => { option.disabled = true; if (option.dataset.answer === item.chinese) option.classList.add('correct'); }); if (picked === item.chinese) { state.score += 1; btn.classList.add('correct'); $('statusText').textContent = '答对了，播放英文 1 遍。'; await playEnglish(item, 1); } else { btn.classList.add('wrong'); state.mistakes.push({ word: item.word, chinese: item.chinese, picked, unit: item.unit, number: item.number }); $('statusText').textContent = '答错了，正确答案：' + item.chinese + '。正在播放英文 3 遍和中文 1 遍。'; await playEnglish(item, 3); await playChinese(item); } state.index += 1; $('bar').style.width = ((state.index / state.order.length) * 100) + '%'; window.setTimeout(renderQuestion, 260); }
function showResult() { stopAudio(); $('quizPanel').classList.add('hidden'); $('resultPanel').classList.remove('hidden'); const score = state.score; const percent = Math.round((score / state.order.length) * 100); $('scoreText').textContent = score + ' / ' + state.order.length; let feedback = ''; if (percent >= 90) feedback = '优秀：UNIT7-UNIT9 掌握扎实，复习词也稳定。'; else if (percent >= 75) feedback = '良好：大部分词已经熟悉，建议重点回听错题。'; else if (percent >= 60) feedback = '继续加油：先复习错题，再重新测一次。'; else feedback = '需要回炉：建议回到 UNIT7-UNIT9 逐个跟读后再测。'; $('feedbackText').textContent = '正确率 ' + percent + '%。' + feedback; if (state.mistakes.length === 0) { $('missedBlock').classList.add('hidden'); } else { $('missedBlock').classList.remove('hidden'); $('missedList').innerHTML = state.mistakes.map((item) => '<div class="miss"><strong>' + item.word + ' <small>' + item.unit + ' · ' + item.number + '</small></strong><span>' + item.chinese + ' · 你选了：' + item.picked + '</span></div>').join(''); } }
function startTest() { stopAudio(); state.order = buildOrder(); state.index = 0; state.score = 0; state.answered = false; state.mistakes = []; $('quizPanel').classList.remove('hidden'); $('resultPanel').classList.add('hidden'); renderQuestion(); }
$('speakBtn').addEventListener('click', () => { const item = state.order[state.index]; if (item) { stopAudio(); playEnglish(item, 1); } });
