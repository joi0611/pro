<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>三步辨析法操作流程</title>
  <text x="40" y="34" style="font-size:15px;font-weight:500;fill:#2C2C2A">三步辨析法 · 操作流程</text>
  <text x="40" y="56" style="font-size:12px;fill:#5F5E5A">不靠通读全文，靠就近取证解决大部分题</text>

  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="84" width="180" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
    <circle cx="76" cy="118" r="18" fill="#0F6E56"/>
    <text x="76" y="118" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#fff">1</text>
    <text x="104" y="112" style="font-size:14px;font-weight:500;fill:#085041">就近取证</text>
    <text x="60" y="146" style="font-size:12px;fill:#085041">空格前后 60 字符内</text>
    <text x="60" y="166" style="font-size:12px;fill:#085041">找逻辑 / 情感 / 复现线索</text>
    <text x="60" y="186" style="font-size:12px;fill:#085041">63% 题线索就在这圈</text>
  </g>

  <line x1="222" y1="139" x2="252" y2="139" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#as)"/>

  <g>
    <rect x="256" y="84" width="180" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
    <circle cx="292" cy="118" r="18" fill="#185FA5"/>
    <text x="292" y="118" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#fff">2</text>
    <text x="320" y="112" style="font-size:14px;font-weight:500;fill:#0C447C">语义辨析</text>
    <text x="276" y="146" style="font-size:12px;fill:#0C447C">比四个选项的搭配</text>
    <text x="276" y="166" style="font-size:12px;fill:#0C447C">顺文章情感方向</text>
    <text x="276" y="186" style="font-size:12px;fill:#0C447C">92% 干扰项靠这步排</text>
  </g>

  <line x1="438" y1="139" x2="468" y2="139" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#as)"/>

  <g>
    <rect x="472" y="84" width="168" height="110" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
    <circle cx="508" cy="118" r="18" fill="#854F0B"/>
    <text x="508" y="118" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#fff">3</text>
    <text x="536" y="112" style="font-size:14px;font-weight:500;fill:#633806">代入验证</text>
    <text x="492" y="146" style="font-size:12px;fill:#633806">把答案代回原句</text>
    <text x="492" y="166" style="font-size:12px;fill:#633806">读不通就重选</text>
    <text x="492" y="186" style="font-size:12px;fill:#633806">最后一道保险</text>
  </g>
</svg>
