<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>授权管理 | 无限进步训练系统</title>
  <link rel="stylesheet" href="./access.css">
</head>
<body class="access-page">
  <main class="access-card">
    <small>无限进步训练系统</small>
    <h1>手机号授权管理</h1>
    <form id="adminLogin">
      <label>管理员密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button>登录后台</button>
    </form>
    <section id="management" hidden>
      <form id="authorizePhone">
        <label>授权手机号<input name="phone" type="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required placeholder="11位手机号"></label>
        <label>开通专项
          <select name="specialty" required>
            <option value="seven_choice">中考7选5</option>
            <option value="shcloze">上海中考完形填空</option>
          </select>
        </label>
        <label>备注<input name="note" maxlength="100" placeholder="如：学生姓名或班级"></label>
        <button>添加 / 更新授权</button>
      </form>
      <p>已授权 <strong id="phoneCount">0</strong> 个手机号</p>
      <label>查找手机号、专项或备注<input id="phoneSearch" type="search" placeholder="输入关键词"></label>
      <table><thead><tr><th>手机号</th><th>专项</th><th>备注</th><th>操作</th></tr></thead><tbody id="phoneRows"></tbody></table>
      <p id="noPhones" hidden>暂无授权手机号</p>
      <button id="adminLogout" type="button">退出后台</button>
    </section>
    <p class="access-message" id="message" role="status"></p>
    <a href="./index.html">进入七选五训练</a><a href="./login.html">七选五学生登录</a>
  </main>
  <script src="./supabase-config.js"></script><script src="./access.js"></script>
</body>
</html>
