<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读写题篇章训练 · 28 篇</title>
<style>
/* 读写题 · 篇章模式预览页样式
   沿用站点淡紫主调：主操作 #7655A6 / 浅紫 #EDE4F8 / 背景 #FAF8FD / 错误 #B42318 */

:root {
  --pv-primary: var(--ui-primary, #7655A6);
  --pv-primary-dark: var(--ui-primary-hover, #65458f);
  --pv-primary-soft: var(--ui-primary-soft, #efe7fa);
  --pv-bg: var(--ui-background, #faf8fd);
  --pv-surface: var(--ui-surface, #fff);
  --pv-border: var(--ui-border, #ddd2ec);
  --pv-text: var(--ui-text, #19141f);
  --pv-muted: var(--ui-muted, #665d70);
  --pv-good: var(--ui-success, #18794e);
  --pv-good-soft: var(--ui-success-soft, #edf8f2);
  --pv-bad: var(--ui-error, #b42318);
  --pv-bad-soft: var(--ui-error-soft, #fff1f0);
  --pv-warn: #8A5A12;
  --pv-warn-soft: #FFF4E0;
  /* 目录行左侧彩条循环色（与 assets/workbook-modules.css 一致） */
  --stripe-amber: #f2c33c;
  --stripe-green: #55c8a2;
  --stripe-red: #ef817b;
}

* { box-sizing: border-box; }

body.module-reading-writing {
  margin: 0;
  background: var(--pv-bg);
  color: var(--pv-text);
  font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  line-height: 1.75;
}

.hidden { display: none !important; }

/* ---------- 目录页 ---------- */

/*
 * 目录行：与语法填空 / 阅读理解板块统一（数值对齐 assets/workbook-modules.css）。
 * 结构 = 左侧 8px 彩条（紫→黄→青→红 循环）+ 顶部题型金标 + 「01. 标题」
 *        + 来源行 + 右侧紫色「开始训练」按钮。
 */
.passage-catalog-grid {
  display: grid;
  /* minmax(0,1fr)：允许行内 nowrap 文本被省略号截断，不撑破窄屏 */
  grid-template-columns: minmax(0, 1fr);
  gap: 9px;
}

/* 目录分区小标：真题 / 26年模考 / 25年（期中）。
   左侧彩条按类别上色，与品牌紫主调协调；真题用琥珀金突出"真考"。 */
.catalog-section {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 17px 2px 4px;
  padding: 0 2px;
}
.catalog-section:first-child { margin-top: 3px; }
.catalog-section-bar {
  width: 5px;
  height: 18px;
  border-radius: 3px;
  background: var(--pv-primary);
}
.catalog-section[data-cat="真题"] .catalog-section-bar { background: #E0A800; }
.catalog-section[data-cat="26年模考"] .catalog-section-bar { background: #7655A6; }
.catalog-section[data-cat="25年"] .catalog-section-bar { background: #7A8B99; }
.catalog-section-text {
  font-size: 14px;
  font-weight: 900;
  color: #2a2335;
  letter-spacing: .01em;
}
.catalog-section-count {
  font-size: 12px;
  color: #9a93a8;
}

.catalog-row {
  position: relative;
  width: 100%;
  min-height: 76px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 12px 170px 12px 24px;
  border: 1px solid #dfd5eb;
  border-left: 8px solid var(--pv-primary);
  border-radius: 8px;
  background: #fff;
  color: var(--pv-text);
  text-align: left;
  font: inherit;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(59, 40, 86, .06);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}

/* 彩条循环：紫 → 黄 → 青 → 红（与 workbook-modules 完全一致） */
.catalog-row:nth-of-type(4n + 2) { border-left-color: var(--stripe-amber); }
.catalog-row:nth-of-type(4n + 3) { border-left-color: var(--stripe-green); }
.catalog-row:nth-of-type(4n + 4) { border-left-color: var(--stripe-red); }

.catalog-row:hover {
  border-color: var(--pv-primary);
  box-shadow: 0 8px 20px rgba(59, 40, 86, .13);
}

.catalog-row:focus-visible {
  outline: 2px solid var(--pv-primary);
  outline-offset: 2px;
}

/* 顶部徽标：进度状态（未开始 / 已做 x/y / 已通关） */
.catalog-row .row-badge {
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  align-items: center;
  min-height: 28px;
  margin-bottom: 7px;
  padding: 4px 10px;
  border: 1px solid #cfc6dd;
  border-radius: 999px;
  color: #5c5470;
  background: #f2eef8;
  font-size: 13px;
  line-height: 1.2;
  font-weight: 900;
  white-space: nowrap;
}

.catalog-row .row-badge.is-doing {
  border-color: #e4b53f;
  color: #6f4b00;
  background: #ffe4a0;
}

.catalog-row .row-badge.is-passed {
  border-color: #7fc9ab;
  color: #14563c;
  background: #dcf5ea;
}

.catalog-row strong {
  overflow: hidden;
  color: #1c1424;
  font-size: 17px;
  line-height: 1.35;
  font-weight: 900;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.catalog-row .row-meta {
  overflow: hidden;
  margin-top: 4px;
  color: var(--pv-muted);
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}

/* 右侧「开始训练」按钮：与阅读理解板块同款（伪元素实现） */
.catalog-row::after {
  content: "开始训练  →";
  position: absolute;
  top: 50%;
  right: 16px;
  min-width: 130px;
  min-height: 46px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: #fff;
  background: var(--pv-primary);
  transform: translateY(-50%);
  font-weight: 900;
  font-size: 15px;
  letter-spacing: .02em;
}

/* 已通关 → 文案变「重新训练」，与语法板块一致 */
.catalog-row.is-done::after { content: "重新训练  →"; }

@media (max-width: 640px) {
  .catalog-row { padding: 12px 118px 12px 16px; }
  .catalog-row::after {
    right: 10px;
    min-width: 96px;
    min-height: 40px;
    font-size: 13px;
  }
  .catalog-row strong { font-size: 15.5px; white-space: normal; }
}

/* 目录页与训练页切换 */
.passage-catalog[hidden],
.passage-training[hidden] { display: none; }

.catalog-summary {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 13px 17px;
  border: 1px solid var(--pv-border);
  border-radius: 12px;
  background: var(--pv-primary-soft);
  font-size: 13.5px;
  color: var(--pv-primary-dark);
}

.catalog-summary strong { font-size: 17px; }

.catalog-summary .sum-item {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.catalog-back {
  flex: none;
  padding: 7px 15px;
  border: 1px solid var(--pv-primary);
  border-radius: 9px;
  background: #fff;
  color: var(--pv-primary-dark);
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}

.catalog-back:hover { background: var(--pv-primary-soft); }

/* ---------- 工具栏 ---------- */

.passage-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.passage-progress {
  font-size: 14px;
  color: var(--pv-muted);
}

.passage-toolbar button {
  padding: 8px 18px;
  border: 1px solid var(--pv-primary);
  border-radius: 9px;
  background: #fff;
  color: var(--pv-primary-dark);
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--ui-duration, 180ms);
}

.passage-toolbar button:hover { background: var(--pv-primary-soft); }

.passage-progress-text {
  flex: none;
  padding: 6px 0 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--pv-primary-dark);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- 头部 ---------- */





.pv-brand .brand-mark {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #F1C40F;
  color: #4A3312;
  font-weight: 900;
  font-size: 22px;
  flex: none;
}







/* ---------- 篇目选择条 ---------- */

.passage-picker {
  display: flex;
  gap: 8px;
  padding: 10px clamp(16px, 4vw, 40px);
  overflow-x: auto;
  background: #fff;
  border-bottom: 1px solid var(--pv-border);
  scrollbar-width: thin;
}

.passage-picker:empty { display: none; }

.picker-item {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: none;
  padding: 6px 13px;
  border: 1px solid var(--pv-border);
  border-radius: 999px;
  background: #FBF9FE;
  color: var(--pv-muted);
  font: inherit;
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .16s ease;
}

.picker-item strong {
  font-size: 12px;
  font-weight: 800;
  color: var(--pv-primary);
}

.picker-item:hover { border-color: var(--pv-primary); }

.picker-item.active {
  background: var(--pv-primary);
  border-color: var(--pv-primary);
  color: #fff;
}

.picker-item.active strong { color: #F1C40F; }

/* ---------- 布局：区块内双栏，各自独立滚动 ---------- */

/*
 * 正式系统整页本来就要滚动（顶栏 + 页脚），
 * 所以这里不锁死 body，而是给篇章区块自己一个确定高度的双栏舞台：
 * 两栏各自内部滚动，找原文句子时题目不会跟着被推走。
 */
.passage-stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(14px, 1.8vw, 20px);
  align-items: stretch;
}

@media (min-width: 941px) {
  /* 桌面：舞台锁定在视口内，超出部分各自滚动 */
  .passage-stage {
    height: calc(100vh - 210px);
    min-height: 520px;
  }
}

.passage-col { min-width: 0; min-height: 0; display: flex; }

/* 左栏：标题与导读不滚，正文在中间滚动区 */
.passage-col--text .passage-card {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

.passage-col--text .passage-card-head,
.passage-col--text .passage-meta,
.passage-col--text .passage-guide { flex: none; }

@media (max-width: 940px) {
  /* 单栏时不再需要内部滚动区，交回整页滚动 */
  .passage-stage {
    grid-template-columns: minmax(0, 1fr);
    height: auto;
    min-height: 0;
  }
  .passage-col--text .passage-card { overflow: visible; }
  .passage-scroll { overflow-y: visible; }
}

.passage-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--pv-primary) transparent;
  /* 给两端留一点余量，避免首尾段落贴边 */
  padding-right: 6px;
}

.passage-scroll::-webkit-scrollbar { width: 8px; }
.passage-scroll::-webkit-scrollbar-track { background: transparent; }
.passage-scroll::-webkit-scrollbar-thumb {
  background: rgba(118, 85, 166, .32);
  border-radius: 99px;
}
.passage-scroll::-webkit-scrollbar-thumb:hover { background: rgba(118, 85, 166, .5); }

@media (max-width: 940px) {
  /* 单栏时不再需要内部滚动区，交回整页滚动 */
  .passage-scroll { overflow-y: visible; }
}

.passage-card {
  background: var(--pv-surface);
  border: 1px solid var(--pv-border);
  border-radius: 16px;
  padding: clamp(16px, 2.2vw, 24px);
  box-shadow: 0 2px 14px rgba(91, 62, 134, .06);
}

/* 右栏：阶段标签固定，题目区独立滚动 */
.passage-card--work {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.work-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--pv-primary) transparent;
  padding-right: 6px;
}

.work-scroll::-webkit-scrollbar { width: 8px; }
.work-scroll::-webkit-scrollbar-track { background: transparent; }
.work-scroll::-webkit-scrollbar-thumb {
  background: rgba(118, 85, 166, .32);
  border-radius: 99px;
}
.work-scroll::-webkit-scrollbar-thumb:hover { background: rgba(118, 85, 166, .5); }

.passage-card-head { margin-bottom: 12px; }
.passage-card-head h2 { margin: 0; font-size: 18px; }
.passage-hint { margin: 3px 0 0; font-size: 12.5px; color: var(--pv-muted); }

/* ---------- 原文 ---------- */

.passage-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px dashed var(--pv-border);
}

.passage-meta strong { font-size: 16px; }

.theme-badge {
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--pv-primary-soft);
  color: var(--pv-primary-dark);
  font-size: 12.5px;
  font-weight: 600;
}

.passage-meta .source { font-size: 12.5px; color: var(--pv-muted); }

.passage-text {
  padding: 2px 12px 2px 2px;
  font-size: 16.5px;
  line-height: 2.05;
  letter-spacing: .01em;
}

.passage-paragraph { margin: 0 0 6px; text-indent: 0; }

.para-index {
  display: inline-block;
  min-width: 20px;
  margin-right: 6px;
  color: var(--pv-muted);
  font-size: 12.5px;
  font-weight: 700;
  vertical-align: super;
}

.sentence {
  position: relative;
  border-radius: 6px;
  padding: 2px 1px;
  cursor: pointer;
  transition: background-color .18s ease, box-shadow .18s ease;
}

.sentence:hover { background: #F6F2FC; }

.sentence.is-highlight {
  background: var(--pv-primary-soft);
  box-shadow: 0 0 0 2px rgba(118, 85, 166, .28);
}

.sentence.is-probed { box-shadow: 0 0 0 2px rgba(241, 196, 15, .75); }

.anchor-mark {
  background: #F1C40F;
  color: #3F2C08;
  border-radius: 3px;
  padding: 0 2px;
  font-weight: 700;
}

.sentence-refs {
  display: inline-flex;
  gap: 3px;
  vertical-align: middle;
  margin-left: 6px;
  padding-left: 2px;
  opacity: .62;
  transition: opacity .18s ease;
}

.sentence:hover .sentence-refs,
.sentence.is-highlight .sentence-refs { opacity: 1; }

.sentence-ref {
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border: 1px solid var(--pv-primary);
  border-radius: 6px;
  background: #fff;
  color: var(--pv-primary);
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}

.sentence-ref:hover { background: var(--pv-primary); color: #fff; }

.passage-guide {
  flex: none;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--pv-border);
  font-size: 14px;
  color: var(--pv-muted);
}

.passage-guide summary { cursor: pointer; font-weight: 600; color: var(--pv-primary-dark); }
.passage-guide p { margin: 8px 0 0; }

/* ---------- 阶段切换 ---------- */

.stage-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.stage-tab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 14px;
  border: 1px solid var(--pv-border);
  border-radius: 11px;
  background: #FBF9FE;
  color: var(--pv-muted);
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .18s ease;
}

.stage-tab.active {
  border-color: var(--pv-primary);
  background: var(--pv-primary-soft);
  color: var(--pv-primary-dark);
}

.tab-count {
  padding: 1px 8px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--pv-border);
  font-size: 12.5px;
}

/* ---------- 缩写文 ---------- */

/*
 * 缩写文默认折叠。
 * 之前它是展开的长文，右栏首屏全被这段带空格的文字占满，
 * 6 张填空卡片一条都露不出来，学生进来不知道从哪下手。
 * 折叠成一条标题栏后，卡片直接进入首屏；需要通读缩写文时点一下即可展开。
 */
.summary-box {
  padding: 12px 14px;
  margin-bottom: 14px;
  border: 1px dashed var(--pv-primary);
  border-radius: 12px;
  background: #FCFAFE;
}

.summary-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--pv-primary-dark);
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}

.summary-toggle::after {
  content: "展开";
  flex: none;
  padding: 2px 10px;
  border: 1px solid var(--pv-primary);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}

.summary-box.is-open .summary-toggle::after { content: "收起"; }

.summary-body { margin-top: 12px; }
.summary-box:not(.is-open) .summary-body { display: none; }

/* 折叠状态下也能一眼看到有几个空还没填 */
.summary-progress {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 9px;
}

.summary-pip {
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border: 1px solid var(--pv-border);
  border-radius: 6px;
  background: #fff;
  color: var(--pv-muted);
  font-size: 12px;
  font-weight: 700;
  line-height: 20px;
  text-align: center;
}

.summary-pip.is-correct { border-color: var(--pv-good); background: var(--pv-good-soft); color: var(--pv-good); }
.summary-pip.is-wrong { border-color: var(--pv-bad); background: var(--pv-bad-soft); color: var(--pv-bad); }
.summary-pip.is-active { border-color: var(--pv-primary); background: var(--pv-primary-soft); color: var(--pv-primary-dark); }

/* 问答阶段：题干在上、作答区在下，先读题再落笔 */
.question-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}

.question-lead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 9px;
  background: #F8F6FC;
  border-left: 3px solid var(--pv-primary);
}

.question-lead .item-no {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--pv-primary);
  color: #fff;
  font-size: 13px;
  align-self: flex-start;
}

.question-stem {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  font-size: 15.5px;
  font-weight: 600;
  line-height: 1.7;
}

.item-tag {
  flex: none;
  padding: 1px 8px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--pv-border);
  color: var(--pv-muted);
  font-size: 11.5px;
}

.question-write { display: flex; gap: 8px; align-items: stretch; }
.question-write .question-input { flex: 1 1 auto; }
.question-write .submit-question { flex: none; align-self: stretch; }

.summary-instruction {
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--pv-primary-dark);
}

.summary-text-flow {
  margin: 0;
  font-size: 16.5px;
  line-height: 2.35;
}

.summary-blank {
  width: 92px;
  margin: 0 3px;
  padding: 1px 6px;
  border: none;
  border-bottom: 2px solid var(--pv-primary);
  background: transparent;
  color: var(--pv-primary-dark);
  font: inherit;
  font-weight: 700;
  text-align: center;
  outline: none;
}

.summary-blank:focus { background: var(--pv-primary-soft); border-radius: 4px 4px 0 0; }
.summary-blank.is-correct { border-bottom-color: var(--pv-good); color: var(--pv-good); background: var(--pv-good-soft); }
.summary-blank.is-wrong { border-bottom-color: var(--pv-bad); color: var(--pv-bad); background: var(--pv-bad-soft); }

/* ---------- 题目卡片 ---------- */

.blank-item,
.question-item {
  padding: 14px 16px;
  margin-bottom: 12px;
  border: 1px solid var(--pv-border);
  border-radius: 12px;
  background: #fff;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.blank-item.is-active,
.question-item.is-active {
  border-color: var(--pv-primary);
  box-shadow: 0 0 0 3px rgba(118, 85, 166, .14);
}

.item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.item-no { font-size: 15px; font-weight: 800; color: var(--pv-primary-dark); }

.item-category {
  padding: 2px 9px;
  border-radius: 999px;
  background: #F4F0FA;
  color: var(--pv-muted);
  font-size: 12px;
}

.item-context { margin-bottom: 10px; }

.context-label {
  display: inline-block;
  margin-bottom: 3px;
  font-size: 12px;
  font-weight: 700;
  color: var(--pv-muted);
}

.item-context p {
  margin: 0;
  padding: 8px 11px;
  border-radius: 8px;
  background: #F8F6FC;
  font-size: 14.5px;
  line-height: 1.85;
}

.question-stem { margin: 0 0 10px; font-size: 16px; font-weight: 600; }

.item-answer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.item-answer label { font-size: 13px; font-weight: 700; color: var(--pv-muted); }

.blank-input,
.question-input {
  flex: 1 1 190px;
  min-width: 0;
  padding: 8px 11px;
  border: 1px solid var(--pv-border);
  border-radius: 9px;
  background: #fff;
  font: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.question-input { resize: vertical; line-height: 1.7; }

.blank-input:focus,
.question-input:focus {
  border-color: var(--pv-primary);
  box-shadow: 0 0 0 3px rgba(118, 85, 166, .14);
}

.submit-blank,
.submit-question {
  padding: 8px 18px;
  border: none;
  border-radius: 9px;
  background: var(--pv-primary);
  color: #fff;
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color .18s ease;
}

.submit-blank:hover,
.submit-question:hover { background: var(--pv-primary-dark); }

.item-feedback {
  margin-top: 9px;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  display: none;
}

.item-feedback.good { display: block; background: var(--pv-good-soft); color: var(--pv-good); }
.item-feedback.bad { display: block; background: var(--pv-bad-soft); color: var(--pv-bad); }
.item-feedback.warn { display: block; background: var(--pv-warn-soft); color: var(--pv-warn); }

.item-detail {
  margin-top: 9px;
  padding: 11px 13px;
  border-left: 3px solid var(--pv-primary);
  border-radius: 0 8px 8px 0;
  background: #F8F6FC;
  font-size: 13.5px;
  line-height: 1.8;
}

.item-detail p { margin: 0 0 6px; }
.item-detail p:last-child { margin-bottom: 0; }

.detail-distractors code {
  display: inline-block;
  margin: 0 3px;
  padding: 0 6px;
  border-radius: 5px;
  background: var(--pv-bad-soft);
  color: var(--pv-bad);
  font-size: 13px;
}

/* ---------- 结果条 ---------- */

.stage-result {
  margin-top: 14px;
  padding: 13px 16px;
  border-radius: 11px;
  background: #F4F0FA;
  font-size: 14px;
  color: var(--pv-muted);
}

.stage-result.finished { background: var(--pv-good-soft); color: var(--pv-good); }

.result-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  margin-bottom: 4px;
}

.result-line strong { font-size: 19px; color: var(--pv-primary-dark); }
.result-remind { margin: 0; font-size: 13.5px; }
.result-remind.ok { color: var(--pv-good); font-weight: 700; }

/* ---------- 反查浮层 ---------- */

.ref-popover {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 16px;
  border-radius: 999px;
  background: #2B2233;
  color: #fff;
  font-size: 13.5px;
  box-shadow: 0 8px 26px rgba(0, 0, 0, .26);
  z-index: 40;
}

.ref-jump {
  padding: 4px 12px;
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 999px;
  background: transparent;
  color: #F1C40F;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.ref-jump:hover { background: #F1C40F; color: #3F2C08; }


body.rw-standalone { margin: 0; padding: 20px 20px 28px; background: var(--pv-bg); }
.rw-standalone .passage-stage { height: calc(100vh - 168px); }
</style>

            "text": "Yang often saw kites with bright colors and different shapes in her grandfather’s workshop."

<script>/*
 * 读写题 · 篇章模式引擎（纯逻辑，无 DOM）
 * 职责：篇章数据建模、填空/问答分级判分、原文证据索引
 *
 * 设计要点
 * 1. 原文按「段 → 句」拆分，每句有稳定 id（p2s3），是所有高亮的锚点。
 * 2. 每个填空与每道问答都挂 evidence（证据句 id 数组）+ 可选 anchor（句内锚词）。
 * 3. 双向索引：题 → 原文句（做题时高亮）；原文句 → 题（点句子反查归属）。
 * 4. 问答采用「分级判分」而不是整句严格匹配，让学生看得懂为什么被判对/判错。
 */
window.PassageEngine = (function () {
  'use strict';

  /* ---------------- 基础工具 ---------------- */

  function normalize(value) {
    return String(value == null ? '' : value)
      .trim()
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  // 多答案分隔：/ ／ or 或者
  function splitAnswers(value) {
    return String(value == null ? '' : value)
      .split(/\s*(?:\/|／|\bor\b|或者)\s*/i)
      .map(item => item.trim())
      .filter(Boolean);
  }

  /*
   * 数字等价：中考答案常同时给数字与英文数词（"Three." / "3 times."），
   * 学生写哪种都算对，判分时必须互认。
   */
  const NUMBER_WORDS = {
    one: '1', two: '2', three: '3', four: '4', five: '5',
    six: '6', seven: '7', eight: '8', nine: '9', ten: '10',
    twice: '2', thrice: '3', once: '1'
  };

  function numberForms(token) {
    const t = normalize(token);
    const out = [t];
    if (NUMBER_WORDS[t]) out.push(NUMBER_WORDS[t]);
    Object.keys(NUMBER_WORDS).forEach(w => {
      if (NUMBER_WORDS[w] === t) out.push(w);
    });
    return out;
  }

  /** 关键词是否命中：数字/数词互认，其余走子串包含 */
  function keywordHit(typed, keyword) {
    if (typed.includes(normalize(keyword))) return true;
    const kwForms = numberForms(keyword);
    if (kwForms.length <= 1) return false;
    // 关键词是数字或数词时，检查学生作答里有没有等价写法
    return kwForms.some(form =>
      new RegExp('(^|\\W)' + form.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|\\W)').test(typed));
  }

  /* ---------------- 填空判分 ---------------- */

  /**
   * @returns {{level:'blank'|'correct'|'wrong', accepted:string[], matched:string}}
   * 填空沿用严格字符串匹配：忽略首尾空格、连续空格与大小写；不忽略标点，不做词形模糊。
   */
  function gradeBlank(blank, input) {
    const typed = normalize(input);
    const accepted = splitAnswers(blank.answer);
    if (!typed) return { level: 'blank', accepted, matched: '' };
    const matched = accepted.find(item => normalize(item) === typed) || '';
    return {
      level: matched ? 'correct' : 'wrong',
      accepted,
      matched
    };
  }

  /* ---------------- 问答判分 ---------------- */

  const POLARITY_RULES = [
    { value: 'yes', pattern: /\byes\b/ },
    { value: 'no', pattern: /\bno\b/ }
  ];

  // 判断题极性识别：优先看句首 40 字符，避免句尾赘述造成误判
  function detectPolarity(text) {
    const normalized = normalize(text);
    if (!normalized) return '';
    const head = normalized.slice(0, 40);
    const scan = value => {
      for (const rule of POLARITY_RULES) {
        if (rule.pattern.test(value)) return rule.value;
      }
      return '';
    };
    return scan(head) || scan(normalized);
  }

  /**
   * 问答题分级判分
   * level: blank | correct | partial | wrong
   * partial 表示「方向对但表达不完整」，这是学生最需要知道的一档。
   */
  function gradeQuestion(question, input) {
    const typed = normalize(input);
    const accepted = splitAnswers(question.answer);
    const keywords = question.keywords || [];

    if (!typed) {
      return { level: 'blank', hits: [], misses: keywords, accepted };
    }

    // 1) 与标准答案完全一致
    if (accepted.some(item => normalize(item) === typed)) {
      return { level: 'correct', hits: keywords.slice(), misses: [], accepted, exact: true };
    }

    // 2) 判断题先校验极性
    if (question.polarity) {
      const polarity = detectPolarity(typed);
      if (!polarity) {
        return {
          level: 'wrong',
          hits: [],
          misses: keywords,
          accepted,
          reason: 'polarity-missing',
          message: '这是判断题，请先明确回答 Yes 或 No。'
        };
      }
      if (polarity !== question.polarity) {
        return {
          level: 'wrong',
          hits: [],
          misses: keywords,
          accepted,
          reason: 'polarity',
          message: `原文证据与「${question.polarity === 'yes' ? 'Yes' : 'No'}」相反，重新回原文找依据句。`
        };
      }
    }

    // 3) 关键词覆盖度
    const hits = [];
    const misses = [];
    keywords.forEach(keyword => {
      if (keywordHit(typed, keyword)) hits.push(keyword);
      else misses.push(keyword);
    });

    /*
     * 覆盖率阈值判对（joi姐 截图反馈后修正）：
     * 关键词是「采分点」而非逐词复现，学生用同义表达时不必逐字命中。
     * 命中 ≥ 75% 即判对——例如标答 "She learned to cook fried dishes and dumplings."，
     * 关键词为 ['cook','fried','dishes','dumplings']，
     * 学生写 "fried dishes and dumplings"（省略动词 cook）命中 3/4 = 75% → 判对；
     * 而只写 "cooked" 只命中 1/4 = 25% → partial，不会误判。
     */
    const COVERAGE = 0.75;
    if (keywords.length && !misses.length) {
      return { level: 'correct', hits, misses, accepted, exact: true };
    }
    if (keywords.length && hits.length / keywords.length >= COVERAGE) {
      return { level: 'correct', hits, misses, accepted, coverage: hits.length / keywords.length };
    }

    /*
     * partial = 立场/大意对，但表达不完整。
     * 判断题只要极性对了就说明立场已经找对，因此极性命中时缺失关键词只降级为 partial，
     * 不应判错——例如第 7 题只写 "Yes."，问题在表达规范，不在理解方向。
     */
    if (hits.length || (question.polarity && detectPolarity(typed) === question.polarity)) {
      return {
        level: 'partial',
        hits,
        misses,
        accepted,
        message: question.polarity && !hits.length
          ? '判断方向正确，但主语和助动词没有跟上。'
          : ''
      };
    }

    return {
      level: 'wrong',
      hits,
      misses,
      accepted,
      reason: 'keyword',
      message: '没有命中任何关键信息，回到原文找依据句再作答。'
    };
  }

  /* ---------------- 篇章索引 ---------------- */

  /**
   * 建立句子总表与双向索引
   * @returns {{
   *   passage: object,
   *   sentences: object,          // id -> sentence
   *   blanks: Array,
   *   questions: Array,
   *   allItems: Array,            // 填空 + 问答，按题号排序
   *   refsBySentence: object,     // sentenceId -> [item]
   *   refsByBlank: object,        // blankNo -> item
   *   refsByQuestion: object      // questionNo -> item
   * }}
   */
  function buildIndex(rawPassage) {
    const passage = normalizePassage(rawPassage);
    const sentences = {};
    passage.paragraphs.forEach(paragraph => {
      (paragraph.sentences || []).forEach(sentence => {
        sentences[sentence.id] = sentence;
      });
    });

    const refsBySentence = {};
    const refsByBlank = {};
    const refsByQuestion = {};

    const register = item => {
      (item.evidence || []).forEach(sentenceId => {
        if (!refsBySentence[sentenceId]) refsBySentence[sentenceId] = [];
        refsBySentence[sentenceId].push(item);
      });
    };

    const blanks = passage.blanks.map(blank => {
      const item = Object.assign({ kind: 'blank' }, blank);
      register(item);
      refsByBlank[String(item.no)] = item;
      return item;
    });

    const questions = passage.questions.map(question => {
      const item = Object.assign({ kind: 'question' }, question);
      register(item);
      refsByQuestion[String(item.no)] = item;
      return item;
    });

    const allItems = blanks
      .concat(questions)
      .sort((a, b) => Number(a.no) - Number(b.no));

    return {
      passage,
      sentences,
      blanks,
      questions,
      allItems,
      refsBySentence,
      refsByBlank,
      refsByQuestion
    };
  }

  /* ---------------- 数据规范化 ---------------- */

  function normalizePassage(raw) {
    const paragraphs = (raw.paragraphs || []).map((paragraph, pIndex) => {
      const sentences = (paragraph.sentences || []).map((sentence, sIndex) => ({
        id: sentence.id || `p${pIndex + 1}s${sIndex + 1}`,
        text: String(sentence.text || '').trim()
      }));
      return { sentences };
    });

    const blanks = (raw.blanks || []).map((blank, index) => ({
      no: String(blank.no != null ? blank.no : index + 1),
      answer: blank.answer == null ? '' : String(blank.answer),
      meaning: blank.meaning || '',
      category: blank.category || '原词复现',
      point: blank.point || '',
      studyPoint: blank.studyPoint || '',
      evidence: blank.evidence || [],
      anchor: blank.anchor || '',
      distractors: blank.distractors || []
    }));

    const questions = (raw.questions || []).map((question, index) => ({
      no: String(question.no != null ? question.no : blanks.length + index + 1),
      type: question.type || 'wh',
      question: String(question.question || '').trim(),
      answer: question.answer == null ? '' : String(question.answer),
      polarity: question.polarity || '',
      keywords: question.keywords || [],
      point: question.point || '',
      studyPoint: question.studyPoint || '',
      evidence: question.evidence || [],
      anchor: question.anchor || ''
    }));

    return {
      id: raw.id || '',
      title: raw.title || '',
      theme: raw.theme || '',
      source: raw.source || '',
      guide: raw.guide || '',
      blankInstruction: raw.blankInstruction || '',
      questionInstruction: raw.questionInstruction || '',
      paragraphs,
      summary: parseSummary(raw.summary || ''),
      blanks,
      questions
    };
  }

  /*
   * 摘要文解析：把 "…he was {{1}} because…" 拆成片段数组
   * 片段类型：{ type:'text', text } | { type:'blank', no }
   * 这样渲染时才能把空位做成真正可输入的框，同时保持原文一字不改。
   */
  function parseSummary(summary) {
    const parts = [];
    const pattern = /\{\{(\d+)\}\}/g;
    let cursor = 0;
    let match = pattern.exec(summary);
    while (match) {
      if (match.index > cursor) {
        parts.push({ type: 'text', text: summary.slice(cursor, match.index) });
      }
      parts.push({ type: 'blank', no: String(match[1]) });
      cursor = match.index + match[0].length;
      match = pattern.exec(summary);
    }
    if (cursor < summary.length) {
      parts.push({ type: 'text', text: summary.slice(cursor) });
    }
    return parts;
  }

  return {
    normalize,
    splitAnswers,
    gradeBlank,
    gradeQuestion,
    detectPolarity,
    buildIndex
  };
})();</script>

 * 接入原则：
 * - 不改动原 learningItems 的 id 与内容，已有掌握进度不受影响
 * - 新条目用独立 id 段（rw-passage-*），可与旧进度共存
 * - 只收「短语 → 单词」压缩型转换；纯原词复现没有学习价值

(function () {

  const passages = window.PASSAGES_DATA;
  if (!Array.isArray(learning) || !Array.isArray(passages)) return;

  const STOPWORD = new Set(['the', 'a', 'an', 'of', 'in', 'on', 'at', 'to', 'and', 'or',
    'is', 'are', 'was', 'were', 'be', 'been', 'for', 'with', 'as', 'by', 'that', 'this',
    'these', 'those', 'it', 'he', 'she', 'they', 'we', 'i', 'you', 'his', 'her', 'their',
    'my', 'your', 'our', 'its', 'from', 'not', 'no', 'do', 'does', 'did', 'have', 'has',
    'had', 'will', 'would', 'can', 'could', 'should', 'may', 'might', 'must', 's']);

  // 以这些词开头说明抓到的是句子碎片，不是考点短语
  const VERBISH = new Set(['was', 'were', 'is', 'are', 'be', 'been', 'being', 'am',
    'had', 'has', 'have', 'did', 'does', 'do', 'seemed', 'seems', 'seem', 'said', 'says',
    'say', 'told', 'tells', 'asked', 'asks', 'ask', 'walked', 'walks', 'came', 'comes',
    'come', 'gave', 'gives', 'give', 'took', 'takes', 'take', 'made', 'makes', 'make',
    'went', 'goes', 'go', 'saw', 'sees', 'see', 'felt', 'feels', 'feel', 'got', 'gets',
    'get', 'wanted', 'wants', 'want', 'likes', 'like', 'liked', 'helped', 'helps', 'help',
    'began', 'begins', 'begin', 'started', 'starts', 'start', 'then', 'there', 'because',
    'but', 'so', 'when', 'while', 'if', 'although', 'though', 'since', 'as']);

  /*
   * 从【详解】的 point 文本里取考点引文。
   * 形如：文章第2段“Then, a little girl came towards him and said in a polite voice”表明…
   */
  function quoteOf(point) {
    const m = String(point || '').match(/[“"]([^”"]+)[”"]/);
    return m ? m[1] : '';
  }

  /*
   * 从引文里抽「答案词所在的语法块」作为短语。
   * 以答案词为中心，向左跨过停用词收实词，向右收 1 词，命中句法边界即止。
   */
  function extractPhrase(quote, target) {
    const text = String(quote || '').replace(/\s+/g, ' ').trim();
    const firstWord = String(target).split(/\s+/)[0]
      .toLowerCase().replace(/[^a-z']/g, '');
    if (!text || !firstWord || firstWord.length < 2) return '';

    const words = text.split(/\s+/);
    let pos = -1;
    for (let i = 0; i < words.length; i += 1) {

    for (let i = pos - 1; i >= 0 && left.length < 4; i -= 1) {
      const raw = words[i];
      if (!isWord(raw)) {
        if (/[,.;:!?]/.test(raw) && left.length) break;
        continue;
      }
      const w = norm(raw);
      if (left.length && VERBISH.has(w)) break;   // 跨过分句边界就不是同一个意群
      if (STOPWORD.has(w) && left.length >= 2) break;
      left.unshift(clean(raw));
    }

    const right = [];
    for (let i = pos + 1; i < words.length && right.length < 2; i += 1) {
      const raw = words[i];
      if (!isWord(raw)) {
        if (/[,.;:!?“”"]/.test(raw) && right.length) break;
        continue;
      }
      const w = norm(raw);
      if (STOPWORD.has(w) && right.length) break;
      if (VERBISH.has(w) && right.length) break;
      right.push(clean(raw));
    }

    const leftPhrase = left.filter(Boolean).join(' ').trim();
    const rightPhrase = right.filter(Boolean).join(' ').trim();

    const cands = [];
    if (leftPhrase && leftPhrase.split(' ').length >= 2) cands.push(leftPhrase);
    if (leftPhrase && rightPhrase) {
      const combo = (leftPhrase + ' ' + rightPhrase).trim();
      if (combo.split(' ').length >= 2) cands.push(combo);
    }
    if (!cands.length && rightPhrase && rightPhrase.split(' ').length >= 2) cands.push(rightPhrase);
    return cands[0] || '';
  }

  function isGoodPhrase(phrase, target) {
    if (!phrase) return false;
    const words = phrase.split(/\s+/).filter(Boolean);
    if (words.length < 2 || words.length > 4) return false;

    const norm = w => w.toLowerCase().replace(/[^a-z']/g, '');
    const head = norm(words[0]);
    const tail = norm(words[words.length - 1]);

    // 首词不能是系动词/实义动词/连词，也不能是冠词介词
    if (VERBISH.has(head) || STOPWORD.has(head)) return false;
    // 尾词不能是系动词/连词——"girl was"、"parents allow" 都是残句
    if (VERBISH.has(tail) || STOPWORD.has(tail)) return false;
    // 短语内部不允许出现系动词，那说明跨越了分句边界
    if (words.slice(1).some(w => ['was', 'were', 'is', 'are', 'be', 'been', 'am'].includes(norm(w)))) return false;

    const np = phrase.toLowerCase();
    const nt = target.toLowerCase();
    if (np === nt) return false;
    if (nt.length > 3 && np.includes(nt)) return false;

    // 至少一个实词，避免整句虚词
    return words.some(w => {
      const t = norm(w);
      return t.length > 3 && !STOPWORD.has(t);

   * 形如：…表明因为没人买他的鞋，老人看起来十分无助。
   * 取「表明/意为/指的是/意思是/即」之后的第一个分句。
   * 详解结尾常带「故填 xxx」「因此答案是原文直接信息」这类尾巴，要剔除，
   * 否则释义会变成「，此处修饰way」这种无意义片段。
   */
  function meaningOf(point) {
    let raw = String(point || '')
      .replace(/^[^”"]*[”"]/, '')
      .replace(/[”"].*$/, '')
      .trim();
    // 剔除「故填…」「因此答案是…」「可知，」等尾巴与前缀
    raw = raw
      .replace(/^(可知|因此|所以)[，,]?/, '')
      .replace(/[，,]?\s*(故填|故用|应填|因此答案是|所以填|答案)[^。；]*$/, '')
      .replace(/[，,]\s*此处[^。；]*$/, '')
      .replace(/[，,]\s*修饰[^。；]*$/, '')
      .trim();
    if (!raw) return '';
    const m = raw.match(/(?:表明|意为|指的是|意思是|即)([^。；]{2,26})/);
    if (m) return m[1].trim();
    const first = raw.split(/[。；]/)[0].trim();
    if (first.length >= 2 && first.length <= 26 && !/[a-zA-Z]{3,}/.test(first)) return first;
    return '';
  }

  const existing = new Set(
    learning.map(i => String(i.target || '').trim().toLowerCase()).filter(Boolean)
  );
  const created = [];
  const seen = new Set();

  passages.forEach(passage => {
    (passage.blanks || []).forEach(blank => {
      if (!blank || !blank.answer) return;
      const quote = quoteOf(blank.point);
      if (!quote) return;

      const target = blank.answer.split('/')[0].trim();
      if (!target || target.length > 24) return;

      const phrase = extractPhrase(quote, target);
      if (!isGoodPhrase(phrase, target)) return;

      // 释义是必填项：解析版对某些题只写「因此答案是原文直接信息」这类占位说明，
      // 这种条目进学习区只会误导学生，直接丢弃。
      const meaning = meaningOf(blank.point);
      if (!meaning || /原文直接信息|^，|^故|^应填/.test(meaning)) return;

      const key = (phrase + '→' + target).toLowerCase();
      if (seen.has(key)) return;
      if (existing.has(target.toLowerCase())) return;
      seen.add(key);

      created.push({
        id: 'rw-passage-' + passage.id + '-' + blank.no,
        category: '篇章填空 · 同义转换',
        source: passage.source,
        number: String(blank.no),
        original: phrase,
        target: target,
        meaning: meaning,
        point: String(blank.point || '').slice(0, 200),
        studyPoint: '先回原文定位这个短语，看它被压缩成了哪个词。',
        originalSentence: quote,
        targetSentence: '',
        answer: target
      });
    });
  });

  if (!created.length) return;
  window.MVP_DATA.learningItems = learning.concat(created);

<script>/*
 * 读写题 · 篇章模式视图

 *          点击原文任意句 → 反查该句支撑了哪几道题，并给出跳转。
 *

 */
(function () {
  'use strict';

  const Engine = window.PassageEngine;

  let stage = 'blank';
let answers = {};

let activeItemNo = '';
let library = [];
let currentPassageIndex = 0;
let stageTabsBound = false;

  document.addEventListener('DOMContentLoaded', init);

  function init() {

    const list = Array.isArray(window.PASSAGES_DATA) && window.PASSAGES_DATA.length
      ? window.PASSAGES_DATA
      : (Array.isArray(window.PASSAGE_DATA) ? window.PASSAGE_DATA : []);
    if (!list.length) return;

    els.root = root;

    els.passageScroll = document.getElementById('passageScroll');
    els.workScroll = document.getElementById('workScroll');

    // 同一地区优先级内保持数据文件的原始顺序。
    library = list.map((item, sourceIndex) => ({ item, sourceIndex }))
      .sort((a, b) => {
        return getUpdatedSourceRank(a.item.source) - getUpdatedSourceRank(b.item.source)
          || a.sourceIndex - b.sourceIndex;
      })
      .map(({ item }) => item);

    // 初始停在目录页：先看总览，想练哪篇再点进去

  /* ---------------- 篇目选择 ---------------- */

  function renderPicker() {

    if (!box) return;
    box.innerHTML = library.map((p, i) => `
      <button type="button" class="picker-item${i === currentPassageIndex ? ' active' : ''}" data-passage-index="${i}">
        <strong>${escapeHtml(String(i + 1).padStart(2, '0'))}</strong>
        <span>${escapeHtml(cleanTitle(p))}</span>
      </button>

  }

  // 返回目录按钮（只绑一次）
  function bindCatalogBack() {

  function cleanTitle(p) {
    const t = String(p.titleCn || '').trim();

  function renderCatalog() {

    ];

      const nb = (p.blanks || []).length;
      const nq = (p.questions || []).length;
      const saved = loadAllProgress()[String(p.id)] || {};
      const res = saved.results || {};
      let done = 0;
      (p.blanks || []).concat(p.questions || []).forEach(it => {
        const r = res[String(it.no)];
        if (r && r.level === 'correct') done += 1;

      const total = nb + nq;

      const badge = finished

  function renderBlanks() {
    els.blankPanel.innerHTML = index.blanks.map(blank => `
      <article class="blank-item" data-blank-item="${blank.no}">
        <div class="item-head">
          <span class="item-no">第 ${blank.no} 空</span>
          <span class="item-category">${escapeHtml(blank.category)}</span>
        </div>
        <div class="item-context">
          <span class="context-label">缩写文语境</span>
          <p>${escapeHtml(blankContext(blank.no))}</p>
        </div>
        <div class="item-answer">
          <label for="blank-input-${blank.no}">我的答案</label>
          <input id="blank-input-${blank.no}" class="blank-input" type="text" data-blank-input="${blank.no}" autocomplete="off" spellcheck="false" placeholder="每空一词">
          <button type="button" class="submit-blank" data-submit-blank="${blank.no}">提交</button>
        </div>
        <div class="item-feedback" data-blank-feedback="${blank.no}"></div>
        <div class="item-detail hidden" data-blank-detail="${blank.no}">
          <p class="detail-point"><strong>解析：</strong>${escapeHtml(blank.point)}</p>
          <p class="detail-study"><strong>怎么判断：</strong>${escapeHtml(blank.studyPoint)}</p>
          ${blank.distractors.length ? `
            <p class="detail-distractors"><strong>易错干扰：</strong>${blank.distractors.map(word => `<code>${escapeHtml(word)}</code>`).join('、')}</p>
          ` : ''}
        </div>
      </article>
    `).join('');

    els.blankPanel.querySelectorAll('[data-blank-input]').forEach(input => {
      const no = input.dataset.blankInput;
      if (answers[no]) input.value = answers[no];
      input.addEventListener('focus', () => setActiveItem(no, 'blank'));
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          submitBlank(no);
          focusNextBlank(no);
        }
      });
    });

    els.blankPanel.querySelectorAll('[data-submit-blank]').forEach(button => {
      button.addEventListener('click', () => submitBlank(button.dataset.submitBlank));
    });

    syncBlankInputs();
  }

  /*
   * 填空语境 = 该空所在的完整一句话（句子边界按 . ! ? 切分），
   * 而不是前后各截一段——「一句话」才是学生真正要定位的最小单位。
   */
  function blankContext(no) {
    const flat = index.passage.summary
      .map(part => (part.type === 'text' ? part.text : `____${part.no}____`))
      .join('');

    const target = `____${no}____`;
    const at = flat.indexOf(target);
    if (at < 0) return '____';

    let start = 0;
    for (let i = at - 1; i >= 0; i -= 1) {
      if ('.!?'.includes(flat[i]) && /[\s"'”’)\]]*$/.test(flat.slice(i + 1, i + 4))) {
        start = i + 1;
        break;
      }
    }
    let end = flat.length;
    for (let i = at; i < flat.length; i += 1) {
      if ('.!?'.includes(flat[i])) {
        end = i + 1;
        break;
      }
    }

    const sentence = flat.slice(start, end).trim();
    // 同句内若有其他空，用「（第 n 空）」占位，避免抢注意力
    return sentence
      .replace(/____(\d+)____/g, (match, otherNo) => (String(otherNo) === String(no) ? '____' : `（第 ${otherNo} 空）`))
      .replace(/\s+/g, ' ')
      .trim();
  }

  function syncBlankInputs() {
    els.summaryBox.querySelectorAll('.summary-blank').forEach(input => {
      const no = input.dataset.blank;
      if (answers[no]) input.value = answers[no];
      applyBlankLook(input, no);
    });
    els.blankPanel.querySelectorAll('[data-blank-input]').forEach(input => {
      const no = input.dataset.blankInput;
      if (answers[no]) input.value = answers[no];
    });
  }

  function submitBlank(no) {
    const blank = index.refsByBlank[String(no)];
    if (!blank) return;
    const input = els.blankPanel.querySelector(`[data-blank-input="${no}"]`);
    const typed = input ? input.value : '';
    answers[String(no)] = typed;
    const result = Engine.gradeBlank(blank, typed);
    results[String(no)] = result;

    applyBlankLook(els.summaryBox.querySelector(`.summary-blank[data-blank="${no}"]`), String(no));

    const feedback = els.blankPanel.querySelector(`[data-blank-feedback="${no}"]`);
    const detail = els.blankPanel.querySelector(`[data-blank-detail="${no}"]`);
    if (!feedback) return;

    if (result.level === 'blank') {
      feedback.className = 'item-feedback warn';
      feedback.textContent = '这一空还没作答，先写下你的答案。';
      detail.classList.add('hidden');
      saveProgress();
      return;
    }
    if (result.level === 'correct') {
      feedback.className = 'item-feedback good';
      feedback.textContent = `正确：${result.matched}`;
    } else {
      feedback.className = 'item-feedback bad';
      feedback.textContent = `不对。参考答案：${result.accepted.join(' / ')}`;
    }
    detail.classList.remove('hidden');
    highlightEvidence(blank.evidence, blank.anchor);
    saveProgress();
    updateProgress();
  }

  function focusNextBlank(no) {
    const next = index.blanks.find(blank => Number(blank.no) === Number(no) + 1);
    if (!next) return;
    const input = els.blankPanel.querySelector(`[data-blank-input="${next.no}"]`);
    if (input) input.focus();
  }

  /* ---------------- 第二节：问答作答区 ---------------- */

  /*
   * 问答题的作答动线是「读题 → 回原文找句 → 落笔」，
   * 因此题干整行放在上方，输入框和提交按钮压在其下一行，
   * 视线自上而下走一遍正好是做题顺序。
   */
  function renderQuestions() {
    els.questionPanel.innerHTML = index.questions.map(question => `
      <article class="question-item" data-question-item="${question.no}">
        <div class="question-row">
          <div class="question-lead">
            <span class="item-no">${escapeHtml(question.no)}</span>
            <p class="question-stem">${escapeHtml(question.question)}</p>
            <span class="item-tag">${question.type === 'yesno' ? '判断正误' : '细节理解'}</span>
          </div>
          <div class="question-write">
            <label class="sr-only" for="question-input-${question.no}">第 ${escapeHtml(question.no)} 题作答</label>
            <textarea id="question-input-${question.no}" class="question-input" data-question-input="${question.no}" rows="2" placeholder="用完整的一句英语作答"></textarea>
            <button type="button" class="submit-question" data-submit-question="${question.no}">提交</button>
          </div>
        </div>
        <div class="item-feedback" data-question-feedback="${question.no}"></div>
        <div class="item-detail hidden" data-question-detail="${question.no}">
          <p class="detail-point"><strong>解析：</strong>${escapeHtml(question.point)}</p>
          <p class="detail-study"><strong>怎么判断：</strong>${escapeHtml(question.studyPoint)}</p>
        </div>
      </article>
    `).join('');

    els.questionPanel.querySelectorAll('[data-question-input]').forEach(input => {
      const no = input.dataset.questionInput;
      if (answers[no]) input.value = answers[no];
      input.addEventListener('focus', () => setActiveItem(no, 'question'));
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          submitQuestion(no);
        }
      });
    });

    els.questionPanel.querySelectorAll('[data-submit-question]').forEach(button => {
      button.addEventListener('click', () => submitQuestion(button.dataset.submitQuestion));
    });
  }

  function submitQuestion(no) {
    const question = index.refsByQuestion[String(no)];
    if (!question) return;
    const input = els.questionPanel.querySelector(`[data-question-input="${no}"]`);
    const typed = input ? input.value : '';
    answers[String(no)] = typed;
    const result = Engine.gradeQuestion(question, typed);
    results[String(no)] = result;

    const feedback = els.questionPanel.querySelector(`[data-question-feedback="${no}"]`);
    const detail = els.questionPanel.querySelector(`[data-question-detail="${no}"]`);
    if (!feedback) return;

    if (result.level === 'blank') {
      feedback.className = 'item-feedback warn';
      feedback.textContent = '这一题还没作答。';
      detail.classList.add('hidden');
      saveProgress();
      return;
    }
    if (result.level === 'correct') {
      feedback.className = 'item-feedback good';
      feedback.textContent = result.exact ? '正确，与参考答案一致。' : `意思到位：命中 ${result.hits.join('、')}。`;
    } else if (result.level === 'partial') {
      feedback.className = 'item-feedback warn';
      const prefix = result.message ? `${result.message} ` : '';
      feedback.textContent = `${prefix}缺少：${result.misses.join('、')}。参考答案：${result.accepted.join(' / ')}`;
    } else {
      feedback.className = 'item-feedback bad';
      feedback.textContent = `${result.message || ''} 参考答案：${result.accepted.join(' / ')}`;
    }
    detail.classList.remove('hidden');
    highlightEvidence(question.evidence, question.anchor);
    saveProgress();
    updateProgress();

    // 答对就顺着往下走：自动跳到下一道待做题，并把它的依据句点亮
    if (result.level === 'correct') {
      const next = index.questions.find(item => !(
        results[item.no] && results[item.no].level === 'correct'
      ));
      if (next && String(next.no) !== String(no)) {
        setActiveItem(next.no, 'question');
        bringIntoView(els.questionPanel.querySelector(`[data-question-item="${next.no}"]`));
      }
    }
  }

  /*
   * 只滚右栏自己的滚动区，不动整页，也不动左栏原文。
   * 若目标卡片已在可视区内则不滚，避免每次点击都轻微抖动。
   */
  function bringIntoView(node) {
    const scroller = els.workScroll;
    if (!node || !scroller) return;
    const PAD = 16;
    const scrollerRect = scroller.getBoundingClientRect();
    const rect = node.getBoundingClientRect();
    const visible = rect.top >= scrollerRect.top + PAD
      && rect.bottom <= scrollerRect.bottom - PAD;
    if (visible) return;
    const top = scroller.scrollTop + rect.top - scrollerRect.top - PAD;
    scroller.scrollTo({ top: Math.max(top, 0), behavior: 'smooth' });
  }

  /* ---------------- 高亮联动 ---------------- */

  function setActiveItem(no, kind) {
    activeItemNo = String(no);
    const item = kind === 'blank' ? index.refsByBlank[activeItemNo] : index.refsByQuestion[activeItemNo];
    els.root.querySelectorAll('[data-blank-item],[data-question-item]').forEach(node => {
      node.classList.remove('is-active');
    });
    els.summaryBox.querySelectorAll('.summary-pip').forEach(pip => {
      pip.classList.toggle('is-active', kind === 'blank' && pip.dataset.pip === activeItemNo);
    });
    const target = kind === 'blank'
      ? els.root.querySelector(`[data-blank-item="${activeItemNo}"]`)
      : els.root.querySelector(`[data-question-item="${activeItemNo}"]`);
    if (target) target.classList.add('is-active');
    if (item) highlightEvidence(item.evidence, item.anchor);
  }

  // 高亮依据句并滚动到视野；anchor 存在时对句内锚词二次加强
  function highlightEvidence(evidence, anchor) {
    clearHighlights();
    const ids = evidence || [];
    if (!ids.length) return;
    ids.forEach(id => {
      const node = els.passageText.querySelector(`.sentence[data-sentence-id="${id}"]`);
      if (!node) return;
      node.classList.add('is-highlight');
      if (anchor) {
        const textNode = node.querySelector('.sentence-text');
        markAnchor(textNode, anchor);
      }
    });
    const first = els.passageText.querySelector('.sentence.is-highlight');
    if (first) scrollToSentence(first);
  }

  /*
   * 只滚左栏原文自己的滚动区，不动整页。
   * 这样右栏题目位置纹丝不动，学生眼睛不用来回找「刚才那道题现在在哪」。
   * 若已在可视区内（左右差值小于容差）则不滚，避免每次点击都轻微抖动。
   */
  function scrollToSentence(node) {
    const scroller = els.passageScroll;
    if (!scroller) return;
    const scrollerRect = scroller.getBoundingClientRect();
    const nodeRect = node.getBoundingClientRect();
    const PAD = 16;
    // 目标：把句子放在滚动区可视范围的靠上位置，留出上下文
    const offset = nodeRect.top - scrollerRect.top - PAD;
    const visible = nodeRect.top >= scrollerRect.top + PAD
      && nodeRect.bottom <= scrollerRect.bottom - PAD;
    if (visible) return;
    scroller.scrollTo({
      top: Math.max(scroller.scrollTop + offset, 0),
      behavior: 'smooth'
    });
  }

  function markAnchor(textNode, anchor) {
    if (!textNode || !anchor) return;
    const text = textNode.textContent;
    const index = text.indexOf(anchor);
    if (index < 0) return;
    textNode.innerHTML = '';
    textNode.appendChild(document.createTextNode(text.slice(0, index)));
    const mark = document.createElement('mark');
    mark.className = 'anchor-mark';
    mark.textContent = anchor;
    textNode.appendChild(mark);
    textNode.appendChild(document.createTextNode(text.slice(index + anchor.length)));
  }

  function clearHighlights() {
    els.passageText.querySelectorAll('.sentence.is-highlight').forEach(node => {
      node.classList.remove('is-highlight');
      const textNode = node.querySelector('.sentence-text');
      if (textNode && textNode.querySelector('mark')) textNode.textContent = textNode.textContent;
    });
  }

  // 反查：点原文句子 → 列出它支撑了哪几道题
  function showSentenceRefs(sentenceId) {
    const refs = index.refsBySentence[sentenceId] || [];
    const node = els.passageText.querySelector(`.sentence[data-sentence-id="${sentenceId}"]`);
    if (node) node.classList.toggle('is-probed');

    const existing = els.root.querySelector('.ref-popover');
    if (existing) existing.remove();

    if (!refs.length) return;
    const popover = document.createElement('div');
    popover.className = 'ref-popover';
    popover.innerHTML = `
      <strong>这句原文支撑：</strong>
      ${refs.map(item => `<button type="button" class="ref-jump" data-jump-no="${item.no}" data-jump-stage="${item.kind === 'blank' ? 'blank' : 'question'}">第 ${item.no} ${item.kind === 'blank' ? '空' : '题'}</button>`).join('')}
    `;
    els.root.appendChild(popover);

    popover.querySelectorAll('.ref-jump').forEach(button => {
      button.addEventListener('click', () => {
        const no = button.dataset.jumpNo;
        switchStage(button.dataset.jumpStage);
        setActiveItem(no, button.dataset.jumpStage === 'blank' ? 'blank' : 'question');
        popover.remove();
        // 程序化跳转：先把卡片带进右栏可视区，再聚焦输入框
        const card = els.root.querySelector(
          button.dataset.jumpStage === 'blank'
            ? `[data-blank-item="${no}"]`
            : `[data-question-item="${no}"]`
        );
        bringIntoView(card);
        const field = button.dataset.jumpStage === 'blank'
          ? els.blankPanel.querySelector(`[data-blank-input="${no}"]`)
          : els.questionPanel.querySelector(`[data-question-input="${no}"]`);
        if (field) field.focus();
      });
    });

    /*
     * 关闭监听必须等当前这次 click 派发结束后再挂，
     * 否则监听会在同一次事件冒泡中被立即触发，把刚生成的浮层自己删掉。
     */
    setTimeout(() => {
      document.addEventListener('click', function dismiss(event) {
        if (popover.contains(event.target)) return;
        popover.remove();
        document.removeEventListener('click', dismiss);
      });
    }, 0);
  }

  /* ---------------- 阶段切换与进度 ---------------- */

  function bindStageTabs() {
    els.stageTabs.forEach(tab => {
      tab.addEventListener('click', () => switchStage(tab.dataset.stage));
    });
  }

  function switchStage(next) {
    stage = next === 'question' ? 'question' : 'blank';
    els.stageTabs.forEach(tab => {
      const active = tab.dataset.stage === stage;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', String(active));
    });
    /*
     * 缩写文只在第一节有用：做问答题时它是干扰项，
     * 会把「先看问题、再回原文找句子」的视线来回拽，所以整块收起而不是淡化。
     */
    els.summaryBox.classList.toggle('hidden', stage !== 'blank');
    els.blankPanel.classList.toggle('hidden', stage !== 'blank');
    els.questionPanel.classList.toggle('hidden', stage !== 'question');
    updateProgress();

    // 进入问答题时，直接把当前题的依据句点亮，省去学生自己找
    if (stage === 'question') focusCurrentQuestion();
  }

  // 定位到「当前该做的那道问答题」：优先第一道未答对的
  function focusCurrentQuestion() {
    const target = index.questions.find(question => !(
      results[question.no] && results[question.no].level === 'correct'
    )) || index.questions[0];
    if (!target) return;
    setActiveItem(target.no, 'question');
  }

  function updateProgress() {
    const blankDone = index.blanks.filter(blank => results[blank.no] && results[blank.no].level === 'correct').length;
    const questionDone = index.questions.filter(question => results[question.no] && results[question.no].level === 'correct').length;
    els.progressText.textContent = `第一节 ${blankDone}/${index.blanks.length} 空　·　第二节 ${questionDone}/${index.questions.length} 题`;

    const blankTab = els.root.querySelector('.stage-tab[data-stage="blank"]');
    const questionTab = els.root.querySelector('.stage-tab[data-stage="question"]');
    if (blankTab) blankTab.querySelector('.tab-count').textContent = `${blankDone}/${index.blanks.length}`;
    if (questionTab) questionTab.querySelector('.tab-count').textContent = `${questionDone}/${index.questions.length}`;

    renderResult(blankDone, questionDone);
    renderOverall();
  }

  /* ---------------- 全站总进度 ---------------- */

  /*
   * 汇总全部篇目的完成情况，显示在工具栏。
   * 「做对」才计入完成；判为 partial / wrong 的算已作答但未通关，
   * 这样学生能看到自己哪里还欠着。
   */
  function collectOverall() {
    const all = loadAllProgress();
    let doneItems = 0;
    let totalItems = 0;
    let donePassages = 0;

    library.forEach(p => {
      const saved = all[String(p.id)] || {};
      const res = saved.results || {};
      const nb = (p.blanks || []).length;
      const nq = (p.questions || []).length;
      totalItems += nb + nq;
      let pDone = 0;
      (p.blanks || []).concat(p.questions || []).forEach(item => {
        const r = res[String(item.no)];
        if (r && r.level === 'correct') { doneItems += 1; pDone += 1; }
      });
      if (pDone === nb + nq && nb + nq > 0) donePassages += 1;
    });

    return { doneItems, totalItems, donePassages, totalPassages: library.length };
  }

  function renderOverall() {
    const box = document.getElementById('passageOverall');
    if (!box) return;
    const o = collectOverall();
    box.textContent = `已完成 ${o.donePassages}/${o.totalPassages} 篇　·　题目 ${o.doneItems}/${o.totalItems} 题`;
  }

  // 供 app.js 同步云端进度用
  window.ReadingWritingProgress = {
    read: loadAllProgress,
    write(next) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next || {}));
      } catch { /* 存储不可用时静默降级 */ }
    },
    overall: collectOverall
  };

  function renderResult(blankDone, questionDone) {
    const total = index.blanks.length + index.questions.length;
    const done = blankDone + questionDone;
    if (!done) {
      els.resultBox.className = 'stage-result';
      els.resultBox.textContent = `先按顺序完成第一节的 ${index.blanks.length} 个空，再做第二节的 ${index.questions.length} 道问答。`;
      return;
    }
    const wrong = [];
    index.allItems.forEach(item => {
      const result = results[item.no];
      if (result && (result.level === 'wrong' || result.level === 'partial')) wrong.push({ item, result });
    });
    els.resultBox.className = `stage-result${done === total ? ' finished' : ''}`;
    els.resultBox.innerHTML = `
      <div class="result-line">
        <strong>${done}/${total}</strong>
        <span>第一节 ${blankDone}/${index.blanks.length} 空</span>
        <span>第二节 ${questionDone}/${index.questions.length} 题</span>
      </div>
      ${wrong.length ? `
        <p class="result-remind">还有 ${wrong.length} 处需要回原文再看一遍：${wrong.map(entry => `第 ${entry.item.no} ${entry.item.kind === 'blank' ? '空' : '题'}`).join('、')}</p>
      ` : done === total ? '<p class="result-remind ok">本篇全部答对，可以进入下一篇了。</p>' : ''}
    `;
  }

  /* ---------------- 进度存储 ---------------- */

  /*
   * 进度按篇隔离：一次存全部篇，键为篇 id。
   * 之前是单一 answers/results，切篇就丢，12 篇会互相覆盖。
   */
  function loadAllProgress() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
    } catch {
      return {};
    }
  }

  function loadProgress() {
    const all = loadAllProgress();
    const key = library[currentPassageIndex] ? String(library[currentPassageIndex].id || currentPassageIndex) : '0';
    const saved = all[key] || {};
    answers = saved.answers || {};
    results = saved.results || {};
  }

  function saveProgress() {
    const key = library[currentPassageIndex] ? String(library[currentPassageIndex].id || currentPassageIndex) : '0';
    const all = loadAllProgress();
    all[key] = { answers, results };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    } catch {
      /* 本地存储不可用时静默降级，不影响做题 */
    }
    // 通知外部（app.js）把篇章进度同步到云端
    window.dispatchEvent(new CustomEvent('passage-progress-saved'));
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }
})();
</script>
<script>
/*
 * 打印本篇：输出整篇 A4 练习稿。
 * 正式系统的这份逻辑在 app.js 里（与登录、进度同处一个模块），
 * 单文件版没有 app.js，所以单独抽一份给打包脚本使用。
 * 两处逻辑保持一致，改动时需同步。
 */
(function () {
  var btn = document.getElementById('print-passage');
  if (!btn || btn.dataset.bound) return;
  btn.dataset.bound = '1';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  btn.addEventListener('click', function () {
    var data = window.PASSAGES_DATA || [];
    var cur = document.querySelector('.picker-item.active');
    var p = data[cur ? Number(cur.dataset.passageIndex) : 0];
    if (!p) return;

    var paras = (p.paragraphs || []).map(function (par) {
      return '<p>' + esc((par.sentences || []).map(function (s) { return s.text; }).join(' ')) + '</p>';
    }).join('');

    // 摘要文里的 {{n}} 换成实线空格，学生直接在横线上写
    var summary = esc(p.summary || '').replace(/\{\{(\d+)\}\}/g, '<span class="print-blank"></span>');

    var qs = (p.questions || []).map(function (q) {
      return '<li>' + esc(q.question) + '</li>';
    }).join('');

    var pop = window.open('', '_blank', 'width=900,height=760');
    if (!pop) { alert('请允许弹出窗口后重试。'); return; }

    pop.document.open();
    pop.document.write(
      '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>' + esc(p.source) + '</title><style>' +
      '@page{size:A4;margin:16mm 15mm}*{box-sizing:border-box}' +
      'body{margin:0;color:#111;background:#fff;font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;line-height:1.7}' +
      '.paper{max-width:760px;margin:0 auto}' +
      '.head{text-align:center;border-bottom:2px solid #111;padding-bottom:9px;margin-bottom:12px}' +
      '.head h1{margin:0 0 4px;font-size:21px}.source{margin:0;color:#444;font-size:12px}' +
      '.student{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}' +
      'h2{margin:14px 0 6px;font-size:15px;border-left:4px solid #333;padding-left:8px}' +
      '.instruction{margin:0 0 8px;font-size:12.5px;color:#333}' +
      '.passage p{margin:0 0 7px;text-align:justify}' +
      '.summary{border:1px solid #666;padding:10px 12px;margin-top:6px;border-radius:4px}' +
      '.print-blank{display:inline-block;min-width:104px;border-bottom:1px solid #111;height:1.05em}' +
      'ol{margin:6px 0 0;padding-left:22px}li{margin-bottom:16px}' +
      '.answer{margin-top:14px;border-top:1px dashed #999;padding-top:8px;font-size:12px;color:#444}' +
      '@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}' +
      '</style></head><body><main class="paper">' +
      '<header class="head"><h1>读写题训练</h1><p class="source">' + esc(p.source) + '</p>' +
      '<div class="student"><span>姓名：____________</span><span>用时：____________</span><span>得分：____________</span></div>' +
      '</header>' +
      '<h2>第一节 缩写填空</h2>' +
      '<p class="instruction">阅读短文，根据语篇内容，在方框内的空白处，填入与短文意思最符合的单词。每空一词。</p>' +
      '<div class="passage">' + paras + '</div><div class="summary">' + summary + '</div>' +
      '<h2>第二节 语篇问答</h2>' +
      '<p class="instruction">阅读短文，根据语篇内容，回答问题。</p><ol>' + qs + '</ol>' +
      '<div class="answer"><b>参考答案</b>　填空：' +
      esc((p.blanks || []).map(function (b) { return b.no + '．' + b.answer; }).join('　')) + '<br>' +
      '问答：' + esc((p.questions || []).map(function (q) { return q.no + '．' + q.answer; }).join('　')) +
      '</div></main>' +
      '<script>window.addEventListener("load",function(){window.print();});<\/script></body></html>'
    );
    pop.document.close();
  });
})();
</script>
</body>
</html>
