        { stem: "— Where is Mr. Green? I can't find him.<br>— Oh, he ______ Beijing. He will be back next week.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（——格林先生在哪里？我找不到他。——噢，他去了北京。他下周才回来。）</span>", options: ["has been to", "has gone to", "has went to"], answer: "has gone to", explain: "第一步：读懂情境。上句说“I can't find him”（我找不到他），下句说“He will be back next week”（他下周才回来）。 第二步：说明格林先生人现在不在这儿，还没回来！ 第三步：没有回来 ＝ 去了还没回 ＝ has gone to。如果选 has been to，说明他去过但现在已经在这儿了，就和“找不到他”冲突了。" },
        { stem: "Tom ______ the library book for two weeks. He must return it tomorrow.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（Tom 借这本图书馆的书已经两周了。他明天必须归还。）</span>", options: ["has borrowed", "borrowed", "has kept"], answer: "has kept", explain: "第一步：扫描句子，看到时间信号词 for two weeks（持续了两周段落）。 第二步：本句强调借阅后的持有状态持续两周，需用能表达该状态的 keep；瞬间动词在否定或重复事件结构中也可与 for/since 连用。 本题表示借书后的持有状态已经持续两周，用 has kept。borrowed for two weeks 也可表示当时借用期限为两周，但与本题要求表达的持续至今不同。 第四步：现在完成时结构：has + 过去分词 keep 的过去分词是 kept。所以选择 has kept。" },
        { stem: "1. She ______ already ______ (finish) her homework.", options: ["has; finished", "have; finished", "has; finish"], answer: "has; finished", explain: "already 是完成时信号；She 是三单，所以用 has finished。" },
        { stem: "2. I haven't seen this film ______.", options: ["already", "yet", "ever"], answer: "yet", explain: "否定句中表示“还没有”，用 yet，通常放在句末。" },
