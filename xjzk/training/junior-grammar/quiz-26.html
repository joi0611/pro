        { stem: "Look! The ______ tail is very long.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（看！那条狗的尾巴很长。）</span>", options: ["dogs", "dog's", "dogs'", "dog"], answer: "dog's", explain: "第一步：中文是\"狗的尾巴\"，有\"的\" → 必须是所有格 → 必须带撇号 → A、D 淘汰。 第二步：中文说的是\"那一条狗\" → 主人是一个 → 撇号在 s 前。 &nbsp;&nbsp;C（dogs'）是\"一群狗的\"，不符合题意。" },
        { stem: "______ Day is on September 10th in China.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（在中国，教师节是9月10日。）</span>", options: ["Teacher's", "Teachers'", "Teachers", "Teacher"], answer: "Teachers'", explain: "教师节是所有老师的节日 → 用复数 teachers；teachers 以 s 结尾 → 规则二，撇号挂在 s 后面。 &nbsp;&nbsp;节日名称属于固定写法，要按规范名称记忆：Teachers' Day / Mother's Day / Children's Day。" },
        { stem: "This is ______ bedroom. It's big and bright.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（这是Lily和Lucy〔共用〕的卧室，又大又亮。）</span>", options: ["Lily and Lucy's", "Lily's and Lucy's", "Lily and Lucy", "Lily's and Lucy"], answer: "Lily and Lucy's", explain: "题目说\"共用一间\"（bedroom 也是单数）→ 名牌只挂一块，挂在最后一个人身上。 &nbsp;&nbsp;选 B 的话是\"各有各的卧室\"，后面得写 bedrooms（复数），和句子对不上。" },
        { stem: "It's only five ______ walk from my ______ home to the park.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（从我叔叔家到公园只有五分钟的路。）</span>", options: ["minutes; uncle", "minute's; uncle's", "minutes'; uncle's", "minutes'; uncles"], answer: "minutes'; uncle's", explain: "空一：five minutes 是\"五分钟\"，时长破例用所有格；minutes 以 s 结尾 → 撇号在后 → minutes' 空二：\"我叔叔的家\" → 叔叔是人，挂 's → uncle's" },
        { stem: "The ______ toys are in the classroom.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（孩子们的玩具在教室里。）</span>", options: ["childrens", "childrens'", "children's", "children"], answer: "children's", explain: "children 已经是复数，但词尾没有 s，所以仍加 's。" },
        { stem: "I bought a new ______ yesterday.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我昨天买了一个新书包。）</span>", options: ["school's bag", "bag of school", "school bag", "school's bags"], answer: "school bag", explain: "这里表示用途类别“书包”，用名词 + 名词：school bag。" },
