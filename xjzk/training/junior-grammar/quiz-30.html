window.QUIZ = {
  lesson: '30',
  title: "应用3课：短文语法综合——在语篇里灵活用语法",
  sections: [
    {
      name: "本讲练习题 · 在线作答（每题4分）",
      perQ: 4,
      type: "choice",
      items: [
        { stem: "He is young, ______ he knows a lot. (选连词)<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（他虽然年轻，但懂得很多。）</span>", options: ["so", "but", "because", "and"], answer: "but", explain: "\"年轻\"和\"懂得多\"是转折关系 → 用 but（第20讲）。" },
        { stem: "This is the book ______ I bought yesterday. (选词)<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（这是我昨天买的书。）</span>", options: ["who", "which", "what", "where"], answer: "which", explain: "先行词 the book 指物，选项中用 which。that 在这个句子里通常也可以，但本题没有提供；what 不能在前面已有先行词时这样引导定语从句。" },
        { stem: "It took me half ______ hour to finish the work.", options: ["a", "an", "the", "/"], answer: "an", explain: "hour 的首字母 h 不发音，开头是元音音素，所以用 an：half an hour。" },
        { stem: "Lucy bought two notebooks. She gave one to her sister and kept ______ for herself.", options: ["another", "other", "the other", "others"], answer: "the other", explain: "总数明确是两个：one...the other... 表示“一个……另一个……”。" },
        { stem: "______ the task was difficult, the students finished it on time.", options: ["Because", "Although", "So", "And"], answer: "Although", explain: "“任务困难”与“按时完成”形成让步关系，用 Although。句中不能再加 but。" }
      ]
    },
    {
      name: "本讲填空练 · 在线作答（每题4分）",
      perQ: 4,
      type: "fill",
      items: [
        { stem: "The little girl sang ______ at the party. (beautiful)<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（小女孩在聚会上唱得很美。）</span>", answer: "beautifully", explain: "sang（唱）是动作，修饰它用副词 → beautiful+ly → beautifully（衔接4+应用1）。" },
        { stem: "用适当形式填空：<br>My sister ①______ (be) a doctor now. She ②______ (work) in this hospital since 2020.", answer: "is / has worked", explain: "① now + My sister（单数）→ 一般现在时单数 → is ② since 2020 表示动作从过去持续到现在，基础答案可填 has worked；强调持续过程时 has been working 也符合语法。" },
        { stem: "用适当形式填空：<br>Yesterday was Sunday. I ①______ (get) up late. After I ②______ (have) breakfast, I went to the park, ③______ (选连词: and/but) it started to rain. ④______ (luck), I had an umbrella. It was one of the ⑤______ (nice) days in my holiday.", answer: "got / had / but / Luckily / nicest —— 时态、连词、构词、最高级全考到！", explain: "① Yesterday → 过去时 → got（第9讲） ② After 已经清楚说明先后，最自然的是一般过去时 had（have 的过去式）。若使用过去完成时，完整形式应是 had had，但本句没有必要。 ③ \"去公园\"和\"下雨\"是转折 → but（第20讲） ④ 句首修饰全句 → 副词，luck→luckily → Luckily（应用1） ⑤ one of the ___ days：one of the + 最高级 + 复数 → nice变最高级 → nicest（第15讲）" },
        { stem: "Our teacher encouraged us ______ (take) part in the speech competition.", answer: "to take", explain: "句中已有谓语 encouraged，空格不是新的谓语。固定结构 encourage sb to do，因此填 to take。" },
        { stem: "The new bridge ______ (build) last year and has made travel much easier.", answer: "was built", explain: "bridge 是 build 的承受者，用被动；last year 确定一般过去时，因此用 was built。" },
        { stem: "Please read the instructions ______ before using the machine. (careful)", answer: "carefully", explain: "空格修饰动作 read，需要副词；careful 变 carefully，注意直接加 -ly。" },
        { stem: "用适当形式填空：<br>When Amy first joined the school club, she was nervous. Her teacher encouraged her ①______ (speak) in front of others. After several weeks, she became much ②______ (confident). Now she speaks ③______ (clear) and often helps new members. She believes practice ④______ (make) people better.", answer: "to speak / more confident / clearly / makes", explain: "① encourage sb to do → to speak ② much 修饰比较级，表示比以前更自信 → more confident ③ 修饰 speaks 用副词 → clearly ④ 表示一般规律，主语 practice 是不可数名词，谓语用三单 → makes" }
      ]
    }
  ]
};
