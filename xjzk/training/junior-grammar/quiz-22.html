window.QUIZ = {
  lesson: '22',
  title: "定语从句",
  sections: [
    {
      name: "本讲练习题 · 在线作答（每题4分）",
      perQ: 4,
      type: "choice",
      items: [
        { stem: "The yellow car is the most beautiful thing ______ I have ever seen.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（那辆黄色的跑车是我见过的最美丽的东西。）</span>", options: ["where", "that", "who"], answer: "that", explain: "第一步：找被修饰的名词。先行词是 thing（东西，是物）。理论上 which 和 that 好像都能用。 第二步：盯着名词前面看！发现有 the most beautiful（最高级修饰）！ 第三步：从句缺 seen 的宾语，that 可以代替先行词 thing 作宾语，选 B；where 不能补足该宾语，who 不指本句的物。which 也可用于这类限制性定语从句，但本题未提供。" },
        { stem: "I like the girl ______ eyes are very beautiful.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（我喜欢那个眼睛很漂亮的女孩。）</span>", options: ["who", "whose", "that"], answer: "whose", explain: "第一步：读懂逻辑。“我喜欢女孩” + “（女孩的）眼睛很漂亮”。 第二步：空格处翻译成“……的”。即“她的”眼睛。表示所属关系。 第三步：唯一的“……的”专属挂钩是 whose（whose + 名词 ➡️ whose eyes ＝ 她的眼睛）。如果选 who，带入翻译成了“我喜欢那个谁眼睛很漂亮的女孩”，语法完全残缺。" },
        { stem: "The doctor ______ saved the old man is very patient.", options: ["which", "who", "whose"], answer: "who", explain: "先行词是 The doctor，表示人；空格后面直接是动词 saved，说明空格在从句里作主语，所以选 who。" },
        { stem: "The movie ______ we watched last night was exciting.", options: ["who", "whose", "that"], answer: "that", explain: "先行词是 The movie，表示物；从句 we watched 里 watched 后面缺宾语，所以可以用 that / which，本题选项里只有 that。" },
        { stem: "This is the museum ______ we visited during the trip.", options: ["where", "that", "when"], answer: "that", explain: "虽然 museum 是地点，但从句里 visited 后面缺宾语，空格要代替 museum 作宾语，所以用 that / which，不能用 where。" },
        { stem: "Do you know the boy ______ bike was stolen?", options: ["who", "whose", "which"], answer: "whose", explain: "空格后面是名词 bike，意思是“那个男孩的自行车”。表示所属关系时用 whose + 名词。" },
        { stem: "This is the first English song ______ I learned.", options: ["that", "when", "who"], answer: "that", explain: "从句缺 learned 的宾语，that 代替 song 作宾语，选 A；when 不能补足该宾语，who 不指歌曲。which 也可能成立，但本题未提供。" }
      ]
