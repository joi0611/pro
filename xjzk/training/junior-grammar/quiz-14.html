        { stem: "My grandfather ______ in the garden when it suddenly started to rain.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（当天突然开始下雨时，我的祖父正在花园里干活。）</span>", options: ["works", "working", "was working"], answer: "was working", explain: "第一步：读懂句子。下雨（started）是个瞬间动作，这个动作插队/打断了爷爷在花园里做的事。 第二步：下雨的那一秒，爷爷手头的动作（干活）是在“大长河”的进行中。 第三步：干活是持续时间长的事情，所以用过去进行时。主语是 `My grandfather`（单数）➡️ 选 was working。" },
        { stem: "I was taking a shower ______ the phone rang.（电话响时，我正在洗澡。）", options: ["when", "during", "before"], answer: "when", explain: "空格后是完整从句 the phone rang，本题表达铃响时正在洗澡，连接词用 when。during 后不能直接接这样的完整从句。" },
        { stem: "______ my mother was cooking, I was doing my homework.（强调两个动作同时进行）", options: ["During", "While", "After"], answer: "While", explain: "题意强调做饭与做作业同时进行，用 While。When 在此类语境也可成立，During 后不能直接接完整从句；After 表示之后，与题意不符。" },
        { stem: "They ______ football at that time yesterday.", options: ["was playing", "were playing", "play"], answer: "were playing", explain: "They 是复数主语，用 were；at that time yesterday 表示过去某一刻，动作用 playing。" },
