  title: "衔接5课：主谓一致——主语和动词必须配套",

      name: "本讲练习题 · 在线作答（每题4分）",

        { stem: "Everyone in our class ______ to help the old man.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我们班每个人都想帮那位老人。）</span>", options: ["want", "wants", "wanting", "are wanting"], answer: "wants", explain: "Everyone 是不定代词 → 铁律当单数 → 动词加 s → wants。别被\"每个人（感觉很多）\"骗了。" },
        { stem: "Neither you nor he ______ right. It's my fault.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（你和他都不对。错误在我。）</span>", options: ["am", "is", "are", "be"], answer: "is", explain: "neither…nor 用就近原则，动词跟离它最近的 he（单数）→ is。 &nbsp;&nbsp;如果句子是 Neither he nor you，那就跟 you，要用 are。" },
        { stem: "There ______ a pen and three books on the desk.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（桌上有一支笔和三本书。）</span>", options: ["is", "are", "have", "has"], answer: "is", explain: "There be 跟后面第一个名词。第一个是 a pen（单数）→ is。 &nbsp;&nbsp;如果顺序反过来 three books and a pen，就要用 are。" },
        { stem: "The news about the sports meeting ______ exciting.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（关于运动会的消息很令人激动。）</span>", options: ["is", "are", "were", "have"], answer: "is", explain: "news 结尾虽有 s，但它是不可数名词，当单数 → is。about the sports meeting 是修饰，盖住不看。" },
        { stem: "About two thirds of the water in the bottle ______ gone. Half of the students ______ girls.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（瓶里约三分之二的水没了。一半学生是女生。）</span>", options: ["is; are", "are; is", "is; is", "are; are"], answer: "is; are", explain: "分数 + of 看 of 后面的名词。 空一：of the water（不可数，当单数）→ is。 空二：of the students（复数）→ are。" },
        { stem: "A number of students ______ in the playground, and the number of them ______ about fifty.", options: ["is; is", "are; is", "is; are", "are; are"], answer: "are; is", explain: "a number of = many → 复数 are；the number of 的中心词是 number → 单数 is。" },
        { stem: "Both of the answers ______ correct, but neither of them ______ easy to explain.", options: ["is; is", "are; are", "are; is", "is; are"], answer: "are; is", explain: "both 固定按复数 → are；规范书面语中 neither of 通常按单数 → is。" },
        { stem: "Some of the milk ______ bad, but some of the apples ______ still fresh.", options: ["is; are", "are; is", "is; is", "are; are"], answer: "is; are", explain: "some of 的谓语看 of 后面的名词：milk 不可数 → is；apples 复数 → are。" },
        { stem: "This pair of glasses ______ mine, but those glasses ______ yours.", options: ["is; are", "are; is", "is; is", "are; are"], answer: "is; are", explain: "第一空中心词是 pair（单数）→ is；第二空主语 glasses 本身按复数 → are。" },
        { stem: "Reading books every day ______ good for your English.", options: ["are", "were", "is", "have"], answer: "is", explain: "Reading books every day 整体表示一件事，作主语时通常按单数。" },
        { stem: "The teacher, as well as her students, ______ going to visit the museum.", options: ["are", "is", "have", "were"], answer: "is", explain: "as well as her students 是附加信息，真主语是 The teacher（单数）→ is。" },
        { stem: "Both Tom and his brother ______ football, but neither Tom nor his sister ______ basketball.", options: ["like; like", "likes; likes", "like; likes", "likes; like"], answer: "like; likes", explain: "both…and 连接两个主语 → 复数，第一空用 like；neither…nor 就近，离动词最近的是 his sister（第三人称单数）→ likes。" }
      ]
