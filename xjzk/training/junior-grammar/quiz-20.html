        { stem: "______ he got up very late this morning, ______ he still caught the school bus.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（虽然他今天早上起床很晚，但他依然赶上了学校班车。）</span>", options: ["Although; but", "Because; so", "Although; /", "/; /"], answer: "Although; /", explain: "第一步：读懂意思。“起床晚”和“赶上车”逻辑是相反的，说明要用“虽然……但是……”。 第二步：A 用 although 和 but 重复连接同一组让步与主句，排除 A。规则针对这组分句，不能推广为两词在任何长句中都不能出现。 第三步：看选项 C（Although; /）表示：前面用 Although，后面留空不填（相当于用逗号连接）。这是最标准的语法格式。" },
        { stem: "Not only you but also Tom ______ interested in this comic book.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（不仅是你，Tom 也对这本漫画书感兴趣。）</span>", options: ["is", "are", "am"], answer: "is", explain: "第一步：抓句型。原句是 not only... but also...。 第二步：触发“就近沙发原则”：be 动词单复数只听最近的主语。最近的主语是 Tom（单数）。 第三步：Tom 对应的 be 动词是 is（无视左边的 you）。" },
        { stem: "______ it was raining hard, we stayed at home.", options: ["Because", "So", "Because; so"], answer: "Because", explain: "空格在原因句前面，直接用 Because。如果用 Because...so...，就出现重复连接。" },
        { stem: "Follow the doctor's advice, ______ you will get better soon.", options: ["and", "or", "but"], answer: "and", explain: "前面是祈使句，后面是好结果“很快好起来”，所以用 and 表示“这样就会……”。" },
        { stem: "You won't improve your English ______ you practice every day.", options: ["if", "unless", "because"], answer: "unless", explain: "unless = 如果不 / 除非。句意是“除非你每天练习，否则英语不会提高”。" },
        { stem: "He spoke loudly ______ everyone could hear him clearly.", options: ["so that", "because", "although"], answer: "so that", explain: "后面有 could，表示目的：“为了让每个人都能听清楚”，用 so that。" },
        { stem: "Not only my parents but also my sister ______ interested in the movie.", options: ["are", "is", "am"], answer: "is", explain: "not only...but also... 用就近原则。离空格最近的是 my sister，单数，所以用 is。" }
