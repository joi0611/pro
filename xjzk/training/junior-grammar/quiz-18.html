        { stem: "— Did you turn off the light when you left the room?<br>— Oh, I think I did. But I don't remember ______ it.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（——你离开房间时关灯了吗？——噢，我觉得我关了。但我不记得我关过了。）</span>", options: ["to turn off", "turning off", "turn off"], answer: "turning off", explain: "第一步：看线索。答句说“I think I did.”（我觉得我做过这件事了）。 第二步：也就是说，关灯这个动作已经发生了，只是我不记得“关过”这件事。 第三步：记得做过某事 ➡️ remember doing sth（既成事实派用 doing）。如果用 remember to do 意思是“记得去关灯”，说明还没关，与前句冲突。" },
        { stem: "My grandparents are looking forward to ______ us this weekend.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（我的爷爷奶奶正期盼着这个周末能见到我们。）</span>", options: ["see", "seeing", "to see"], answer: "seeing", explain: "第一步：盯紧 look forward to（期盼）这个短语。 第二步：排雷！这个短语尾巴上的 to，不是不定式，而是一个名副其实的介词！ 第三步：既然是介词，后面跟着的动词必须毫无保留地变成 doing 形式！ 第四步：所以直接填 seeing。很多选 A 或者是 C 的同学，就是没看出这个 to 的伪装。" },
        { stem: "She is interested in ______ Chinese traditional music.", options: ["learn", "learning", "to learn"], answer: "learning", explain: "in 是介词，介词后面如果接动作，动词要变成 doing。所以是 learning。" },
        { stem: "Remember ______ your homework to school tomorrow.", options: ["bring", "bringing", "to bring"], answer: "to bring", explain: "tomorrow 说明动作还没发生，是“记得去带”。所以用 remember to do。" },
