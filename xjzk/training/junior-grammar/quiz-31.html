      items: [
        { stem: "I ______ tell you the news, but I found that you had already heard it.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我本打算告诉你这消息，但我发现你已经听说了。）</span>", options: ["am going to", "was going to", "will", "go to"], answer: "was going to", explain: "was going to 表示当时的打算；后半句 but I found... 说明这个打算没有继续实施。" },
        { stem: "按标准间接引语时态后移要求改写：<br>My mother told me that she will buy me a gift.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我妈妈告诉我她会给我买份礼物。）</span>", options: ["told → tell", "will → would", "buy → bought"], answer: "will → would", explain: "本题按标准间接引语和时态后移处理：told 提供过去观察点，从句表示当时的未来，因此 will 改为 would。" },
        { stem: "He said, \"I will finish it tomorrow.\" 按本题标准时态后移及时间状语转换要求，改为间接引语：<br>He said he would finish it ______.", options: ["tomorrow", "the next day", "yesterday", "today"], answer: "the next day", explain: "本题的转述时间已经改变，因此 tomorrow 要根据新的叙述视角改为 the next day。" },
        { stem: "She promised that she ______ help us, and yesterday she really ______.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（她承诺会帮我们，昨天她真的帮了。）</span>", options: ["would; did", "will; does", "would; do", "will; did"], answer: "would; did", explain: "空一：promised 过去 → 从句用 would（承诺时还没帮）。空二：yesterday really → 真实发生的过去动作 → did。 &nbsp;&nbsp;这题专门考\"计划中的将来(would)\"和\"真实发生的过去(did)\"的区别。" },
        { stem: "Tom thought the movie ______ boring, so he ______ watch it.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（Tom觉得电影会很无聊，所以本不打算看。）</span>", options: ["will be; isn't going to", "would be; wasn't going to", "is; wasn't going to", "would be; isn't going to"], answer: "would be; wasn't going to", explain: "thought 提供过去观察点：电影“会很无聊”是当时的预测；“不打算看”是当时的计划。 空一：\"会很无聊\"（预计）→ would be。空二：\"本不打算看\"→ wasn't going to（过去将来的否定）。" },
        { stem: "We had bought the tickets and packed our bags. We ______ leave early the next morning.", options: ["are going to", "were going to", "will", "have gone to"], answer: "were going to", explain: "had bought、packed 建立过去背景，而且已经有明确准备和计划，使用 were going to 最自然。" },
        { stem: "At the age of ten, Lisa believed she ______ become a scientist one day.", options: ["will", "would", "is going to", "has"], answer: "would", explain: "At the age of ten 和 believed 提供过去观察点，become 发生在那个时间点之后，用 would。" },
        { stem: "He said he would send me a message when he ______ at the hotel.", options: ["would arrive", "arrives", "arrived", "will arrive"], answer: "arrived", explain: "主句是过去视角中的将来 would send；when 时间从句使用一般过去时 arrived，不重复使用 would。" },

        { stem: "“Would you please close the window?” 中的 would 表示什么？", options: ["过去将来", "礼貌请求", "过去习惯", "客观预测"], answer: "礼貌请求", explain: "句中没有过去观察点，而是在礼貌地请对方关窗，因此 would 是礼貌请求用法。" }
      ]
