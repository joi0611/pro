<script>
window.QUIZ = {
  lesson: 'bonus1',
  title: "加餐一：感叹句 · 祈使句 · 反意疑问句",
  sections: [
    {
      name: "本讲练习题 · 在线作答（每题4分）",
      perQ: 4,
      type: "choice",
      items: [
        { stem: "Let's go shopping at the weekend, ______?<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（我们周末一起去逛街，好吗？）</span>", options: ["will you", "shall we", "won't you"], answer: "shall we", explain: "第一步：看开头。开头是 Let's（Let us 缩写形式，表示包括你在内的我们大家）。 第二步：一家人不说两家话，大家都是一条船上的 ➡️ 锁定商量口气 shall we。 第三步：Let us 表示请求许可时常用 will you；表示包括听者的建议时也可用 shall we，需看真实说话意图。" },
        { stem: "Your sister speaks French very well, ______ she?<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（你姐姐法语说得非常好，不是吗？）</span>", options: ["doesn't", "speaks not", "isn't"], answer: "doesn't", explain: "第一步：看肯定否定。左边 speaks 是肯定（+） ➡️ 右边必须用否定（-）。排除 B（格式不对）。 第二步：看发动机类型。speaks 是普通动词，不是 be 动词。普通工人变身必须雇临时工（助动词）顶包！主语是 sister（三单） ➡️ 否定雇 doesn't。排除 C。" },
        { stem: "______ exciting news it is!<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（多么令人激动的消息啊！）</span>", options: ["What an", "What", "How", "How an"], answer: "What", explain: "第一刀：切掉句尾主谓 it is ➡️ 剩下 ____ exciting news。 第二步：最后一个词是 news，名词 ➡️ 用 What，排除 C 和 D。 第三步：news 是不可数名词，前面不能加 an ➡️ 排除 A。很多同学看到 exciting 是元音开头就条件反射选 an，这正是出题人设的坑。" },
        { stem: "______ carefully she writes her homework!<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（她写作业多么认真啊！）</span>", options: ["What", "What a", "How"], answer: "How", explain: "第一刀：切掉句尾主谓 she writes her homework ➡️ 剩下 ____ carefully。 第二步：carefully 是副词，形容动作“写”的方式 ➡️ 用 How。" },
        { stem: "______ late for school again, Tom!<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（Tom，上学别再迟到了！）</span>", options: ["Not be", "Don't be", "Don't", "Be not"], answer: "Don't be", explain: "第一步：句子没有司机，是对 Tom 下命令 ➡️ 祈使句。 第二步：late 是形容词，不是动词，句子缺发动机 ➡️ 需要 be。排除 C。 第三步：祈使句否定统一在最前面加 Don't ➡️ Don't be。A 和 D 都是中文直译出来的错误语序。" },
        { stem: "Put on your coat, ______ you will catch a cold.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（穿上外套，否则你会感冒的。）</span>", options: ["and", "or", "but"], answer: "or", explain: "第一步：前半句 Put on your coat 是祈使句。 第二步：看后半句的结果——感冒是坏结果，是“不穿外套”才会发生的事 ➡️ 表示“否则”，用 or。 第三步：如果后半句是 you will feel warm（好结果），才用 and。" },
        { stem: "______ great fun we had at the party!", options: ["What a", "What", "How", "How a"], answer: "What", explain: "切掉 we had at the party，剩下 ____ great fun，以名词结尾 ➡️ What；fun 不可数，不加 a。" },
        { stem: "______ hard the girl works!", options: ["What", "What a", "How"], answer: "How", explain: "切掉 the girl works，剩下 ____ hard，hard 在这里是副词，说明“工作”得怎么样 ➡️ How。" },
        { stem: "What a clever boy he is! = ______ clever the boy is!", options: ["What", "How", "So"], answer: "How", explain: "What 句换 How 句：拆掉 What a，形容词紧跟 How，名词 boy 加 the 挪去当主语。" },
        { stem: "______ careful when you cross the road.", options: ["Be", "Being", "Is", "To be"], answer: "Be", explain: "祈使句没有司机，从发动机开车，发动机用原形；careful 是形容词，需要 be ➡️ Be。" },
        { stem: "______ the little boy play with fire.", options: ["Not let", "Don't let", "No let", "Doesn't let"], answer: "Don't let", explain: "否定祈使句一律 Don't 打头 ➡️ Don't let + 宾格 + 动词原形。" },
        { stem: "Hurry up, ______ you will miss the early bus.", options: ["and", "or", "but"], answer: "or", explain: "错过早班车是坏结果，是“不快点”才会发生的事 ➡️ or（否则）。= Unless you hurry up, ..." },
        { stem: "I'm your new classmate, ______?", options: ["am not I", "aren't I", "are I", "isn't I"], answer: "aren't I", explain: "I am 的否定尾巴固定是 aren't I，要单独记。" },
        { stem: "She is unhappy about the result, ______?", options: ["is she", "isn't she", "does she", "doesn't she"], answer: "isn't she", explain: "un- 只是前缀，不在隐形否定词黑名单里 ➡️ 左边算肯定，尾巴用否定；发动机是 is ➡️ isn't she。" },
        { stem: "I don't think he will come tomorrow, ______?", options: ["do I", "will he", "won't he", "don't I"], answer: "will he", explain: "I think 类句子尾巴跟从句 he will come；I don't think 里的 not 否定的是从句 ➡️ 左边算否定，尾巴用肯定 will he。" },
        { stem: "Everyone has arrived, ______?", options: ["hasn't it", "haven't they", "hasn't he", "isn't it"], answer: "haven't they", explain: "发动机是完成时 has arrived ➡️ 尾巴用 have / has；everyone 的替身用 they，配 haven't ➡️ haven't they。" },
        { stem: "— You didn't go to the party last night, did you?<br>— ______. I was ill in bed.", options: ["Yes, I did", "No, I didn't", "Yes, I didn't", "No, I did"], answer: "No, I didn't", explain: "补充句 I was ill in bed 说明事实是“没去”（否定）➡️ No, I didn't。中文意思是“是的，我没去”。C 和 D 把 Yes / No 和后面拆开了，永远是错的。" }
      ]
    }
  ]
};
