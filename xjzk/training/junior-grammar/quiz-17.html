        { stem: "A terrible car accident ______ on the highway yesterday evening.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（昨天傍晚高速公路上发生了一场可怕的车祸。）</span>", options: ["was happened", "happened", "is happened"], answer: "happened", explain: "第一步：看动词。动词是 happen（发生）。 第二步：拉响警报！happen 这不能使用被动语态。所以选项 A（was happened）和 C（is happened）全错！ 第三步：信号词是 yesterday evening ➡️ 直接用一般过去时 happened。" },
        { stem: "The lazy boy was made ______ the classroom by the teacher.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（那个懒惰的男孩昨天被老师逼着打扫了教室。）</span>", options: ["clean", "to clean", "cleaning"], answer: "to clean", explain: "第一步：看句型。原句是 was made（被动语态，原来是 make sb do 的使役动词句型）。 第二步：运用“to 还原原则”。在主动句里 make 逼着小弟不加 to，现在到了被动句，小弟翻身获得解放，必须戴回to！ 第三步：所以要用 to clean，不是 clean 原形。" },
        { stem: "The 2022 Winter Olympic Games ______ in Beijing.", options: ["held", "were held", "are held"], answer: "were held", explain: "运动会是“被举办”，用被动语态。2022 表示过去时间，Games 是复数，所以 be 用 were，hold 的过去分词是 held。" },
        { stem: "This kind of bike ______ in our factory next month.", options: ["will make", "will be made", "is made"], answer: "will be made", explain: "bike 是被制造出来的，主语承受动作。next month 指将来，所以结构是 will be + done，make 的过去分词是 made。" },
        { stem: "The baby ______ by his grandma yesterday.", options: ["looked after", "was looked after", "was looked"], answer: "was looked after", explain: "look after 是完整动词短语，改被动时 after 不能丢。yesterday 是过去时间，baby 是单数，所以用 was looked after。" },
        { stem: "The boy was seen ______ into the room just now.", options: ["go", "to go", "went"], answer: "to go", explain: "主动句是 see sb do，改成被动后要恢复为 be seen to do。所以这里选 to go。" }
