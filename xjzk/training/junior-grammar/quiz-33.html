<script>
window.QUIZ = {
  lesson: '33',
  title: "衔接2课：不定代词——没有名字的那些人和东西",
  sections: [
    {
      name: "本讲练习题 · 在线作答（每题4分）",
      perQ: 4,
      type: "choice",
      items: [
        { stem: "I'm hungry. I'd like ______ to eat.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我饿了，想吃点热乎的东西。）</span>", options: ["hot something", "something hot", "anything hot", "hot anything"], answer: "something hot", explain: "第一步看意义：I'd like... 表示想要某种东西，通常用 something；这里不是一般疑问句规则，而是肯定的愿望表达。 第二步排语序：形容词 hot 修饰不定代词要后置 → hot something(A)错，something hot 对。" },
        { stem: "— Which of the two shirts will you take?<br>— I'll take ______. They are both too expensive.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（两件衬衫你要哪件？都不要，太贵了。）</span>", options: ["both", "all", "neither", "either"], answer: "neither", explain: "题目明确是 two shirts：both 表示两件都要，either 表示任意一件；后句说两件都太贵，因此应选择“两个都不要”的 neither。 语义\"都不要\" → neither（两个都不）。 &nbsp;&nbsp;D(either) 表示任意一件，与“都太贵所以都不要”矛盾。" },
        { stem: "Everybody ______ ready for the exam. Nobody ______ absent today.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（每个人都准备好考试了，今天没人缺席。）</span>", options: ["is; is", "are; are", "is; are", "are; is"], answer: "is; is", explain: "Everybody 和 Nobody 都属于 -body 复合不定代词，作主语时通常按第三人称单数处理 → 都配 is。 别被\"每个人\"\"没有人\"这种\"看起来很多\"的中文意思骗了。" },
        { stem: "— I forgot to bring my umbrella. — Don't worry, I have ______. You can use ______.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我忘带伞了。别急，我有一把，你用吧。）</span>", options: ["one; it", "it; one", "one; one", "it; it"], answer: "one; it", explain: "空一\"我有一把伞\"→ 泛指同类中的一把（不是对方丢的那把）→ one。 空二\"你用这把\"→ 指刚提到的、我这把具体的伞 → it（同一个）。" },
        { stem: "______ of the two boys has ______ new to share at today's meeting.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（这两个男孩中，每一个都有新鲜事要在今天的会上分享。）</span>", options: ["All; anything", "Both; something", "Each; something", "Every; anything"], answer: "Each; something", explain: "① 谓语是 has（单数）→ 主语必须是单数 → Both(复数)、All(复数)排除。 ② the two boys 是\"两个中每一个\" → Each of the two（Every 不能直接接 of）→ 选 Each。 ③ 肯定句 + 形容词 new 后置 → something new。" },
        { stem: "______ can take part in the activity. There is no age limit.", options: ["Anyone", "Someone", "No one", "Everyone of"], answer: "Anyone", explain: "There is no age limit 表示“任何人都可以参加”。anyone 在肯定句中可表示“无论谁、任何人”。" },
        { stem: "Would you like ______ to drink?", options: ["someone", "something", "nothing", "everything"], answer: "something", explain: "这是主动提供饮料的邀请，说话人预期对方可能接受，因此常用 something。" },
        { stem: "______ of the answers was correct, so ______ got full marks.", options: ["No one; none", "None; no one", "Nothing; nobody of", "Nobody; nothing"], answer: "None; no one", explain: "none 可以接 of the answers；no one 指“没有人”，独立作主语。no one of... 不是本题需要的标准结构。" },
        { stem: "______ of the students has a card, and ______ card has a different number.", options: ["Every; each", "Each; every", "Every one; each of", "All; every of"], answer: "Each; every", explain: "第一空需要接 of the students，用 Each；第二空直接修饰单数名词 card，用 every。" },
        { stem: "I have two pens. One is black, and ______ is blue. I need ______ pen for my sister.", options: ["another; the other", "the other; another", "other; another", "others; the other"], answer: "the other; another", explain: "两支笔中剩下的那支用 the other；还要再给妹妹一支，不限定总数，用 another。" },
        { stem: "During group work, some students preferred drawing; ______ preferred writing. There were ten students: two joined Group A, and ______ joined Group B.", options: ["other; others", "others; the others", "other; the other", "another; others"], answer: "others; the others", explain: "第一空泛指另一些学生，用 others；第二空明确共有十人，其中两人进A组，其余八人进B组，用 the others。" },
        { stem: "The weather here is warmer than ______ in the north, and the houses here are smaller than ______ there.", options: ["it; ones", "that; those", "one; them", "this; that"], answer: "that; those", explain: "weather 是不可数名词，比较中用 that 替代；houses 是复数名词，用 those 替代。" }
      ]
    }
  ]
};
