      name: "本讲练习题 · 在线作答（每题4分）",

      items: [
        { stem: "按标准间接引语后移作答：Our teacher told us that he ______ to Beijing the following week.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（我们老师告诉我们他下周要去北京。）</span>", options: ["will go", "would go", "went"], answer: "would go", explain: "第一步：看主句动词。主句用的是 told（告诉，过去式）。大齿轮倒退回了过去！ 第二步：本题按标准间接引语、过去观察点处理，将原话中的 will 后移为 would。若计划在转述时仍有效且还在未来，实际英语也可能保留 will。 第三步：看从句里的时间线索 the following week（下周，是将来的动作）。 第四步：“过去”加“将来”相结合 ➡️ 过去将来时（would + 动词原形）。也就是 would go。" },
        { stem: "The geographer proved that the earth ______ round.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（这位地理学家证实了地球是圆的。）</span>", options: ["is", "be", "are"], answer: "is", explain: "第一步：看主语。主句动词用的是 proved（证实，过去式）。大齿轮退回到过去。 第二步：本题陈述现在仍成立的科学事实，通常保留一般现在时。不能见到主句 proved 就机械后移；选项 B 的 be 不能直接作本句的有限谓语。 第三步：the earth 指地球，按单数处理，因此选 is。按叙述视角作时态后移时，was round 也可能成立，不能把这种表达一概判错。 第四步：客观真理享有例外规则，仍然使用一般现在时。主语 the earth 是单数 ➡️ 选 is。" },
        { stem: "I don't know ______ he will join us tomorrow.", options: ["that", "if", "what"], answer: "if", explain: "从句内容是“他明天会不会加入我们”，本质是一般疑问句，表示“是否”，用 if / whether。" },
        { stem: "Could you tell me ______?", options: ["when will the meeting start", "when the meeting will start", "when does the meeting start"], answer: "when the meeting will start", explain: "宾语从句要用陈述句语序，所以是 when + 主语 + will start，不是 when will...。" },
        { stem: "She asked me where I ______ the day before.", options: ["goes", "has gone", "had gone"], answer: "had gone", explain: "主句是 asked，从句讲“前一天已经去过哪里”，比 asked 更早发生，常用过去完成时 had gone。" },
        { stem: "The teacher told us that pure water ______ at about 100℃ at standard atmospheric pressure.", options: ["boils", "boil", "will boil"], answer: "boils", explain: "在标准大气压下，纯水沸点约为100℃。本题按科学规律的通常陈述用 boils；沸点会随气压变化。" },
        { stem: "We are discussing ______ to take the bus or walk there.", options: ["if", "whether", "that"], answer: "whether", explain: "whether to do 是高频固定场景，表示“是否去做”。这里用 whether to take... 更规范。" }
      ]
    }
