<script>
window.QUIZ = {
  lesson: '29',
  title: "应用2课：情景交际——真实场景里怎么说",
  sections: [
    {
      name: "本讲练习题 · 在线作答（每题4分）",
      perQ: 4,
      type: "choice",
      items: [
        { stem: "— I'm sorry I'm late. — ______<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（对不起我迟到了。—— 没关系。）</span>", options: ["You're welcome.", "Never mind.", "Thank you.", "The same to you."], answer: "Never mind.", explain: "回应道歉用 Never mind（别放心上）或 That's all right。A 是回谢谢的。" },
        { stem: "（电话里）— Hello, ______ — This is Mike.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（喂，你是哪位？—— 我是Mike。）</span>", options: ["who are you?", "what's your name?", "who's that?", "are you Mike?"], answer: "who's that?", explain: "教材式电话对话中，询问对方身份常用 Who's that (speaking)?。Who are you? 语法成立，但电话开场中通常过于直接。答语 This is Mike 也印证了这是电话场景。" },
        { stem: "— The cake is delicious! — Thanks. ______<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（蛋糕真好吃！—— 谢谢，随便吃。）</span>", options: ["Help yourself.", "Never mind.", "It doesn't matter.", "Not at all."], answer: "Help yourself.", explain: "招待客人吃东西，说 Help yourself（请随便吃），不是\"帮你自己\"。这是餐桌固定用语。" },
        { stem: "— Would you like to go to the movies with me? — ______<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（想和我去看电影吗？—— 我很想去，但恐怕不行。）</span>", options: ["Yes, I'd love to.", "I'd love to, but I'm afraid I can't.", "No, I don't like you.", "That's all right."], answer: "I'd love to, but I'm afraid I can't.", explain: "题目是\"想去但去不了\"→ 先说 I'd love to 表意愿，再 but 转折婉拒。这是最得体的拒绝方式。 &nbsp;&nbsp;C 与题目表达的“想去但不能去”不一致，而且语气生硬，不符合得体交际。" },
        { stem: "— Sorry, I broke your cup. — ______ I have another one.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（抱歉，我打碎了你的杯子。—— 没关系，我还有一个。）</span>", options: ["That's right.", "That's all right.", "All right?", "You're right."], answer: "That's all right.", explain: "回应道歉表示\"没关系\"用 That's all right。That's right 是\"对的/正确\"，用在这里意思不通（难道\"你打碎杯子是对的\"？）。一词之差，意思天壤之别。" },
        { stem: "— Could you help me carry this box? — ______", options: ["Yes, I helped you yesterday.", "With pleasure.", "Never mind.", "You're welcome."], answer: "With pleasure.", explain: "对方正在提出请求，With pleasure 表示“很乐意”。My pleasure 通常用于事情完成、对方感谢之后。" },
        { stem: "— Would you mind turning down the music? — ______ I'll do it right away.", options: ["Yes, please.", "Not at all.", "Never mind.", "You're welcome."], answer: "Not at all.", explain: "后句 I'll do it right away 表示愿意配合，因此应说 Not at all，意思是“一点也不介意”。" },
        { stem: "— I didn't pass the exam. — ______ You can try again next time.", options: ["Congratulations!", "I'm sorry to hear that.", "The same to you.", "Yes, I helped you yesterday."], answer: "I'm sorry to hear that.", explain: "没通过考试是坏消息，先表示同情，再鼓励对方，情绪方向必须一致。" },
        { stem: "— Happy New Year! — ______", options: ["The same to you.", "With pleasure.", "Never mind.", "That's right."], answer: "The same to you.", explain: "新年祝福同样适用于对方，所以可以回应 The same to you。" },
        { stem: "— May I speak to Linda, please? — ______", options: ["Speaking.", "I am Linda.", "Yes, you may.", "Who are you?"], answer: "Speaking.", explain: "Linda本人接听时可以直接说 Speaking，表示“我就是”。不是在回答是否获得许可。" },
        { stem: "— Why don't we visit the science museum this Sunday? — ______", options: ["That's a good idea.", "Yes, I helped you yesterday.", "It doesn't matter.", "You're welcome."], answer: "That's a good idea.", explain: "Why don't we...? 是提出建议，That's a good idea 表示赞同建议。" },
        { stem: "— I have a terrible headache. — ______", options: ["You'd better see a doctor.", "Congratulations!", "The same to you.", "Yes, I helped you yesterday."], answer: "You'd better see a doctor.", explain: "对方说自己头痛，合理回应应是关心并提出建议：You'd better see a doctor。" }
      ]
    }
  ]
};
