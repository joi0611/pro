        { stem: "Kate did very ______ in the English exam. She is really a ______ student.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（Kate英语考得很好，她真是个好学生。）</span>", options: ["good; good", "well; good", "good; well", "well; well"], answer: "well; good", explain: "空一：did（做/考）是实义动作 → 用副词 → good的副词是 well。 空二：贴着 student（名词）→ 用形容词 good。" },

        { stem: "The box is ______ heavy ______ the little boy ______ carry.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（箱子太重了，小男孩搬不动。）</span>", options: ["too; for; to", "so; that; to", "too; to; for", "very; to; for"], answer: "too; for; to", explain: "\"太…以至于某人不能…\" 的固定结构：too + 形容词 + for sb + to do。 too heavy for the boy to carry —— 太重了，对男孩来说搬不动。" },
