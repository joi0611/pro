      items: [
        { stem: "By the time we ______ at the station, the train ______.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（等我们到站时，火车已经开走了。）</span>", options: ["arrived; had left", "had arrived; left", "arrive; has left", "arrived; was leaving"], answer: "arrived; had left", explain: "By the time 从句给出过去参照点 arrived；火车开走发生在到站之前，而且题目强调“当时已经离开” → had left。 &nbsp;&nbsp;关键不是词的位置，而是“离开”早于“到达”这个过去参照点。" },
        { stem: "按过去叙述填空：用过去完成时突出锁门已完成，一般过去时表示随后去睡觉。After he ______ the door, he ______ to bed.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（关好门之后，他就去睡觉了。）</span>", options: ["locked; had gone", "had locked; went", "locks; goes", "had locked; had gone"], answer: "had locked; went", explain: "本题指定用过去完成时表示锁门已完成，再用一般过去时叙述去睡觉，选 B。普通叙述也可以用 After he locked the door, he went to bed，不能死记 after 后必须用 had。 &nbsp;&nbsp;不要死记“after 后必用 had”；本题要结合选项和表达重点。" },
        { stem: "I ______ that film. I saw it last week.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我看过那部电影，上周看的。）</span>", options: ["had seen", "have seen", "see", "was seeing"], answer: "have seen", explain: "第一句表达“到现在为止有过观看经历”，用 have seen；第二句再用一般过去时补充具体时间 last week。过去完成时需要过去参照点，这里没有。 &nbsp;&nbsp;过去参照点可以来自同句或上下文，但本题没有建立这样的过去参照。" },
        { stem: "When I got home, my mother ______ dinner already.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我到家时，妈妈已经做好晚饭了。）</span>", options: ["cooked", "has cooked", "had cooked", "was cooking"], answer: "had cooked", explain: "got home 建立过去参照点；晚饭在我到家之前已经做好，already 进一步强调完成结果 → had cooked。" },
        { stem: "将“I lost the book that my friend lent me last week”按标准规则把两个过去时都后移：Tom told me that he ______ the book that his friend ______ him the week before.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（Tom告诉我他弄丢了朋友前一周借给他的书。）</span>", options: ["lost; lent", "had lost; had lent", "lost; had lent", "had lost; lent"], answer: "had lost; had lent", explain: "本题要求将直接引语的两个一般过去时按标准规则后移成过去完成时，填 had lost; had lent。真实叙述中也可用一般过去时表达清楚的先后，不能认定它们在所有语境都错误。 the week before 直接说明“借书”更早；had lost 则表示丢书也早于 told。 ✅ 答案：B（had lost; had lent），按本题指定的标准时态后移作答。" },
        { stem: "The classroom was empty when I entered. All the students ______ home.", options: ["went", "have gone", "had gone", "were going"], answer: "had gone", explain: "entered 建立过去参照点；学生回家发生在进入教室之前，所以用 had gone。参照点来自上一句和 when 从句。" },
        { stem: "By the time the guests arrived, all the food ______.", options: ["had prepared", "had been prepared", "was preparing", "has prepared"], answer: "had been prepared", explain: "食物是 prepare 的承受者，且准备发生在 guests arrived 之前，所以用过去完成时被动：had been prepared。" },
        { stem: "Before she moved to Beijing, she ______ in Shanghai for six years.", options: ["live", "has lived", "had lived", "is living"], answer: "had lived", explain: "本题用 had lived 强调搬家之前已在上海居住六年，选 C。一般过去时 lived 也能在明确先后关系的语境中使用，但本题没有提供该选项。" },
        { stem: "______ five o'clock, we had completed all the tasks; then we waited ______ six.", options: ["Until; by", "By; until", "At; by", "Since; until"], answer: "By; until", explain: "任务在五点前已经完成，用 By；等待持续到六点，用 until。" },
        { stem: "It was the first time that I ______ snow.", options: ["see", "saw", "have seen", "had seen"], answer: "had seen", explain: "主句是 It was the first time，站在过去回看此前经历，从句通常用过去完成时。" }
      ]
    },
    {
      name: "本讲填空练 · 在线作答（每题4分）",

      items: [
        { stem: "下列哪组句子都符合语法？", answer: "正确：①和②", explain: "① before 已说明顺序，两个一般过去时正确；② had finished 更突出离开前已经完成；③ 把现在完成与明确过去动作 left 混在一起，不合适。" },
        { stem: "用适当形式填空：<br>When Leo reached the airport, he realized that he ①______ (leave) his passport at home. The taxi he ②______ (take) had already gone, and check-in for his flight ③______ (close).（到那时已经停止办理值机） Luckily, his brother arrived with the passport because Leo ④______ (call) him on the way.", answer: "had left / had taken（took 也可）/ had closed（had been closed 也可）/ had called（called 也可）。", explain: "① 把护照落在家发生在 realized 之前 → had left ② had taken 突出乘车早于出租车离开；took 也可自然表达，填空题应接受这两种形式。 ③ 值机在当时已关闭，had closed 或 had been closed 都符合语法，分别以主动或被动描述这一结果。 ④ had called 表示来机场途中先打电话；called 也可按已明确的时间关系自然表达。 ✅ 参考答案：had left / had taken（took 也可）/ had closed（had been closed 也可）/ had called（called 也可）。" }
      ]
    }
  ]
