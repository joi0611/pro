        { stem: "The girl under the tree ______ be Lily. She is working in the library now.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（树底下的那个女孩绝对不可能是 Lily。Lily 现在正在图书馆工作呢。）</span>", options: ["mustn't", "can't", "may not"], answer: "can't", explain: "第一步：抓线索。后面说 She is working in the library now.（她现在人正在图书馆工作）。 第二步：人既然在图书馆，那就根据题目线索不可能出现在树底下。 第三步：本题有明确的不在场证据，通常选 can't 表示不可能是他；这里不是 mustn't 所表示的禁止。" },
        { stem: "My sister ______ go to the supermarket. She has to stay at home and look after her baby.<br><span style=\"font-size:14px;font-weight:400;color:#666;\">（我姐姐不能去超市。她不得不待在家里照顾她的小宝宝。）</span>", options: ["can't", "isn't able", "doesn't can"], answer: "can't", explain: "第一步：读懂意思。姐姐必须在家带娃，所以“不能”去超市。 第二步：情态动词的大特权之一：自己加 not 变否定句。`can` 变否定直接加 not 变成 can't。选项 C 写成了 `doesn't can`，把情态动词当成了普通工人雇临时工，结构不对！ 第三步：B 的 isn't able 后缺 to，不能直接接 go；A can't go 结构完整。isn't able to go 原本也符合语法。" },
        { stem: "He can ______ English very well.", options: ["speaks", "speak", "speaking"], answer: "speak", explain: "can 后面必须接动词原形，所以是 speak，不能因为 He 是三单就写 speaks。" },
