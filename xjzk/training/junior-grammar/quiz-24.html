window.QUIZ = {
  lesson: '24',
  title: "衔接3课：数词——把数字说清楚的全套规则",
  sections: [
    {
      name: "本讲练习题 · 在线作答（每题4分）",
      perQ: 4,
      type: "choice",
      items: [
        { stem: "______ of visitors come to the Great Wall every day.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（每天有成百上千的游客来长城。）</span>", options: ["Two hundred", "Hundred", "Hundreds", "Two hundreds"], answer: "Hundreds", explain: "句子意思是\"成百上千\"——模糊多数，不是确切的两百 → 用 hundreds of。 前面没有具体数字，所以 hundred 要加 s 且带 of。 &nbsp;&nbsp;A/D 有确数就不该加 s；D 的 two hundreds 双重错误。" },
        { stem: "______ of the earth ______ covered by water.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（地球的三分之二被水覆盖。）</span>", options: ["Two third; is", "Two thirds; is", "Two thirds; are", "Two third; are"], answer: "Two thirds; is", explain: "第一步分数：分子2 > 1 → 分母序数词加 s → two thirds → 排除 A、D。 第二步谓语：分数 of 后面是 the earth（这里按单数整体处理）→ 谓语用单数 is → 选 B。" },
        { stem: "8:45 用 \"to\" 读法怎么表达？<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（差一刻9点）</span>", options: ["a quarter past eight", "a quarter to nine", "a quarter past nine", "a quarter to eight"], answer: "a quarter to nine", explain: "45分 > 30分 → 分针在\"下坡区\" → 用 to（快到下一点了）。 差多少？60 - 45 = 15分 = a quarter；到哪一点？8 + 1 = nine。" },
        { stem: "Please turn to ______ and look at the picture.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（请翻到第20页看图片。）</span>", options: ["the twenty page", "page twenty", "page twentieth", "twenty page"], answer: "page twenty", explain: "\"编号\"表达用基数词放名词后面：page 20 = page twenty。虽然中文说\"第20页\"，英文不用序数。 page twenty 和 the twentieth page 都可以表示第20页。本题选项中 B 符合前一种编号结构；A、C、D 的词形或语序不正确。" },
        { stem: "— What's the date today? — It's ______.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（今天几号？8月8日。）</span>", options: ["August eight", "August the eighth", "the eight of August", "August eightth"], answer: "August the eighth", explain: "本题要求日期的标准读法，用序数词：eight 已有 t，只加 h 得 eighth。A、C 没有正确使用序数词，D 拼写错误；选 B。日期书写可以用 August 8，不能说书面日期只能写序数词。 C 的序数拼写 eight 也没变序数，错。正确读法 August the eighth。" },
        { stem: "My uncle bought ______ trees and planted them on his farm last month.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我叔叔上个月买了两百棵树种在农场里。）</span>", options: ["two hundreds", "two hundred", "hundreds of", "two hundred of"], answer: "two hundred", explain: "\"两百棵\"是确切数字 → hundred 前有确数 → 不加 s，也不加 of。 排除 A（加了 s）、C（这是\"成百上千\"泛指）、D（有确数不能加 of）。" },
        { stem: "July ______ is my brother's birthday.（7月12日）", options: ["12nd", "12th", "12st", "12rd"], answer: "12th", explain: "日期的“日”用序数词。12属于11/12/13特殊组，一律用th。" },
        { stem: "Tom is a ______ boy.", options: ["twelve years old", "twelve-year-old", "twelve-years-old", "twelve year old"], answer: "twelve-year-old", explain: "数字年龄放在boy前面作修饰语，要用“数字-year-old”，三个部分用连字符连起来，year不加s。" },
        { stem: "3.06 应该怎样读？", options: ["three point six", "three point zero six", "three and six", "three zero point six"], answer: "three point zero six", explain: "小数点读point，小数点后面的数字必须逐个读，0不能漏掉。" },
        { stem: "We need ______ to finish the work.（我们还需要两天完成工作。）", options: ["another two days", "two another days", "two day more", "another two day"], answer: "another two days", explain: "“再两天”可以说 another two days，也可以说 two more days。数字是2，day要用复数days。" },
        { stem: "Lucy was the first student ______ the answer.", options: ["know", "knew", "to know", "knowing"], answer: "to know", explain: "the first/second/last后面表示“第一个做某事”，常接to do。" },
        { stem: "The meeting starts ______ 8:30 ______ the morning of July 16th.", options: ["at; on", "on; at", "in; on", "at; in"], answer: "at; on", explain: "具体钟点8:30前用at；“7月16日的早晨”是被具体日期限定的早晨，用on。" }
      ]
    }
  ]
};
