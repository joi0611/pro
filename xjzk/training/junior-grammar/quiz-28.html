  title: "衔接6课：特殊疑问句——用疑问词精确提问",

    {
      name: "本讲练习题 · 在线作答（每题4分）",
      perQ: 4,
      type: "choice",
      items: [
        { stem: "— ______ water do you drink every day? — About two liters.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（你每天喝多少水？大约两升。）</span>", options: ["How many", "How much", "How long", "How often"], answer: "How much", explain: "water 是不可数名词（呼应第5讲）→ 问\"多少\"用 how much，不用 how many。" },
        { stem: "— ______ will the train arrive? — In ten minutes.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（火车多久后到？十分钟后。）</span>", options: ["How long", "How often", "How soon", "How far"], answer: "How soon", explain: "答语是 In ten minutes（十分钟\"后\"）→ 问\"多久之后发生\"用 how soon。how long 的答语应该是 for ten minutes（持续）。 ✅ 答案：C（How soon）。本题问火车还需多久到达，in ten minutes 表示十分钟后。how long 可以问持续时间或长度；不能只见 in/for 就决定疑问词。" },
        { stem: "对划线部分提问：<br>My father goes to Beijing <u style=\"color:#e74c3c;\">twice a year</u>.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（我爸爸一年去两次北京。）</span>", options: ["How long does your father go to Beijing?", "How often does your father go to Beijing?", "When does your father go to Beijing?"], answer: "How often does your father go to Beijing?", explain: "① 划线 twice a year 是\"频率\" → 用 how often。 ② 剩下变一般疑问句：does your father go。 ③ 组合：How often does your father go to Beijing?" },
        { stem: "对划线部分提问：<br><u style=\"color:#e74c3c;\">Lucy</u> helped the old man cross the road.<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（Lucy帮老人过马路。）</span>", options: ["Who did help the old man cross the road?", "Who helped the old man cross the road?", "Whom did Lucy help?"], answer: "Who helped the old man cross the road?", explain: "划线的 Lucy 是主语 → 用 who 直接代替 Lucy，不使用 do/does/did；原句是一般过去时，所以谓语仍用 helped。 Who（替换 Lucy）+ helped the old man… 直接组合。 &nbsp;&nbsp;A 在普通中性提问中不合适；“Who did help...?” 只有在特别强调、纠正前文时才可能使用，不是本题所需的常规问法。" },
        { stem: "在已给出的两条裙子中选择，选最自然、明确的问法：— ______ dress do you prefer, the red one or the blue one? — The blue one.", options: ["What", "Which", "Whose", "How"], answer: "Which", explain: "题目给出了 red one 和 blue one 两个明确选项，属于有限范围选择，用 which。" },
        { stem: "______ broke the cup? And who did Tom ______?", options: ["Who; help", "Who did; help", "Who; helped", "Whom did; helped"], answer: "Who; help", explain: "第一空 who 作主语，直接接 broke；第二问 Tom 是主语，who 作宾语，did 后用动词原形 help。" },
        { stem: "— ______ is the river? — About 800 kilometers.", options: ["How often", "How soon", "How long", "How many"], answer: "How long", explain: "答语是长度 800 kilometers。how long 除了问持续多久，也可以问“多长”。" },
        { stem: "— ______ schoolbag is this? — It may be Linda's.", options: ["Who", "Whom", "Whose", "Which"], answer: "Whose", explain: "答语 Linda's 表示所属关系，所以用 whose；whose 后面可以直接接名词 schoolbag。" },
        { stem: "询问“和谁一起去”：— Who did you go to the science museum ______? — My brother.", options: ["for", "with", "at", "from"], answer: "with", explain: "go with somebody 表示“和某人一起去”。自然口语中介词 with 常放在句尾：Who did you go with?" },
        { stem: "— ______ your new English teacher ______? — She is patient and humorous.", options: ["How is; like", "What is; like", "What does; look", "How does; like"], answer: "What is; like", explain: "答语 patient and humorous 描述性格特点，用 What is somebody like?" }
      ]
    },
    {
      name: "本讲填空练 · 在线作答（每题4分）",
      perQ: 4,
      type: "fill",
      items: [
        { stem: "选出询问去向的常规独立问句：", answer: "B（Where are you going?），这是询问去向的常规独立问句。其他语序可能用于回声提问等特殊语境，但本题要求常规问法；D 的 Where going are you? 结构错误。", explain: "特殊疑问句 = 疑问词 + 疑问语序（be动词提前）。Where + are you going → be动词 are 在主语 you 前面。 ✅ 答案：B（Where are you going?），这是询问去向的常规独立问句。其他语序可能用于回声提问等特殊语境，但本题要求常规问法；D 的 Where going are you? 结构错误。" },
        { stem: "Could you tell me ______?", answer: "B", explain: "Could you tell me 已经构成主句问句，后面的宾语从句使用陈述语序：the nearest bank is。" }
      ]
    }
  ]
