window.QUIZ = {

  title: "应用1课：构词法与词形变化——给词变形题专项",

    {
      name: "本讲填空练 · 在线作答（每题4分）",
      perQ: 4,
      type: "fill",
      items: [
        { stem: "Her ______ made everyone happy. (kind)<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（她的善良让每个人都开心。）</span>", answer: "kindness", explain: "Her ___ 做主语，且 Her 后面要名词 → kind(形)+ness → kindness。" },
        { stem: "This book is very ______. It helps me a lot. (help)<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（这本书很有用，帮了我很多。）</span>", answer: "helpful", explain: "very 后面需要形容词，后句 It helps me a lot 表示“有帮助的” → helpful。helpless 表示“无助的、无法自助的”，不是“没用的”；“无用的”通常是 useless。" },
        { stem: "______, he passed the exam at last. (lucky)<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（幸运的是，他最终通过了考试。）</span>", answer: "Luckily", explain: "句首修饰全句 → 用副词。lucky 是\"辅音+y\"结尾 → 变 y 为 i 加 ly → luckily。句首首字母大写。" },
        { stem: "The doctor told him to eat more ______ food. (health)<br><span style=\"font-size:14px;font-weight:400;color:#888;\">（医生让他多吃健康的食物。）</span>", answer: "healthy", explain: "___ food，名词 food 前面要形容词 → health+y → healthy。" },
        { stem: "用括号词的适当形式填空：<br>Mike is a good student. He studies ①______ (care) and completes every task ②______ (success). His teacher says his ③______ (kind) to others makes him popular.", answer: "carefully / successfully / kindness", explain: "① studies ___：修饰动作 studies → 副词 → care+fully → carefully ② completes every task ___：修饰 completes，需要副词 → success→successful→successfully → successfully ③ his ___ to others：his 后面 + to 短语，做主语 → 名词 → kind+ness → kindness" },
        { stem: "The fog was so thick that the driver could ______ see the road. (hard)", answer: "hardly", explain: "语境是雾很大，司机“几乎看不见”道路，需要 hardly。hard 表示“努力地、猛烈地”，意思不对。" },
        { stem: "What is the ______ of this bridge? (long)", answer: "length", explain: "本题问桥的长度，用惯用名词 length；结合词义选择词族，不能现场随意拼接后缀。" },
        { stem: "It is ______ to copy another student's work. (honest)", answer: "dishonest", explain: "句意需要“不诚实的”。honest 的固定反义词是 dishonest，不能写 unhonest 或 inhonest。" },
        { stem: "Many important ______ have changed the way we live. (invent)", answer: "inventions", explain: "空格需要名词，invent→invention；many 后接可数名词复数，所以还要加 s。" },
        { stem: "This new method is much ______ than the old one. (use)", answer: "more useful", explain: "系动词后需要形容词 useful；than 和 much 提示比较级，多音节形容词用 more useful。" },
        { stem: "The students were ______ moved by the volunteer's story. (deep)", answer: "deeply", explain: "表示感情上“深受感动”用 deeply。deep 更常表示实际空间或位置上的深。" },
        { stem: "用括号词的适当形式填空：<br>Many students begin reading with great ①______ (excite). Some, however, choose books ②______ (care), without thinking about what they enjoy, and soon lose interest. A good plan can make reading more ③______ (enjoy). It is also ④______ (help) to share ideas with others. With practice, students can become more ⑤______ (confidence) readers.", answer: "excitement / carelessly / enjoyable / helpful / confident", explain: "① with great... 后需要名词 → excitement ② 修饰 choose，且后文说很快失去兴趣，表示选择不认真 → carelessly ③ make reading more... 需要形容词 → enjoyable ④ It is...to do 需要形容词 → helpful ⑤ 修饰复数名词 readers，需要形容词 → confident" }
      ]
    }
