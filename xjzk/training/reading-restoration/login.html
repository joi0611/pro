<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机号登录 | 阅读还原（5选5 / 7选5）</title>
  <link rel="stylesheet" href="./access.css?v=20261117-1">
</head>
<body class="access-page">
  <main class="access-card">
    <small>新疆学生无限进步 · 阅读还原</small>
    <h1>手机号登录</h1>
    <p>请输入老师已授权的手机号，开始学习。</p>
    <form id="studentLogin">
      <label>手机号<input name="phone" type="tel" inputmode="numeric" autocomplete="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required placeholder="请输入11位手机号"></label>
      <button>登录并开始训练</button>
    </form>
    <p class="access-message" id="message" role="status"></p>
    <div class="access-local" id="localPreview" hidden>
      <button type="button" id="previewBtn">本地预览（不登录）</button>
      <small>只在 localhost 出现，线上不会显示。</small>
    </div>
    <p class="access-links">
      <a href="../../index.html">返回训练首页</a>
      <a href="../../teacher/index.html">管理后台</a>
    </p>
    <small>仅凭手机号进入，不发送短信验证码。</small>
  </main>
  <script src="./access.js?v=20261117-1"></script>
</body>
</html>
